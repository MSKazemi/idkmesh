[pytest]
# Single source of truth for test discovery and execution.
#
# `pythonpath = .` removes the long-standing requirement to prefix every
# invocation with `PYTHONPATH=.`; a bare `pytest` now collects and imports
# correctly from the repository root.
pythonpath = .

# Both suites are collected by default. Previously `python -m pytest` from the
# root picked these up implicitly; naming them makes the contract explicit and
# stops an unrelated top-level directory from being swept in later.
testpaths =
    tests
    interop/tests

norecursedirs =
    .git
    .venv
    venv
    .claude
    node_modules
    results
    state
    *.egg-info

python_files = test_*.py
python_classes = *Tests Test*
python_functions = test_*

# --strict-markers turns a typo'd marker into an error instead of a silent
# no-op, which is what keeps the tier markers below trustworthy.
# -ra surfaces skip/xfail reasons that otherwise hide regressions.
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    smoke: sub-second contract and guard checks; the tier-1 gate.
    slow: measured above the tier-2 per-test budget; excluded from the pre-commit tier.
    integration: crosses a module, CLI, or process boundary.
    sim: long-running simulation, sweep, or evidence replay; nightly only.

# `faulthandler_timeout` is deliberately NOT set here, and should not be added.
#
# It looks free -- a per-test hang ceiling that dumps a traceback -- but it arms
# the timeout by starting a faulthandler watchdog thread, which makes the whole
# pytest process multi-threaded for its entire run. `sim/e033_goal_distance.py`
# deliberately parallelises with `multiprocessing.get_context("fork")`, because
# each job re-points the environment's future goal in module globals and so needs
# process isolation. Forking a multi-threaded process is exactly the case CPython
# now warns about: a thread holding a lock at fork time leaves that lock held
# forever in the child, which deadlocks.
#
# Measured, not assumed: with `faulthandler_timeout = 300`, running
# tests/test_e033_goal_distance.py emitted 2 such warnings; with
# `-o faulthandler_timeout=0` the same 69 tests emitted none. The watchdog is a
# C-level thread, so it never appears in `threading.enumerate()` -- the warning is
# the only visible symptom.
#
# Hang detection is not lost. scripts/testkit.py bounds every tier with a
# subprocess timeout (600 s smoke/integration, 1800 s unit) and every one of the
# 49 workflows carries `timeout-minutes`.
