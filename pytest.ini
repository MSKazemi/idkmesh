[pytest]
# `node/` is a separate installable package (`node/pyproject.toml`, src layout) with
# its own CI workflow, `.github/workflows/idkmesh-node-ci.yml`, which installs it via
# `pip install -e node` and runs `python -m unittest discover -s node/tests`.
#
# Collecting `node/tests` from the repository root would import `idkmesh_node`
# without that editable install and fail at collection time, taking the whole root
# suite down with it. The node keeps its own gate; the root suite skips it.
norecursedirs = node .git
