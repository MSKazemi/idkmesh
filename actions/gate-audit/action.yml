name: "IDKMesh Gate Audit"
description: >-
  Measure what a verifier panel is actually worth: effective independent votes
  (not nominal head-count), error-correlation structure, and the breach rate of
  seeded known-bad probes, from a verdict matrix with ground truth. Emits a
  gate-audit-report-v0.1 JSON document and a Markdown summary. Diagnostic only:
  it grants no acceptance or merge authority.
author: "Mohsen Seyedkazemi Ardebili"
branding:
  icon: "shield"
  color: "purple"

inputs:
  votes-file:
    description: >-
      Path to the verdict-matrix JSON file (see
      docs/specifications/GATE_AUDIT_V0_1.md for the contract).
    required: true
  report-file:
    description: Where to write the JSON report.
    required: false
    default: gate-audit-report.json
  markdown-file:
    description: Where to write the Markdown summary.
    required: false
    default: gate-audit-report.md
  job-summary:
    description: Append the Markdown summary to the job summary page.
    required: false
    default: "true"
  python-version:
    description: Python version used to run the audit (needs >= 3.11).
    required: false
    default: "3.12"

outputs:
  report-file:
    description: Path of the emitted JSON report.
    value: ${{ inputs.report-file }}
  markdown-file:
    description: Path of the emitted Markdown summary.
    value: ${{ inputs.markdown-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install idkmesh from this action's repository
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --quiet "${GITHUB_ACTION_PATH}/../.."

    - name: Run gate-audit
      shell: bash
      env:
        VOTES_FILE: ${{ inputs.votes-file }}
        REPORT_FILE: ${{ inputs.report-file }}
        MARKDOWN_FILE: ${{ inputs.markdown-file }}
      run: |
        idkmesh gate-audit "${VOTES_FILE}" --pretty \
          --out "${REPORT_FILE}" --markdown "${MARKDOWN_FILE}"

    - name: Publish job summary
      if: ${{ inputs.job-summary == 'true' }}
      shell: bash
      env:
        MARKDOWN_FILE: ${{ inputs.markdown-file }}
      run: |
        cat "${MARKDOWN_FILE}" >> "${GITHUB_STEP_SUMMARY}"
