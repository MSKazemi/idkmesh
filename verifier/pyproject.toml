[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "idkmesh-verifier"
version = "0.2.0"
description = "EvaluatorPlan-bound low-risk repository-patch verifier for IDKMesh VerificationResult v0.1"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "IDKMesh contributors"}]
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
idkmesh-verify = "idkmesh_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
