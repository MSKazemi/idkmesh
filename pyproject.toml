[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "idkmesh"
version = "0.1.0"
description = "Evidence-first coordination tooling: inspect verified swarm runs, provenance, authority boundaries, and verifier-panel independence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Mohsen Seyedkazemi Ardebili", email = "mohsen.seyedkazemi@gmail.com" },
]
keywords = [
    "verification",
    "llm-as-judge",
    "code-review",
    "verifier-panel",
    "evidence",
    "provenance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately dependency-free: the installable Control Tower and gate-audit
# surfaces use only the standard library, so local inspection and CI diagnostics
# do not require a runtime dependency resolver.
dependencies = []

[project.optional-dependencies]
# Real schema-based verification (experiments/local_verifier.py) needs
# jsonschema. It is an *optional* extra, not a base dependency, so
# `idkmesh gate-audit` stays stdlib-only for every install. See
# docs/decisions/ADR-0012-optional-verification-dependency.md.
verify = ["jsonschema>=4.26,<5"]

[project.urls]
Homepage = "https://mskazemi.com/idkmesh/"
Repository = "https://github.com/MSKazemi/idkmesh"
Issues = "https://github.com/MSKazemi/idkmesh/issues"

[project.scripts]
idkmesh = "idkmesh.cli:main"

[tool.setuptools]
# The repository is a research tree with many top-level directories that are
# not part of the installable product; only the idkmesh package ships.
packages = ["idkmesh"]
