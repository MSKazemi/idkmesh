<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 868 498" width="868" height="498" role="img" aria-labelledby="ti de">
  <title id="ti">IDKMesh zero-project-spend compute admission</title>
  <desc id="de">Compute admission: six offer cost classes feed a policy gate. Local owned, donated, public project CI, grant and free tier pass to an eligible offer, then a selector, then an admitted worker adapter. The paid class is rejected fail-closed.</desc>
  <style>
  .bg{fill:#0d1117;stroke:#30363d;stroke-width:1}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
  .box{fill:#161b22;stroke:#48566b;stroke-width:1.4}
  .box.claim{fill:#2c2517;stroke:#dda44a}
  .box.evidence{fill:#143134;stroke:#3fbcc4}
  .box.authority{fill:#221f3b;stroke:#9990e8}
  .box.deny{fill:#2f1d1a;stroke:#e8796a}
  .stripe{stroke:none}
  .stripe.claim{fill:#dda44a} .stripe.evidence{fill:#3fbcc4}
  .stripe.authority{fill:#9990e8} .stripe.deny{fill:#e8796a}
  .t{fill:#e6edf3;font-size:13px}
  .t.sm{fill:#9198a1;font-size:10.5px}
  .t.tag{font-size:10px;letter-spacing:.1em}
  .t.tag.claim{fill:#dda44a} .t.tag.evidence{fill:#3fbcc4} .t.tag.authority{fill:#9990e8}
  .t.bound,.t.lane{fill:#9198a1;font-size:10.5px}
  .edge{stroke:#48566b;stroke-width:1.6;fill:none}
  .edge.deny{stroke:#e8796a}
  .boundary{stroke:#48566b;stroke-width:1;stroke-dasharray:3 5;fill:none}
  .ah{fill:#48566b} .ah-d{fill:#e8796a}
  .flowline{stroke:#3fbcc4;stroke-width:2;fill:none;stroke-dasharray:5 11}
  .flowline.deny{stroke:#e8796a}
  .halo{fill:none;stroke:#3fbcc4;stroke-width:2.4}
  .token{fill:#3fbcc4} .token.deny{fill:#e8796a}
  @media (prefers-reduced-motion:reduce){
    .flowline,.halo,.token{visibility:hidden}
  }
  </style>
  <rect class="bg" x="-14" y="-14" width="868" height="498" rx="10"/>

            <defs>
              <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" class="ah"></path>
              </marker>
              <marker id="a3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" class="ah-d"></path>
              </marker>
            </defs>

            <rect class="box authority" x="20" y="14" width="800" height="46" rx="8"></rect>
            <rect class="stripe authority" x="20" y="14" width="5" height="46"></rect>
            <text class="t" x="38" y="34">config/compute-policy.json</text>
            <text class="t sm" x="38" y="50">project_spend_usd_max = 0 · paid_providers_enabled = false · donor_costs_must_be_opt_in = true</text>
            <line class="edge" x1="330" y1="60" x2="330" y2="196" marker-end="url(#a3)"></line>
            <text class="t bound" x="338" y="130">applied first —</text>
            <text class="t bound" x="338" y="144">hard ceiling</text>

            <text class="t sm" x="30" y="100">offer pool</text>
            <rect class="box" x="30" y="110" width="170" height="34" rx="6"></rect>
            <text class="t sm" x="115" y="131" text-anchor="middle">local_owned</text>
            <rect class="box" x="30" y="154" width="170" height="34" rx="6"></rect>
            <text class="t sm" x="115" y="175" text-anchor="middle">donated</text>
            <rect class="box" x="30" y="198" width="170" height="34" rx="6"></rect>
            <text class="t sm" x="115" y="219" text-anchor="middle">public_project_ci</text>
            <rect class="box" x="30" y="242" width="170" height="34" rx="6"></rect>
            <text class="t sm" x="115" y="263" text-anchor="middle">grant</text>
            <rect class="box" x="30" y="286" width="170" height="34" rx="6"></rect>
            <text class="t sm" x="115" y="307" text-anchor="middle">free_tier</text>
            <rect class="box deny" x="30" y="330" width="170" height="34" rx="6"></rect>
            <rect class="stripe deny" x="30" y="330" width="5" height="34"></rect>
            <text class="t sm" x="115" y="351" text-anchor="middle">paid</text>

            <g>
              <path class="edge" d="M 200 127 Q 245 127 258 210" marker-end="url(#a3)"></path>
              <path class="edge" d="M 200 171 Q 240 171 256 210" marker-end="url(#a3)"></path>
              <path class="edge" d="M 200 215 L 258 215" marker-end="url(#a3)"></path>
              <path class="edge" d="M 200 259 Q 240 259 256 224" marker-end="url(#a3)"></path>
              <path class="edge" d="M 200 303 Q 245 303 258 228" marker-end="url(#a3)"></path>
            </g>
            <path class="edge deny" d="M 200 347 Q 250 347 260 240" marker-end="url(#a3d)"></path>

            <rect class="box" x="260" y="176" width="140" height="88" rx="8"></rect>
            <text class="t" x="330" y="212" text-anchor="middle">policy gate</text>
            <text class="t sm" x="330" y="230" text-anchor="middle">fail-closed</text>
            <text class="t sm" x="330" y="246" text-anchor="middle">cost class check</text>

            <g>
              <path class="edge" d="M 400 200 Q 440 200 452 168" marker-end="url(#a3)"></path>
              <line class="edge" x1="620" y1="176" x2="620" y2="212" marker-end="url(#a3)"></line>
              <line class="edge" x1="620" y1="272" x2="620" y2="308" marker-end="url(#a3)"></line>
            </g>
            <path class="flowline" d="M 400 200 Q 440 200 450 170"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.1s" repeatCount="indefinite"></animate></path>
            <line class="flowline" x1="620" y1="176" x2="620" y2="210"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.1s" repeatCount="indefinite"></animate></line>
            <line class="flowline" x1="620" y1="272" x2="620" y2="306"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.1s" repeatCount="indefinite"></animate></line>

            <rect class="box evidence" x="452" y="122" width="336" height="46" rx="8"></rect>
            <rect class="stripe evidence" x="452" y="122" width="5" height="46"></rect>
            <text class="t" x="620" y="150" text-anchor="middle">eligible offer</text>

            <rect class="box" x="452" y="212" width="336" height="60" rx="8"></rect>
            <text class="t" x="620" y="233" text-anchor="middle">selector</text>
            <text class="t sm" x="620" y="249" text-anchor="middle">trust · capabilities · resources</text>
            <text class="t sm" x="620" y="263" text-anchor="middle">wait · success · independence</text>

            <rect class="box evidence" x="452" y="308" width="336" height="46" rx="8"></rect>
            <rect class="stripe evidence" x="452" y="308" width="5" height="46"></rect>
            <text class="t" x="620" y="336" text-anchor="middle">admitted worker adapter</text>

            <path class="edge deny" d="M 400 244 Q 440 244 452 400" marker-end="url(#a3d)"></path>
            <path class="flowline deny" d="M 400 244 Q 440 244 450 398"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.1s" repeatCount="indefinite"></animate></path>

            <rect class="box deny" x="452" y="400" width="336" height="46" rx="8"></rect>
            <rect class="stripe deny" x="452" y="400" width="5" height="46"></rect>
            <text class="t" x="620" y="421" text-anchor="middle">rejected</text>
            <text class="t sm" x="620" y="437" text-anchor="middle">schema-representable, policy-disabled</text>

            <circle class="token" r="5.5" opacity="0"><animateMotion dur="4s" begin=".2s" repeatCount="indefinite" path="M 200 215 L 258 215 L 330 215 L 400 200 Q 440 200 452 168 L 620 145 L 620 240 L 620 330" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.7;1"></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.7;0.86;1" dur="4s" begin=".2s" repeatCount="indefinite"></animate></circle>
            <circle class="token deny" r="5.5" opacity="0"><animateMotion dur="4s" begin="1.4s" repeatCount="indefinite" path="M 200 347 Q 250 347 260 240" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.7;1"></animateMotion><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.7;0.86;1" dur="4s" begin="1.4s" repeatCount="indefinite"></animate></circle>
          
</svg>
