openapi: 3.1.0
info:
  title: IDKMesh API v1
  version: "0.1"
  summary: Canonical public API schema catalog and transport contract for IDKMesh v1.
  description: >
    Checked-in OpenAPI 3.1 description of the IDKMesh public JSON API, issue
    #737. Per docs/specifications/API_CONVENTIONS_V0_1.md section 19, OpenAPI
    is the discovery/transport contract and not the sole source of domain
    truth: every public object has a canonical JSON Schema in ./schemas/ and
    this document references those schemas instead of redefining them.
    `components.schemas` maps every contract in that directory to its
    canonical `$id`, so no public API object is defined only by prose or an
    inline Python dictionary. Unresolved references must fail CI.

    Authority ceiling: these surfaces are read/inspect/record only. They
    cannot execute workers, dispatch providers, select candidates, verify,
    accept, push, or merge. Idempotency metadata (idkmesh-idempotency-v0.1)
    deduplicates operations; it never creates work slots or authority
    (section 12). Stable objects are compatibility-gated; breaking changes
    require a version bump and migration note (ADR-0020).
  license:
    name: MIT
x-idkmesh:
  conventions: docs/specifications/API_CONVENTIONS_V0_1.md
  schema_directory: ./schemas
  authority_ceiling: read-inspect-record-only
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Process liveness probe
      description: Returns a minimal liveness response and no project state.
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
  /readyz:
    get:
      summary: Service readiness probe
      description: >
        Returns minimal service/API readiness metadata and no project, run,
        evidence, secret, or identity state.
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-readiness-v0.1"
  /api/v1/status:
    get:
      summary: Discover API capabilities and authority limits
      security:
        - LocalSessionToken: []
      responses:
        "200":
          description: Control Tower status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-control-tower-status-v0.1"
            application/vnd.idkmesh.control-tower.v1+json:
              schema:
                $ref: "#/components/schemas/idkmesh-control-tower-status-v0.1"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/openapi.json:
    get:
      summary: Read this OpenAPI contract
      security:
        - LocalSessionToken: []
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/run-evidence/inspect:
    post:
      summary: Validate and render one Run Evidence Report v0.1
      description: >
        Pure read-only inspection. The same valid input produces the same
        response body and content digest.
      security:
        - LocalSessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/run-evidence-report-v0.1"
          application/vnd.idkmesh.control-tower.v1+json:
            schema:
              $ref: "#/components/schemas/run-evidence-report-v0.1"
      responses:
        "200":
          description: Validated read-only snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-control-tower-inspection-response-v0.1"
            application/vnd.idkmesh.control-tower.v1+json:
              schema:
                $ref: "#/components/schemas/idkmesh-control-tower-inspection-response-v0.1"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/runs:
    get:
      summary: List durable Product Spine runs
      description: >
        Pure read-only, deterministic keyset pagination ordered by run_id.
        Serves the same application service `idkmesh run list` uses. Returns
        503 when no Product Spine store is configured for this server
        instance.
      security:
        - LocalSessionToken: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          required: false
          description: >
            Opaque next-page token from a previous response's page.next_cursor.
            Never constructed or parsed by the caller.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: >
            Exact lifecycle state; an unrecognized value fails with 400
            invalid_state rather than silently matching zero rows.
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: One page of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-list-v0.1"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/runs/{run_id}:
    get:
      summary: Read one durable Product Spine run's current state
      description: >
        Pure read-only. Serves the same application service `idkmesh run
        status` uses, so the CLI and this endpoint can never disagree about a
        run's state.
      security:
        - LocalSessionToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run's current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-control-tower-run-response-v0.1"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/runs/{run_id}/attempts:
    get:
      summary: Read one run's worker/verifier attempts
      description: >
        Pure read-only. `attempts` is a reserved trailing path segment
        (ADR-0019): resolution is a pure function of the path string, never a
        lookup outcome.
      security:
        - LocalSessionToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run's attempts, in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-control-tower-run-attempts-response-v0.1"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/runs/{run_id}/evidence:
    get:
      summary: Read one run's retained evidence references
      description: Pure read-only. `evidence` is a reserved trailing path segment (ADR-0019).
      security:
        - LocalSessionToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run's evidence, in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-control-tower-run-evidence-response-v0.1"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/work-units:
    get:
      summary: List canonical Work Units
      description: >
        Pure read-only, deterministic keyset pagination. Returns 503 when no
        Product Spine store is configured for this server instance.
      security:
        - LocalSessionToken: []
      responses:
        "200":
          description: One page of work units
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-list-v0.1"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/work-units/{work_unit_id}:
    get:
      summary: Read one canonical Work Unit
      security:
        - LocalSessionToken: []
      parameters:
        - name: work_unit_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The work unit's current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-control-tower-work-unit-response-v0.1"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/projects/{project_id}:
    get:
      summary: Read one project's resource projection
      security:
        - LocalSessionToken: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The project's current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-control-tower-project-response-v0.1"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/events:
    get:
      summary: Query the canonical append-only event stream
      description: >
        Pure read-only, deterministic keyset pagination over retained events.
        Returns 503 when no Product Spine store is configured for this server
        instance.
      security:
        - LocalSessionToken: []
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/idkmesh-list-v0.1"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/events/stream:
    get:
      summary: Stream canonical events (resumable SSE)
      description: >
        Server-sent events of the append-only event source. Each event payload
        conforms to the canonical event envelope.
      security:
        - LocalSessionToken: []
      responses:
        "200":
          description: An SSE stream of event envelopes
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/idkmesh-event-v0.1"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    LocalSessionToken:
      type: apiKey
      in: header
      name: X-IDKMesh-UI-Token
      description: >
        Loopback-only local session token. No network/multi-user authentication
        is claimed by this contract (see API_CONVENTIONS_V0_1.md).
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      description: Exact literal run identity; never percent-decoded into sub-resources (ADR-0019).
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request (unsupported parameter, invalid limit/cursor/state, or invalid body)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/idkmesh-api-error-v0.1"
    Forbidden:
      description: Invalid local session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/idkmesh-api-error-v0.1"
    NotAcceptable:
      description: Requested response type unsupported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/idkmesh-api-error-v0.1"
    NotFound:
      description: Unknown resource identity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/idkmesh-api-error-v0.1"
    PayloadTooLarge:
      description: Request body too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/idkmesh-api-error-v0.1"
    Unavailable:
      description: No Product Spine store configured for this server instance
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/idkmesh-api-error-v0.1"
    UnsupportedMediaType:
      description: Request content type unsupported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/idkmesh-api-error-v0.1"
