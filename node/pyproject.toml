[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "idkmesh-node"
version = "0.1.0"
description = "Safe local MVP worker for bounded IDKMesh Work Units"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "IDKMesh contributors"}]

[project.scripts]
idkmesh-node = "idkmesh_node.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
