name: idkgraph-markdown-index

on:
  push:
    paths:
      - "tools/idkgraph_markdown_index.py"
      - "tests/test_idkgraph_markdown_index.py"
      - ".github/workflows/idkgraph-markdown-index.yml"
  pull_request:
    paths:
      - "tools/idkgraph_markdown_index.py"
      - "tests/test_idkgraph_markdown_index.py"
      - ".github/workflows/idkgraph-markdown-index.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused unit tests
        run: python -m unittest discover -s tests -p 'test_idkgraph_markdown_index.py' -v
      - name: Scan repository twice deterministically
        run: |
          python tools/idkgraph_markdown_index.py . --output /tmp/index-a.json
          python tools/idkgraph_markdown_index.py . --output /tmp/index-b.json
          cmp /tmp/index-a.json /tmp/index-b.json
          python -m json.tool /tmp/index-a.json > /dev/null
