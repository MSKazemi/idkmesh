name: idkgraph-markdown-index

on:
  push:
    paths:
      - "tools/idkgraph_markdown_index.py"
      - "tests/test_idkgraph_markdown_index.py"
      - ".github/workflows/idkgraph-markdown-index.yml"
  pull_request:
    paths:
      - "tools/idkgraph_markdown_index.py"
      - "tests/test_idkgraph_markdown_index.py"
      - ".github/workflows/idkgraph-markdown-index.yml"

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: idkgraph-markdown-index-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused unit tests
        run: python -m unittest discover -s tests -p 'test_idkgraph_markdown_index.py' -v
      - name: Scan repository twice deterministically
        run: |
          python tools/idkgraph_markdown_index.py . --output /tmp/index-a.json
          python tools/idkgraph_markdown_index.py . --output /tmp/index-b.json
          cmp /tmp/index-a.json /tmp/index-b.json
          python -m json.tool /tmp/index-a.json > /dev/null
