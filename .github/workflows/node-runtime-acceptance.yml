name: Controlled Node Runtime Acceptance

on:
  pull_request:
    paths:
      - "tools/node_runtime_acceptance.py"
      - "tools/node_runtime_acceptance_current.py"
      - "tools/node_runtime_positive_probe.py"
      - "tools/node_runtime_positive_probe_current.py"
      - "tools/node_verifier_e2e.py"
      - "tools/node_verifier_e2e_current.py"
      - ".github/workflows/node-runtime-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out evaluator-owned acceptance harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: harness
          persist-credentials: false

      - name: Check out corrected frozen PR 91 node candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 520ad2c9aa5825476de4957da4702d6823f4edb3
          path: candidate
          persist-credentials: false

      - name: Verify frozen candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "520ad2c9aa5825476de4957da4702d6823f4edb3"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install evaluator dependency only
        run: python -m pip install "jsonschema>=4.23,<5"

      - name: Preload allowlisted runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine

      - name: Probe positive runtime diagnostics
        shell: bash
        run: python harness/tools/node_runtime_positive_probe_current.py candidate

      - name: Run independent positive and negative acceptance cases
        shell: bash
        run: |
          set -euo pipefail
          python harness/tools/node_runtime_acceptance_current.py \
            --candidate candidate \
            --evidence "$RUNNER_TEMP/idkmesh-node-runtime-evidence.json"

      - name: Publish sanitized evidence to job summary
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/idkmesh-node-runtime-evidence.json"; then
            echo '## Corrected frozen node runtime acceptance evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/idkmesh-node-runtime-evidence.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Acceptance evidence file was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

  real-node-to-independent-verifier:
    needs: frozen-runtime-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evaluator-owned current repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: harness
          persist-credentials: false

      - name: Check out exact frozen node producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 520ad2c9aa5825476de4957da4702d6823f4edb3
          path: candidate
          persist-credentials: false

      - name: Verify producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "520ad2c9aa5825476de4957da4702d6823f4edb3"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency only
        run: python -m pip install "jsonschema>=4.23,<5"

      - name: Preload exact allowlisted runtime image selector
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine

      - name: Generate real node bundle and independently verify it
        shell: bash
        run: |
          set -euo pipefail
          python harness/tools/node_verifier_e2e_current.py \
            --candidate candidate \
            --output-root results/verification/real-node-520ad2c

      - name: Publish node to verifier evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE="harness/results/verification/real-node-520ad2c/e2e-evidence.json"
          VERIFICATION="harness/results/verification/real-node-520ad2c/verification-result.json"
          if test -f "$EVIDENCE"; then
            echo '## Real node -> independent verifier evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$EVIDENCE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Real node -> verifier evidence file was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$VERIFICATION"; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'VerificationResult was generated under evaluator-owned results/.' >> "$GITHUB_STEP_SUMMARY"
          fi

# Security boundary:
# - evaluator workflow is separate from the frozen worker candidate tree;
# - candidate is checked out only by exact SHA;
# - checkout/setup actions are pinned to reviewed immutable commit SHAs;
# - checkout credentials are not persisted;
# - workflow has contents:read and no repository secrets are passed to candidate code;
# - candidate subprocesses receive a sanitized environment from the harness;
# - task containers run under the node's network-none/read-only/cap-drop policy;
# - EvaluatorPlan is constructed outside the candidate bundle after generation;
# - the unified-diff verifier performs metadata-only verification and executes no candidate code;
# - workflow produces evidence only and has no merge/approval/write authority.
