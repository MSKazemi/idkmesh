name: ACE Workflow Hardening Check

on:
  pull_request:
    paths:
      - '.github/workflows/ace-community-growth.yml'
      - '.github/workflows/ace-workflow-hardening-check.yml'
      - 'tests/test_ace_workflow_hardening.py'
      - 'tests/test_ace_live_capacity_model.py'
      - 'docs/security/ACE_THREAT_MODEL.md'
      - 'docs/admin/MAIN_PROTECTION.md'
      - 'docs/community/ACE_CAPACITY_MODEL.md'
      - 'GOVERNANCE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ace-community-growth.yml'
      - '.github/workflows/ace-workflow-hardening-check.yml'
      - 'tests/test_ace_workflow_hardening.py'
      - 'tests/test_ace_live_capacity_model.py'
      - 'docs/security/ACE_THREAT_MODEL.md'
      - 'docs/admin/MAIN_PROTECTION.md'
      - 'docs/community/ACE_CAPACITY_MODEL.md'
      - 'GOVERNANCE.md'

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: ace-workflow-hardening-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run ACE workflow security invariants
        run: python -m unittest tests.test_ace_workflow_hardening -v
      - name: Run ACE live capacity invariants
        run: python -m unittest tests.test_ace_live_capacity_model -v
