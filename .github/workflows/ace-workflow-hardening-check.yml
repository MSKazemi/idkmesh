name: ACE Workflow Hardening Check

on:
  pull_request:
    paths:
      - '.github/workflows/ace-community-growth.yml'
      - '.github/workflows/ace-workflow-hardening-check.yml'
      - 'tests/test_ace_workflow_hardening.py'
      - 'tests/test_ace_live_capacity_model.py'
      - 'docs/security/ACE_THREAT_MODEL.md'
      - 'docs/admin/MAIN_PROTECTION.md'
      - 'docs/community/ACE_CAPACITY_MODEL.md'
      - 'GOVERNANCE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ace-community-growth.yml'
      - '.github/workflows/ace-workflow-hardening-check.yml'
      - 'tests/test_ace_workflow_hardening.py'
      - 'tests/test_ace_live_capacity_model.py'
      - 'docs/security/ACE_THREAT_MODEL.md'
      - 'docs/admin/MAIN_PROTECTION.md'
      - 'docs/community/ACE_CAPACITY_MODEL.md'
      - 'GOVERNANCE.md'

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run ACE workflow security invariants
        run: python -m unittest tests.test_ace_workflow_hardening -v
      - name: Run ACE live capacity invariants
        run: python -m unittest tests.test_ace_live_capacity_model -v
