name: Project Domain Contracts Check

on:
  pull_request:
    paths:
      - 'schemas/project-manifest.schema.json'
      - 'schemas/domain-pack.schema.json'
      - 'examples/domain-packs/**'
      - 'examples/projects/**'
      - 'experiments/project_contracts.py'
      - 'tests/test_project_contracts.py'
      - 'docs/specifications/PROJECT_DOMAIN_INTERFACES.md'
      - '.github/workflows/project-domain-contracts-check.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/project-manifest.schema.json'
      - 'schemas/domain-pack.schema.json'
      - 'examples/domain-packs/**'
      - 'examples/projects/**'
      - 'experiments/project_contracts.py'
      - 'tests/test_project_contracts.py'
      - 'docs/specifications/PROJECT_DOMAIN_INTERFACES.md'
      - '.github/workflows/project-domain-contracts-check.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install schema-validation dependency
        run: python -m pip install -r requirements-phase0.txt

      - name: Compile contract validator and tests
        run: python -m py_compile experiments/project_contracts.py tests/test_project_contracts.py

      - name: Validate two projects on one Core DomainPack boundary
        run: python experiments/project_contracts.py validate

      - name: Run fail-closed composition self-tests
        run: python experiments/project_contracts.py self-test

      - name: Run unit tests
        run: python -m unittest tests.test_project_contracts -v

# Contract validation is configuration-only:
# - no adapter is dynamically imported or executed;
# - no worker/project command is executed;
# - no network/resource discovery is performed by project_contracts.py;
# - no repository secret, mutation, approval, push, or merge authority is granted.
