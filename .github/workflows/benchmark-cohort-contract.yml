name: Benchmark Cohort Contract

on:
  pull_request:
    paths:
      - "schemas/benchmark-cohort-v0.1.schema.json"
      - "tools/benchmark_cohort.py"
      - "docs/specifications/BENCHMARK_COHORT_V0_1.md"
      - "benchmarks/phase-b2-first-five/**"
      - "benchmarks/phase-b2-first-five-v2/**"
      - ".github/workflows/benchmark-cohort-contract.yml"
  push:
    branches: [main]
    paths:
      - "schemas/benchmark-cohort-v0.1.schema.json"
      - "tools/benchmark_cohort.py"
      - "docs/specifications/BENCHMARK_COHORT_V0_1.md"
      - "benchmarks/phase-b2-first-five/**"
      - "benchmarks/phase-b2-first-five-v2/**"
      - ".github/workflows/benchmark-cohort-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install schema dependency
        run: python -m pip install -r requirements-phase0.txt

      - name: Compile benchmark cohort validator
        run: python -m py_compile tools/benchmark_cohort.py

      - name: Run deterministic contract self-test
        run: python tools/benchmark_cohort.py self-test

      - name: Validate burned Phase B2 v1 cohort record
        run: python tools/benchmark_cohort.py validate --cohort benchmarks/phase-b2-first-five/cohort.json

      - name: Validate frozen Phase B2 first-five v2 cohort
        run: python tools/benchmark_cohort.py validate --cohort benchmarks/phase-b2-first-five-v2/cohort.json

# Contract-only safety boundary:
# - no candidate code is executed;
# - no network/secrets/project-paid compute are exposed to a worker;
# - no benchmark outcome is generated or selected;
# - workflow has read-only repository permission and no merge/write authority.
