name: Benchmark Cohort Contract

on:
  pull_request:
    paths:
      - "schemas/benchmark-cohort-v0.1.schema.json"
      - "tools/benchmark_cohort.py"
      - "randomness_lab/r1_readiness.py"
      - "tests/test_r1_readiness.py"
      - "docs/research/R1_CORPUS_READINESS.md"
      - "results/experiments/r1/real-corpus-readiness-current.json"
      - "docs/specifications/BENCHMARK_COHORT_V0_1.md"
      - "benchmarks/**"
      - "tools/benchmark_publication.py"
      - "tests/test_benchmark_publication.py"
      - ".github/workflows/benchmark-cohort-contract.yml"
  push:
    branches: [main]
    paths:
      - "schemas/benchmark-cohort-v0.1.schema.json"
      - "tools/benchmark_cohort.py"
      - "randomness_lab/r1_readiness.py"
      - "tests/test_r1_readiness.py"
      - "docs/research/R1_CORPUS_READINESS.md"
      - "results/experiments/r1/real-corpus-readiness-current.json"
      - "docs/specifications/BENCHMARK_COHORT_V0_1.md"
      - "benchmarks/**"
      - "tools/benchmark_publication.py"
      - "tests/test_benchmark_publication.py"
      - ".github/workflows/benchmark-cohort-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install schema dependency
        run: python -m pip install -r requirements-phase0.txt

      - name: Compile benchmark cohort validator
        run: python -m py_compile tools/benchmark_cohort.py

      - name: Run deterministic contract self-test
        run: python tools/benchmark_cohort.py self-test

      - name: Test R1 corpus readiness gate
        run: python -m unittest tests.test_r1_readiness -v

      - name: Reproduce current blocked R1 readiness audit
        run: |
          python -m randomness_lab.r1_readiness \
            --cohort benchmarks/phase-b2-successor-v2/cohort.json \
            --baseline-signature single-worker-baseline-v2 \
            --diversity-signature single-worker-baseline-v2 \
            --diversity-signature role-specialized-two-attempts-v2 \
            --output /tmp/r1-readiness.json
          cmp results/experiments/r1/real-corpus-readiness-current.json /tmp/r1-readiness.json

      - name: Validate burned Phase B2 first-five cohort
        run: python tools/benchmark_cohort.py validate --cohort benchmarks/phase-b2-first-five/cohort.json

      - name: Validate frozen Phase B2 successor five-task cohort
        run: python tools/benchmark_cohort.py validate --cohort benchmarks/phase-b2-successor-five/cohort.json

      - name: Validate every remaining cohort definition
        run: |
          for cohort in benchmarks/*/cohort.json; do
            echo "validating $cohort"
            python tools/benchmark_cohort.py validate --cohort "$cohort" > /dev/null
          done

      - name: Publish benchmark cohort state and fail on drift
        run: PYTHONPATH=. python tools/benchmark_publication.py --check

      - name: Test the benchmark publication
        run: PYTHONPATH=. python -m pytest -q tests/test_benchmark_publication.py

# Contract-only safety boundary:
# - no candidate code is executed;
# - no network/secrets/project-paid compute are exposed to a worker;
# - no benchmark outcome is generated or selected;
# - workflow has read-only repository permission and no merge/write authority.
