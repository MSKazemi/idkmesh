name: Repository Mathematical Portfolio

on:
  push:
    branches: [main]
    paths:
      - "scripts/repository_portfolio.py"
      - "scripts/evolution_math.py"
      - "scripts/checkpoint_manifest.py"
      - "state/repository-portfolio-policy.json"
      - "state/repository-portfolio-state.json"
      - "state/evolution-math-policy.json"
      - "tests/test_repository_portfolio.py"
      - "tests/test_checkpoint_manifest.py"
      - "tests/test_evolution_checkpoint_validation.py"
      - "tests/test_evolution_workflow_security.py"
      - "docs/architecture/REPOSITORY_MATHEMATICAL_PORTFOLIO.md"
      - ".github/workflows/repository-math-portfolio.yml"
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    paths:
      - "scripts/repository_portfolio.py"
      - "scripts/evolution_math.py"
      - "scripts/checkpoint_manifest.py"
      - "state/repository-portfolio-policy.json"
      - "state/repository-portfolio-state.json"
      - "state/evolution-math-policy.json"
      - "tests/test_repository_portfolio.py"
      - "tests/test_checkpoint_manifest.py"
      - "tests/test_evolution_checkpoint_validation.py"
      - "tests/test_evolution_workflow_security.py"
      - "docs/architecture/REPOSITORY_MATHEMATICAL_PORTFOLIO.md"
      - ".github/workflows/repository-math-portfolio.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    paths:
      - "scripts/repository_portfolio.py"
      - "scripts/evolution_math.py"
      - "scripts/checkpoint_manifest.py"
      - "state/repository-portfolio-policy.json"
      - "state/repository-portfolio-state.json"
      - "state/evolution-math-policy.json"
      - "tests/test_repository_portfolio.py"
      - "tests/test_checkpoint_manifest.py"
      - "tests/test_evolution_checkpoint_validation.py"
      - "tests/test_evolution_workflow_security.py"
      - "docs/architecture/REPOSITORY_MATHEMATICAL_PORTFOLIO.md"
      - ".github/workflows/repository-math-portfolio.yml"
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: "29 6 * * 1,4"

permissions: {}

jobs:
  portfolio:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    concurrency:
      group: repository-math-portfolio-observer
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile and run portfolio invariants
        run: |
          python -m py_compile scripts/evolution_math.py scripts/checkpoint_manifest.py scripts/repository_portfolio.py tests/test_checkpoint_manifest.py tests/test_evolution_checkpoint_validation.py tests/test_evolution_workflow_security.py
          python -m unittest -v tests.test_repository_portfolio tests.test_checkpoint_manifest tests.test_evolution_checkpoint_validation tests.test_evolution_workflow_security
          python -m json.tool state/repository-portfolio-policy.json >/dev/null
          python -m json.tool state/repository-portfolio-state.json >/dev/null

      - name: Find previous trusted-main portfolio checkpoint
        id: previous_portfolio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          selected=""
          selected_head_sha=""
          selected_event=""
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/repository-math-portfolio.yml/runs?branch=${DEFAULT_BRANCH}&status=success&per_page=20")"
          rows="$(jq -r '.workflow_runs[] | select(.event == "issues" or .event == "pull_request_target" or .event == "push" or .event == "workflow_dispatch" or .event == "schedule") | [.id, .head_sha, .event] | @tsv' <<<"$runs")"
          while IFS=$'\t' read -r run_id head_sha run_event; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "invalid workflow run id" >&2; exit 1; }
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid workflow head SHA" >&2; exit 1; }
            [[ "$run_event" =~ ^[a-z_]+$ ]] || { echo "invalid workflow event" >&2; exit 1; }
            artifact_name="repository-portfolio-checkpoint-v2-${run_id}"
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
            count="$(jq --arg name "$artifact_name" \
              '[.artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<<"$artifacts")"
            if [[ "$count" -gt 1 ]]; then
              echo "multiple unexpired checkpoints named ${artifact_name}" >&2
              exit 1
            fi
            if [[ "$count" -eq 1 ]]; then
              selected="$run_id"
              selected_head_sha="$head_sha"
              selected_event="$run_event"
              break
            fi
          done <<<"$rows"
          echo "run_id=${selected}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${selected_head_sha}" >> "$GITHUB_OUTPUT"
          echo "event_name=${selected_event}" >> "$GITHUB_OUTPUT"

      - name: Download previous trusted-main portfolio checkpoint
        if: steps.previous_portfolio.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repository-portfolio-checkpoint-v2-${{ steps.previous_portfolio.outputs.run_id }}
          path: /tmp/previous-portfolio
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous_portfolio.outputs.run_id }}

      - name: Restore portfolio checkpoint or seed
        id: portfolio_checkpoint
        shell: bash
        env:
          SELECTED_RUN_ID: ${{ steps.previous_portfolio.outputs.run_id }}
          SELECTED_HEAD_SHA: ${{ steps.previous_portfolio.outputs.head_sha }}
          SELECTED_EVENT_NAME: ${{ steps.previous_portfolio.outputs.event_name }}
        run: |
          set -euo pipefail
          cp state/repository-portfolio-state.json /tmp/repository-portfolio-state.json
          source="repository-seed"
          if [[ -n "$SELECTED_RUN_ID" ]]; then
            test -f /tmp/previous-portfolio/repository-portfolio-state.json
            test -f /tmp/previous-portfolio/checkpoint-manifest.json
            parent_run_id="$(jq -r '.provenance.parent_run_id // empty' /tmp/previous-portfolio/checkpoint-manifest.json)"
            verify_args=(
              verify
              --manifest /tmp/previous-portfolio/checkpoint-manifest.json
              --repository "$GITHUB_REPOSITORY"
              --workflow repository-math-portfolio.yml
              --run-id "$SELECTED_RUN_ID"
              --head-sha "$SELECTED_HEAD_SHA"
              --event-name "$SELECTED_EVENT_NAME"
              --file repository-portfolio-state.json=/tmp/previous-portfolio/repository-portfolio-state.json
            )
            if [[ -n "$parent_run_id" ]]; then
              verify_args+=(--parent-run-id "$parent_run_id")
            fi
            python scripts/checkpoint_manifest.py "${verify_args[@]}"
            PYTHONPATH=scripts python - \
              /tmp/previous-portfolio/repository-portfolio-state.json \
              state/repository-portfolio-policy.json <<'PY'
          import sys
          from repository_portfolio import load_json, validate_portfolio_state

          validate_portfolio_state(load_json(sys.argv[1]), load_json(sys.argv[2]))
          PY
            cp /tmp/previous-portfolio/repository-portfolio-state.json /tmp/repository-portfolio-state.json
            source="trusted-main-portfolio-artifact:${SELECTED_RUN_ID}"
          fi
          echo "source=${source}" >> "$GITHUB_OUTPUT"

      - name: Find latest trusted evolution checkpoint
        id: evolution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          selected=""
          selected_head_sha=""
          selected_event=""
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/evolution-loop.yml/runs?branch=${DEFAULT_BRANCH}&status=success&per_page=20")"
          rows="$(jq -r '.workflow_runs[] | select(.event == "issues" or .event == "pull_request_target" or .event == "push" or .event == "workflow_dispatch" or .event == "schedule") | [.id, .head_sha, .event] | @tsv' <<<"$runs")"
          while IFS=$'\t' read -r run_id head_sha run_event; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "invalid workflow run id" >&2; exit 1; }
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid workflow head SHA" >&2; exit 1; }
            [[ "$run_event" =~ ^[a-z_]+$ ]] || { echo "invalid workflow event" >&2; exit 1; }
            artifact_name="evolution-checkpoint-v2-${run_id}"
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
            count="$(jq --arg name "$artifact_name" \
              '[.artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<<"$artifacts")"
            if [[ "$count" -gt 1 ]]; then
              echo "multiple unexpired checkpoints named ${artifact_name}" >&2
              exit 1
            fi
            if [[ "$count" -eq 1 ]]; then
              selected="$run_id"
              selected_head_sha="$head_sha"
              selected_event="$run_event"
              break
            fi
          done <<<"$rows"
          echo "run_id=${selected}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${selected_head_sha}" >> "$GITHUB_OUTPUT"
          echo "event_name=${selected_event}" >> "$GITHUB_OUTPUT"

      - name: Download latest trusted evolution checkpoint
        if: steps.evolution.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evolution-checkpoint-v2-${{ steps.evolution.outputs.run_id }}
          path: /tmp/evolution
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.evolution.outputs.run_id }}

      - name: Resolve evolution health state
        id: evolution_checkpoint
        shell: bash
        env:
          SELECTED_RUN_ID: ${{ steps.evolution.outputs.run_id }}
          SELECTED_HEAD_SHA: ${{ steps.evolution.outputs.head_sha }}
          SELECTED_EVENT_NAME: ${{ steps.evolution.outputs.event_name }}
        run: |
          set -euo pipefail
          cp state/evolution-state.json /tmp/evolution-state.json
          source="repository-seed"
          if [[ -n "$SELECTED_RUN_ID" ]]; then
            test -f /tmp/evolution/state/evolution-state.json
            test -f /tmp/evolution/state/evolution-events.jsonl
            test -f /tmp/evolution/state/evolution-checkpoint-manifest.json
            parent_run_id="$(jq -r '.provenance.parent_run_id // empty' /tmp/evolution/state/evolution-checkpoint-manifest.json)"
            verify_args=(
              verify
              --manifest /tmp/evolution/state/evolution-checkpoint-manifest.json
              --repository "$GITHUB_REPOSITORY"
              --workflow evolution-loop.yml
              --run-id "$SELECTED_RUN_ID"
              --head-sha "$SELECTED_HEAD_SHA"
              --event-name "$SELECTED_EVENT_NAME"
              --file evolution-state.json=/tmp/evolution/state/evolution-state.json
              --file evolution-events.jsonl=/tmp/evolution/state/evolution-events.jsonl
            )
            if [[ -n "$parent_run_id" ]]; then
              verify_args+=(--parent-run-id "$parent_run_id")
            fi
            python scripts/checkpoint_manifest.py "${verify_args[@]}"
            PYTHONPATH=scripts python - \
              /tmp/evolution/state/evolution-state.json \
              state/evolution-math-policy.json <<'PY'
          import sys
          from repository_portfolio import load_json, validate_evolution_health_state

          validate_evolution_health_state(load_json(sys.argv[1]), load_json(sys.argv[2]))
          PY
            cp /tmp/evolution/state/evolution-state.json /tmp/evolution-state.json
            source="trusted-main-evolution-artifact:${SELECTED_RUN_ID}"
          fi
          echo "source=${source}" >> "$GITHUB_OUTPUT"

      - name: Snapshot public open issues and pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title,body,labels,comments,createdAt,updatedAt,url,author \
            > /tmp/issues.raw.json
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title,body,labels,comments,createdAt,updatedAt,url,author,isDraft,reviewDecision \
            > /tmp/prs.raw.json
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg generated_at "$generated_at" \
            --slurpfile issues /tmp/issues.raw.json \
            --slurpfile prs /tmp/prs.raw.json \
            '{
              repository: $repository,
              generated_at: $generated_at,
              issues: ($issues[0] | map({
                number, title, body: (.body // ""), labels: [.labels[].name],
                comments_count: (.comments | length), created_at: .createdAt,
                updated_at: .updatedAt, url, author: (.author.login // "unknown")
              })),
              pull_requests: ($prs[0] | map({
                number, title, body: (.body // ""), labels: [.labels[].name],
                comments_count: (.comments | length), created_at: .createdAt,
                updated_at: .updatedAt, url, author: (.author.login // "unknown"),
                is_draft: .isDraft, review_decision: (.reviewDecision // "")
              }))
            }' > /tmp/repository-snapshot.json
          python -m json.tool /tmp/repository-snapshot.json >/dev/null

      - name: Build mathematical portfolio
        run: |
          python scripts/repository_portfolio.py \
            --snapshot /tmp/repository-snapshot.json \
            --state /tmp/repository-portfolio-state.json \
            --evolution-state /tmp/evolution-state.json \
            --math-policy state/evolution-math-policy.json \
            --policy state/repository-portfolio-policy.json \
            --output /tmp/repository-portfolio.json \
            --markdown /tmp/REPOSITORY_PORTFOLIO.md \
            --checkpoint-source '${{ steps.portfolio_checkpoint.outputs.source }};${{ steps.evolution_checkpoint.outputs.source }}' \
            >/tmp/repository-portfolio.stdout.json
          python -m json.tool /tmp/repository-portfolio.json >/dev/null
          python -m json.tool /tmp/repository-portfolio-state.json >/dev/null

      - name: Assemble replayable checkpoint without raw bodies
        env:
          PARENT_RUN_ID: ${{ steps.previous_portfolio.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/repository-portfolio-checkpoint
          cp /tmp/repository-portfolio-state.json /tmp/repository-portfolio-checkpoint/repository-portfolio-state.json
          cp /tmp/repository-portfolio.json /tmp/repository-portfolio-checkpoint/repository-portfolio.json
          cp /tmp/REPOSITORY_PORTFOLIO.md /tmp/repository-portfolio-checkpoint/REPOSITORY_PORTFOLIO.md
          cp state/repository-portfolio-policy.json /tmp/repository-portfolio-checkpoint/repository-portfolio-policy.json
          test ! -e /tmp/repository-portfolio-checkpoint/repository-snapshot.json
          manifest_args=(
            create
            --manifest /tmp/repository-portfolio-checkpoint/checkpoint-manifest.json
            --repository "$GITHUB_REPOSITORY"
            --workflow repository-math-portfolio.yml
            --run-id "$GITHUB_RUN_ID"
            --head-sha "$GITHUB_SHA"
            --event-name "$GITHUB_EVENT_NAME"
            --file repository-portfolio-state.json=/tmp/repository-portfolio-checkpoint/repository-portfolio-state.json
          )
          if [[ -n "$PARENT_RUN_ID" ]]; then
            manifest_args+=(--parent-run-id "$PARENT_RUN_ID")
          fi
          python scripts/checkpoint_manifest.py "${manifest_args[@]}"

      - name: Publish replayable portfolio evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-portfolio-checkpoint-v2-${{ github.run_id }}
          path: /tmp/repository-portfolio-checkpoint/
          if-no-files-found: error
          retention-days: 30

      - name: Publish job summary
        run: cat /tmp/REPOSITORY_PORTFOLIO.md >> "$GITHUB_STEP_SUMMARY"

  verify-pr-head:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    concurrency:
      group: repository-math-portfolio-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out proposed PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Test deterministic portfolio code without live API authority
        run: |
          python -m py_compile scripts/evolution_math.py scripts/checkpoint_manifest.py scripts/repository_portfolio.py tests/test_checkpoint_manifest.py tests/test_evolution_checkpoint_validation.py tests/test_evolution_workflow_security.py
          python -m unittest -v tests.test_repository_portfolio tests.test_checkpoint_manifest tests.test_evolution_checkpoint_validation tests.test_evolution_workflow_security
          python -m json.tool state/repository-portfolio-policy.json >/dev/null
          python -m json.tool state/repository-portfolio-state.json >/dev/null
