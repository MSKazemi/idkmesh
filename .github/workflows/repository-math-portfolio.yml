name: Repository Mathematical Portfolio

on:
  push:
    branches: [main]
    paths:
      - "scripts/repository_portfolio.py"
      - "scripts/evolution_math.py"
      - "state/repository-portfolio-policy.json"
      - "state/repository-portfolio-state.json"
      - "state/evolution-math-policy.json"
      - "tests/test_repository_portfolio.py"
      - "docs/architecture/REPOSITORY_MATHEMATICAL_PORTFOLIO.md"
      - ".github/workflows/repository-math-portfolio.yml"
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    paths:
      - "scripts/repository_portfolio.py"
      - "scripts/evolution_math.py"
      - "state/repository-portfolio-policy.json"
      - "state/repository-portfolio-state.json"
      - "state/evolution-math-policy.json"
      - "tests/test_repository_portfolio.py"
      - "docs/architecture/REPOSITORY_MATHEMATICAL_PORTFOLIO.md"
      - ".github/workflows/repository-math-portfolio.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    paths:
      - "scripts/repository_portfolio.py"
      - "scripts/evolution_math.py"
      - "state/repository-portfolio-policy.json"
      - "state/repository-portfolio-state.json"
      - "state/evolution-math-policy.json"
      - "tests/test_repository_portfolio.py"
      - "docs/architecture/REPOSITORY_MATHEMATICAL_PORTFOLIO.md"
      - ".github/workflows/repository-math-portfolio.yml"
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: "29 6 * * 1,4"

permissions: {}

jobs:
  portfolio:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    concurrency:
      group: repository-math-portfolio-observer
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile and run portfolio invariants
        run: |
          python -m py_compile scripts/evolution_math.py scripts/repository_portfolio.py
          python -m unittest -v tests.test_repository_portfolio
          python -m json.tool state/repository-portfolio-policy.json >/dev/null
          python -m json.tool state/repository-portfolio-state.json >/dev/null

      - name: Find previous trusted-main portfolio checkpoint
        id: previous_portfolio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/repository-math-portfolio.yml/runs?branch=${DEFAULT_BRANCH}&status=success&per_page=20" \
            --jq '.workflow_runs[0].id // empty' || true)"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download previous trusted-main portfolio checkpoint
        if: steps.previous_portfolio.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repository-portfolio-checkpoint-*
          path: /tmp/previous-portfolio
          merge-multiple: true
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous_portfolio.outputs.run_id }}

      - name: Restore portfolio checkpoint or seed
        id: portfolio_checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cp state/repository-portfolio-state.json /tmp/repository-portfolio-state.json
          source="repository-seed"
          if [[ -f /tmp/previous-portfolio/repository-portfolio-state.json ]]; then
            cp /tmp/previous-portfolio/repository-portfolio-state.json /tmp/repository-portfolio-state.json
            source="trusted-main-portfolio-artifact:${{ steps.previous_portfolio.outputs.run_id }}"
          fi
          echo "source=${source}" >> "$GITHUB_OUTPUT"

      - name: Find latest trusted evolution checkpoint
        id: evolution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          selected=""
          for run_id in $(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/evolution-loop.yml/runs?branch=${DEFAULT_BRANCH}&status=success&per_page=20" \
            --jq '.workflow_runs[].id'); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '[.artifacts[] | select(.expired == false and (.name | startswith("evolution-checkpoint-")))] | length' || echo 0)"
            if [[ "$count" -gt 0 ]]; then
              selected="$run_id"
              break
            fi
          done
          echo "run_id=${selected}" >> "$GITHUB_OUTPUT"

      - name: Download latest trusted evolution checkpoint
        if: steps.evolution.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evolution-checkpoint-*
          path: /tmp/evolution
          merge-multiple: true
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.evolution.outputs.run_id }}

      - name: Resolve evolution health state
        id: evolution_checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cp state/evolution-state.json /tmp/evolution-state.json
          source="repository-seed"
          if [[ -f /tmp/evolution/state/evolution-state.json ]]; then
            cp /tmp/evolution/state/evolution-state.json /tmp/evolution-state.json
            source="trusted-main-evolution-artifact:${{ steps.evolution.outputs.run_id }}"
          fi
          echo "source=${source}" >> "$GITHUB_OUTPUT"

      - name: Snapshot public open issues and pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title,body,labels,comments,createdAt,updatedAt,url,author \
            > /tmp/issues.raw.json
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title,body,labels,comments,createdAt,updatedAt,url,author,isDraft,reviewDecision \
            > /tmp/prs.raw.json
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg generated_at "$generated_at" \
            --slurpfile issues /tmp/issues.raw.json \
            --slurpfile prs /tmp/prs.raw.json \
            '{
              repository: $repository,
              generated_at: $generated_at,
              issues: ($issues[0] | map({
                number, title, body: (.body // ""), labels: [.labels[].name],
                comments_count: (.comments | length), created_at: .createdAt,
                updated_at: .updatedAt, url, author: (.author.login // "unknown")
              })),
              pull_requests: ($prs[0] | map({
                number, title, body: (.body // ""), labels: [.labels[].name],
                comments_count: (.comments | length), created_at: .createdAt,
                updated_at: .updatedAt, url, author: (.author.login // "unknown"),
                is_draft: .isDraft, review_decision: (.reviewDecision // "")
              }))
            }' > /tmp/repository-snapshot.json
          python -m json.tool /tmp/repository-snapshot.json >/dev/null

      - name: Build mathematical portfolio
        run: |
          python scripts/repository_portfolio.py \
            --snapshot /tmp/repository-snapshot.json \
            --state /tmp/repository-portfolio-state.json \
            --evolution-state /tmp/evolution-state.json \
            --math-policy state/evolution-math-policy.json \
            --policy state/repository-portfolio-policy.json \
            --output /tmp/repository-portfolio.json \
            --markdown /tmp/REPOSITORY_PORTFOLIO.md \
            --checkpoint-source '${{ steps.portfolio_checkpoint.outputs.source }};${{ steps.evolution_checkpoint.outputs.source }}' \
            >/tmp/repository-portfolio.stdout.json
          python -m json.tool /tmp/repository-portfolio.json >/dev/null
          python -m json.tool /tmp/repository-portfolio-state.json >/dev/null

      - name: Assemble replayable checkpoint without raw bodies
        run: |
          set -euo pipefail
          mkdir -p /tmp/repository-portfolio-checkpoint
          cp /tmp/repository-portfolio-state.json /tmp/repository-portfolio-checkpoint/repository-portfolio-state.json
          cp /tmp/repository-portfolio.json /tmp/repository-portfolio-checkpoint/repository-portfolio.json
          cp /tmp/REPOSITORY_PORTFOLIO.md /tmp/repository-portfolio-checkpoint/REPOSITORY_PORTFOLIO.md
          cp state/repository-portfolio-policy.json /tmp/repository-portfolio-checkpoint/repository-portfolio-policy.json
          test ! -e /tmp/repository-portfolio-checkpoint/repository-snapshot.json

      - name: Publish replayable portfolio evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-portfolio-checkpoint-${{ github.run_id }}
          path: /tmp/repository-portfolio-checkpoint/
          if-no-files-found: error
          retention-days: 30

      - name: Publish job summary
        run: cat /tmp/REPOSITORY_PORTFOLIO.md >> "$GITHUB_STEP_SUMMARY"

  verify-pr-head:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    concurrency:
      group: repository-math-portfolio-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out proposed PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Test deterministic portfolio code without live API authority
        run: |
          python -m py_compile scripts/evolution_math.py scripts/repository_portfolio.py
          python -m unittest -v tests.test_repository_portfolio
          python -m json.tool state/repository-portfolio-policy.json >/dev/null
          python -m json.tool state/repository-portfolio-state.json >/dev/null
