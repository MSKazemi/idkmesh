name: Evaluator plan binding

on:
  pull_request:
    paths:
      - "schemas/evaluator-plan-v0.1.schema.json"
      - "schemas/evaluator-plan-v0.2.schema.json"
      - "verification/fixtures/verifier-smoke-evaluator-plan.json"
      - "verification/fixtures/patch-smoke-evaluator-plan-v0.2.json"
      - "experiments/evaluator_plan_runner.py"
      - "experiments/local_verifier.py"
      - "experiments/provenance_integrity.py"
      - "examples/work-units/local-verifier-smoke.work-unit.json"
      - "examples/work-units/patch-verifier-smoke.work-unit.json"
      - "examples/verifier/**"
      - "tests/test_patch_evaluator_safety.py"
      - "requirements-phase0.txt"
      - ".github/workflows/evaluator-plan-binding.yml"
  push:
    branches: [main]
    paths:
      - "schemas/evaluator-plan-v0.1.schema.json"
      - "schemas/evaluator-plan-v0.2.schema.json"
      - "verification/fixtures/verifier-smoke-evaluator-plan.json"
      - "verification/fixtures/patch-smoke-evaluator-plan-v0.2.json"
      - "experiments/evaluator_plan_runner.py"
      - "experiments/local_verifier.py"
      - "experiments/provenance_integrity.py"
      - "examples/work-units/local-verifier-smoke.work-unit.json"
      - "examples/work-units/patch-verifier-smoke.work-unit.json"
      - "examples/verifier/**"
      - "tests/test_patch_evaluator_safety.py"
      - "requirements-phase0.txt"
      - ".github/workflows/evaluator-plan-binding.yml"

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: evaluator-plan-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Phase 0 dependency
        run: python -m pip install -r requirements-phase0.txt
      - name: Confirm base local verifier fixtures
        run: |
          python experiments/local_verifier.py self-test \
            --good-candidate-root examples/verifier/good/candidate-root \
            --bad-candidate-root examples/verifier/bad/candidate-root
      - name: Verify evaluator sovereignty and JSON binding
        run: python experiments/evaluator_plan_runner.py self-test
      - name: Verify bound unified-diff evaluator backend
        run: python experiments/evaluator_plan_runner.py patch-self-test
      - name: Verify patch evidence completeness failures
        run: python -m unittest tests.test_patch_evaluator_safety -v

# Security note: this workflow remains metadata-only. It parses and hashes
# verifier-owned fixture data, including unified-diff bytes, but never executes
# candidate-controlled code. Evaluator plans and generated verification evidence
# remain outside candidate control; required logs must be complete and digested;
# semantic added-text evidence must come from structurally valid balanced hunks;
# generated output remains restricted to ignored results/; and no secrets/network
# services/merge authority/project-paid compute are introduced.
