name: Nightly full suite

# PR Gate blocks every merge on the `unit` tier only (seconds, not minutes) so a
# one-line docs fix isn't held up by the health of an unrelated simulation. The
# `sim`/`slow` tests that tier excludes -- long-running evidence replays,
# parameter sweeps, and the two tests that shell out to `unittest` discovery
# and pytest collection as subprocesses -- still need to run somewhere. This
# workflow is that somewhere: the complete suite, on a schedule, decoupled from
# the merge path. A failure here means the research content regressed, not
# that any specific pull request is unsafe to merge.
#
# `scripts/testkit.py nightly` runs the `integration` tier (unit tests plus
# the Markdown-link and JSON-schema-syntax checks) and then every `sim`/`slow`
# test, exactly matching what a contributor runs locally with `make nightly`.

on:
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: full suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-phase0.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements-phase0.txt

      - name: Run the complete suite (integration + sim/slow)
        env:
          PYTHONPATH: .
        run: python scripts/testkit.py nightly
