name: idkgraph-repository-mapping

on:
  pull_request:
    paths:
      - "tools/idkgraph_repository_mapping.py"
      - "tests/test_idkgraph_repository_mapping.py"
      - "tests/fixtures/idkgraph_repository_mapping/**"
      - "examples/idkgraph.repository-mapping.example.json"
      - "docs/specifications/IDKGRAPH_REPOSITORY_MAPPING_V0_1.md"
      - "schemas/idkgraph.schema.json"
      - "tools/idkgraph_markdown_index.py"
      - "tools/github_idkgraph_projection.py"
      - "tests/test_github_idkgraph_projection.py"
      - "tests/fixtures/github_idkgraph_snapshot.json"
      - "docs/specifications/GITHUB_IDKGRAPH_PROJECTION_V0_1.md"
      - ".github/workflows/idkgraph-repository-mapping.yml"
  push:
    branches: [main]
    paths:
      - "tools/idkgraph_repository_mapping.py"
      - "tests/test_idkgraph_repository_mapping.py"
      - "tests/fixtures/idkgraph_repository_mapping/**"
      - "examples/idkgraph.repository-mapping.example.json"
      - "docs/specifications/IDKGRAPH_REPOSITORY_MAPPING_V0_1.md"
      - "schemas/idkgraph.schema.json"
      - "tools/idkgraph_markdown_index.py"
      - "tools/github_idkgraph_projection.py"
      - "tests/test_github_idkgraph_projection.py"
      - "tests/fixtures/github_idkgraph_snapshot.json"
      - "docs/specifications/GITHUB_IDKGRAPH_PROJECTION_V0_1.md"
      - ".github/workflows/idkgraph-repository-mapping.yml"

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: idkgraph-repository-mapping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Phase 0 schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-phase0.txt
      - name: Run focused mapper tests
        run: |
          python -m unittest tests.test_idkgraph_repository_mapping -v
          python -m unittest tests.test_github_idkgraph_projection -v
      - name: Generate full repository graph twice
        run: |
          python tools/idkgraph_repository_mapping.py . --output /tmp/repository-graph-a.json
          python tools/idkgraph_repository_mapping.py . --output /tmp/repository-graph-b.json
          cmp /tmp/repository-graph-a.json /tmp/repository-graph-b.json
          python -m json.tool /tmp/repository-graph-a.json > /dev/null
      - name: Validate full generated graph against current schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open('schemas/idkgraph.schema.json', encoding='utf-8'))
          graph = json.load(open('/tmp/repository-graph-a.json', encoding='utf-8'))
          errors = sorted(Draft202012Validator(schema).iter_errors(graph), key=lambda error: list(error.absolute_path))
          if errors:
              for error in errors[:20]:
                  print('/'.join(map(str, error.absolute_path)), error.message)
              raise SystemExit(f'{len(errors)} schema validation error(s)')
          print(f"OK: {len(graph['nodes'])} nodes, {len(graph['hyperedges'])} deterministic relations")
          PY
      - name: Replay GitHub projection twice
        run: |
          python tools/github_idkgraph_projection.py tests/fixtures/github_idkgraph_snapshot.json --output /tmp/github-graph-a.json
          python tools/github_idkgraph_projection.py tests/fixtures/github_idkgraph_snapshot.json --output /tmp/github-graph-b.json
          cmp /tmp/github-graph-a.json /tmp/github-graph-b.json

# T3 is a read-only derivation layer. It does not write back to repository files,
# modify IDKGraph sources, call GitHub APIs, infer semantic relations, or integrate changes.
