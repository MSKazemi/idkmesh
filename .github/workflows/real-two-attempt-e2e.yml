name: Real Two-Attempt Orchestration E2E

on:
  pull_request:
    paths:
      - "tools/real_two_attempt_e2e.py"
      - ".github/workflows/real-two-attempt-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: real-two-attempt-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-two-attempt-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out evaluator/orchestrator stack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: evaluator
          persist-credentials: false

      - name: Check out exact accepted node candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 520ad2c9aa5825476de4957da4702d6823f4edb3
          path: candidate
          persist-credentials: false

      - name: Verify producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "520ad2c9aa5825476de4957da4702d6823f4edb3"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency only
        run: python -m pip install "jsonschema>=4.23,<5"

      - name: Preload allowlisted runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine

      - name: Generate two real bundles, verify, aggregate, and replay
        shell: bash
        run: |
          set -euo pipefail
          python evaluator/tools/real_two_attempt_e2e.py \
            --candidate candidate \
            --output-root results/orchestration/real-two-attempt-520ad2c

      - name: Publish non-selecting evidence summary
        if: always()
        shell: bash
        run: |
          ROOT="evaluator/results/orchestration/real-two-attempt-520ad2c"
          if test -f "$ROOT/e2e-evidence.json"; then
            echo '## Real two-attempt orchestration evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$ROOT/e2e-evidence.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Two-attempt E2E evidence was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$ROOT/evidence-report.md"; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            cat "$ROOT/evidence-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

# Authority boundary:
# - the accepted node producer is checked out only by exact SHA;
# - two worker executions happen outside coordinator core and produce isolated bundles;
# - the coordinator consumes bundles through the execution-neutral result-bundle adapter;
# - one evaluator-owned plan independently verifies every completed candidate;
# - the metadata-only verifier executes no candidate code;
# - run evidence is non-selecting and leaves human_decision pending;
# - repository permissions are read-only, credentials are not persisted, and no secrets are supplied;
# - no push, approval, merge, or automatic candidate-selection authority exists.
