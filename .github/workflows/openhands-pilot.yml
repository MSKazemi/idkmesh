name: OpenHands Manual Pilot

# Manual bootstrap only. The existing agent-ready event path belongs to Jules.
# A maintainer explicitly chooses an already-approved issue for this second
# worker so the same issue is not automatically fanned out to both agents.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open agent-ready issue number to send to OpenHands'
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: openhands-pilot-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate issue approval and build bounded prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          python tools/openhands_pilot.py prepare \
            --issue "${ISSUE_NUMBER}" \
            --prompt-file "${RUNNER_TEMP}/openhands-prompt.md"

      - name: Start and observe OpenHands conversation
        id: openhands
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python tools/openhands_pilot.py dispatch \
            --prompt-file "${RUNNER_TEMP}/openhands-prompt.md" \
            --timeout-seconds 1200 \
            --poll-interval-seconds 30

      - name: Record run evidence
        if: always()
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
          CONVERSATION_ID: ${{ steps.openhands.outputs.conversation-id }}
          CONVERSATION_STATUS: ${{ steps.openhands.outputs.status }}
          CONVERSATION_URL: ${{ steps.openhands.outputs.conversation-url }}
        run: |
          {
            echo "## OpenHands pilot"
            echo
            echo "- issue: #${ISSUE_NUMBER}"
            echo "- source branch: ${SOURCE_BRANCH}"
            echo "- OpenHands conversation: ${CONVERSATION_ID:-not-created}"
            echo "- status: ${CONVERSATION_STATUS:-unknown}"
            if [ -n "${CONVERSATION_URL}" ]; then
              echo "- conversation URL: ${CONVERSATION_URL}"
            fi
            echo
            echo "Agent completion is candidate evidence only; normal IDKMesh verification and human integration still apply."
          } >> "${GITHUB_STEP_SUMMARY}"
