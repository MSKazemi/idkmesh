name: Branch Convergence Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches:
      - main
  # PR lifecycle changes invalidate the previous branch plan, but do not launch
  # an O(branches) rescan. This keeps freshness fail-closed without exhausting
  # the GitHub installation API budget during high PR activity.
  pull_request_target:
    types:
      - opened
      - reopened
      - closed
      - synchronize
      - ready_for_review
      - converted_to_draft
  # Proposed changes to the auditor/planner themselves still execute through the
  # ordinary PR check so the proposed code earns its own deterministic tests.
  pull_request:
    paths:
      - 'tools/branch_convergence_audit.py'
      - 'tools/branch_merge_planner.py'
      - 'tests/test_branch_convergence_audit.py'
      - 'tests/test_branch_merge_planner.py'
      - 'docs/planning/BRANCH_CONVERGENCE_POLICY.md'
      - 'docs/planning/BRANCH_MERGE_EXECUTION_PLAN.md'
      - '.github/workflows/branch-convergence-audit.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Full scans, proposed-code tests, and lightweight PR invalidations have
  # separate groups. Repeated events within one class may supersede stale work,
  # but a cheap invalidation cannot cancel a canonical full scan after it starts.
  group: branch-convergence-${{ github.event_name }}-${{ github.event.number || 'canonical' }}
  cancel-in-progress: true

jobs:
  invalidate:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mark previous branch plan stale
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Branch Steward — PLAN INVALIDATED'
            echo ''
            echo 'A pull-request lifecycle event changed branch/PR state.'
            echo 'The previous full branch plan must be treated as stale.'
            echo ''
            echo "- PR: #${{ github.event.number }}"
            echo "- action: ${{ github.event.action }}"
            echo "- head SHA: ${{ github.event.pull_request.head.sha }}"
            echo "- base SHA observed by event: ${{ github.event.pull_request.base.sha }}"
            echo '- full branch scan: not run on this event (API-budget protection)'
            echo '- merge authorized: false'
            echo ''
            echo 'A full read-only resnapshot runs on the next main push, schedule, or manual dispatch.'
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run deterministic branch planning tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_branch_convergence_audit -v
          python -m unittest tests.test_branch_merge_planner -v
          python tools/branch_merge_planner.py self-test

      - name: Observe GitHub API budget
        id: rate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/idkmesh-branch-audit"
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'idkmesh-branch-audit' / 'rate-limit.json'
          allowed = False
          record = {
              'schema_version': '0.1',
              'minimum_remaining_for_full_scan': 500,
              'allowed': False,
              'remaining': None,
              'limit': None,
              'reset': None,
              'observation_error': None,
              'merge_authorized': False,
          }
          try:
              req = urllib.request.Request(
                  'https://api.github.com/rate_limit',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              core = payload['resources']['core']
              remaining = int(core['remaining'])
              record.update(
                  remaining=remaining,
                  limit=int(core['limit']),
                  reset=int(core['reset']),
              )
              allowed = remaining >= record['minimum_remaining_for_full_scan']
              record['allowed'] = allowed
          except Exception as exc:
              record['observation_error'] = f'{type(exc).__name__}: {exc}'[:300]

          output.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"allowed={'true' if allowed else 'false'}\n")
          PY

      - name: Audit live branch convergence state
        if: steps.rate.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/branch_convergence_audit.py \
            --repo "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch || 'main' }}" \
            --output-json "$RUNNER_TEMP/idkmesh-branch-audit/branch-convergence.json" \
            --output-md "$RUNNER_TEMP/idkmesh-branch-audit/branch-convergence.md"

      - name: Build deterministic branch-to-main execution plan
        if: steps.rate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          python tools/branch_merge_planner.py plan \
            --input-json "$RUNNER_TEMP/idkmesh-branch-audit/branch-convergence.json" \
            --output-json "$RUNNER_TEMP/idkmesh-branch-audit/branch-merge-plan.json" \
            --output-md "$RUNNER_TEMP/idkmesh-branch-audit/branch-merge-plan.md"

      - name: Publish audit and merge-plan summary
        if: always()
        run: |
          RATE="$RUNNER_TEMP/idkmesh-branch-audit/rate-limit.json"
          AUDIT="$RUNNER_TEMP/idkmesh-branch-audit/branch-convergence.md"
          PLAN="$RUNNER_TEMP/idkmesh-branch-audit/branch-merge-plan.md"
          if test -f "$RATE"; then
            echo '### GitHub API budget gate' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RATE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$AUDIT"; then
            cat "$AUDIT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Branch Steward — FULL SCAN BLOCKED' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'No branch convergence report was produced; no merge plan is current and merge authorization remains false.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if test -f "$PLAN"; then
            cat "$PLAN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Branch merge plan was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit and plan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-convergence-${{ github.run_id }}
          path: ${{ runner.temp }}/idkmesh-branch-audit
          retention-days: 14
          if-no-files-found: warn

# Authority boundary:
# - read-only repository and PR permissions;
# - pull_request_target is an API-cheap invalidation event and executes no repository code;
# - a lifecycle invalidation means the prior full plan is stale, never more authoritative;
# - full scans run only on main push, schedule, manual dispatch, or proposed auditor/planner PR tests;
# - low/unknown API budget blocks the full scan and emits no merge plan;
# - no push, merge, approval, branch deletion, label, issue, or settings mutation;
# - no execution of issue/PR natural-language content;
# - branch state and merge-plan lanes are decision support only;
# - the planner always emits merge_authorized=false and direct branch merge=false;
# - current main protection/independent-review requirements remain external gates;
# - no paid-provider fallback or project-funded compute path is introduced.
