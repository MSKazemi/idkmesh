name: Public Discovery Monitor

on:
  page_build:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-discovery-monitor
  cancel-in-progress: false

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require a successful Pages build event
        if: github.event_name == 'page_build'
        env:
          PAGES_STATUS: ${{ github.event.build.status }}
          PAGES_COMMIT: ${{ github.event.build.commit }}
        shell: bash
        run: |
          if [ "$PAGES_STATUS" != "built" ]; then
            echo "Pages build did not succeed: status=$PAGES_STATUS commit=$PAGES_COMMIT" >&2
            exit 1
          fi
          if [ -z "$PAGES_COMMIT" ]; then
            echo "Pages build event did not identify the deployed commit." >&2
            exit 1
          fi

      - name: Check out the deployed repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'page_build' && github.event.build.commit || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Probe public search and answer-engine discovery surface
        shell: bash
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if python tools/check_public_discovery.py; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "Public discovery surface did not converge after bounded retries." >&2
              exit 1
            fi
            echo "Discovery probe attempt $attempt failed after Pages build; retrying for edge propagation."
            sleep 30
          done
