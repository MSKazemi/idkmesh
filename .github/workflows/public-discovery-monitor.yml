name: Public Discovery Monitor

on:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-discovery-monitor
  cancel-in-progress: true

jobs:
  probe:
    name: probe
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the deployed repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Probe public search and answer-engine discovery surface
        shell: bash
        run: |
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if python tools/check_public_discovery.py; then
              exit 0
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "Public discovery surface did not converge after bounded retries." >&2
              exit 1
            fi
            echo "Discovery probe attempt $attempt failed after Pages deployment; retrying for edge propagation."
            sleep 30
          done
