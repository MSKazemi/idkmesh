name: Task 001 real v0.4 transition calibration

on:
  pull_request:
    paths:
      - "tools/task001_real_transition_calibration.py"
      - "verification/fixtures/task001-real-transition-calibration-evaluator-plan-v0.4.json"
      - "experiments/evaluator_plan_runner.py"
      - "experiments/transition_patch_verifier.py"
      - "schemas/evaluator-plan-v0.4.schema.json"
      - "benchmarks/phase-b2-first-five/work-units/task-001-cohort-path-boundary.work-unit.json"
      - "benchmarks/phase-b2-first-five/cohort.json"
      - ".github/workflows/task001-real-transition-calibration.yml"
  push:
    branches: [main]
    paths:
      - "tools/task001_real_transition_calibration.py"
      - "verification/fixtures/task001-real-transition-calibration-evaluator-plan-v0.4.json"
      - "experiments/evaluator_plan_runner.py"
      - "experiments/transition_patch_verifier.py"
      - "schemas/evaluator-plan-v0.4.schema.json"
      - "benchmarks/phase-b2-first-five/work-units/task-001-cohort-path-boundary.work-unit.json"
      - "benchmarks/phase-b2-first-five/cohort.json"
      - ".github/workflows/task001-real-transition-calibration.yml"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evaluator control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: evaluator
          persist-credentials: false

      - name: Check out exact frozen Task 001 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 9c53bb4069a5db1c0688dbbe7a8f028540cbf7c2
          path: source
          persist-credentials: false

      - name: Verify frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "9c53bb4069a5db1c0688dbbe7a8f028540cbf7c2"
          test -z "$(git -C source status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency
        working-directory: evaluator
        run: python -m pip install -r requirements-phase0.txt

      - name: Compile real calibration harness
        working-directory: evaluator
        run: python -m py_compile tools/task001_real_transition_calibration.py

      - name: Calibrate canonical v0.4 against real straightforward fix and inert decoy
        working-directory: evaluator
        run: |
          python tools/task001_real_transition_calibration.py \
            --source ../source \
            --output-root results/verification/task001-real-v04-calibration

      - name: Publish calibration summary
        if: always()
        shell: bash
        run: |
          SUMMARY="evaluator/results/verification/task001-real-v04-calibration/calibration-summary.json"
          if test -f "$SUMMARY"; then
            echo '### Real Task 001 v0.4 calibration' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Calibration summary was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload replayable calibration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task001-real-v04-calibration
          path: evaluator/results/verification/task001-real-v04-calibration/
          if-no-files-found: error
          retention-days: 30

# Evidence and authority boundaries:
# - the control checkout uses the canonical merged EvaluatorPlan v0.4 / verifier 0.3.0 implementation;
# - the candidate source checkout is pinned to the exact original Task 001 source SHA;
# - the burned first-five cohort must still have its original definition digest and all outcomes excluded;
# - the metadata-only verifier parses artifacts and never executes candidate code;
# - behavioral CLI execution is a separate evaluator-owned evidence channel over the isolated frozen-source checkout;
# - the outside-path behavioral probe is self-contained from files present at the frozen source SHA, so later benchmark-control files cannot confound the boundary result;
# - calibration candidates are post-burn calibration objects, not scored benchmark outcomes;
# - permissions are read-only, checkout credentials are not persisted, and no repository secrets are used;
# - no canonical write, push, approval, merge, spending, or automatic candidate-selection authority exists.
