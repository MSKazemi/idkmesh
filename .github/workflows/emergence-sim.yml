permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: emergence-sim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Run emergence tests
        run: python -m pytest -q tests/test_emergence_sim.py tests/test_emergence_sweep.py tests/test_verifier_correlation_sweep.py tests/test_verification_aggregation_sim.py tests/test_e025_learned_verifiers.py tests/test_e015_phase_diagram.py tests/test_e015_quorum_frontier.py tests/test_e016_analyze.py tests/test_e017_item_difficulty.py tests/test_e018_dependence_models.py tests/test_e019_group_independence.py tests/test_e020_quorum_frontier.py tests/test_matched_budget_emergence.py tests/test_e026_archive_contamination.py tests/test_e027_defect_propagation.py tests/test_e028_latent_defect_dimension.py
      - name: Smoke-test simulator JSON
        run: |
          python sim/emergence_sim.py --strategy all --seed 7 --agents 40 --generations 30 --change-at 15 > /tmp/emergence.json
          python -m json.tool /tmp/emergence.json > /dev/null
      - name: Smoke-test imperfect correlated verification
        run: |
          python sim/emergence_sim.py --strategy all --seed 7 --agents 30 --generations 20 --change-at 10 --verifiers 5 --verifier-accuracy 0.75 --verifier-correlation 0.8 > /tmp/correlated.json
          python -m json.tool /tmp/correlated.json > /dev/null
      - name: Smoke-test multi-seed sweep
        run: |
          python sim/run_emergence_sweep.py --seeds 3 --agents 20 --generations 20 --change-at 10 > /tmp/sweep.json
          python -m json.tool /tmp/sweep.json > /dev/null
      - name: Smoke-test matched-budget sweep
        run: |
          python sim/matched_budget_emergence.py --seeds 3 --agents 20 --generations 20 --change-at 10 > /tmp/matched-budget.json
          python -m json.tool /tmp/matched-budget.json > /dev/null
      - name: Smoke-test the E027 defect-propagation channel
        run: |
          python sim/matched_budget_emergence.py --seeds 3 --agents 20 --generations 20 --change-at 10 --imperfect-panel --defect-channel > /tmp/defect-channel.json
          python -m json.tool /tmp/defect-channel.json > /dev/null
          PYTHONPATH=. python sim/e027_defect_propagation.py --mode audit --seed 7 --agents 20 --generations 20 --change-at 10 --panel stress > /tmp/defect-audit.json
          python -m json.tool /tmp/defect-audit.json > /dev/null
      - name: Smoke-test the E028 latent-defect landscape
        run: |
          PYTHONPATH=. python sim/e028_latent_defect_dimension.py --mode parity --samples 5000 > /tmp/e028-parity.json
          python -m json.tool /tmp/e028-parity.json > /dev/null
          PYTHONPATH=. python sim/e028_latent_defect_dimension.py --mode diagnostic --seed 7 \
            --agents 20 --generations 20 --change-at 10 --panel truth-blind > /tmp/e028-diagnostic.json
          python -m json.tool /tmp/e028-diagnostic.json > /dev/null
      - name: Reproduce E015 phase diagram from committed results
        run: |
          python sim/e015_analyze.py experiments/results/E015-verification-phase-diagram-raw.jsonl.gz > /tmp/e015.txt
          # The published headline: an independent panel is worth its nominal size,
          # and a fully correlated panel is worth exactly one verifier.
          grep -q "21.00\|20.99\|21.0" /tmp/e015.txt
          python - <<'EOF'
          import gzip, json, sys
          rows = [json.loads(l) for l in gzip.open(
              "experiments/results/E015-verification-phase-diagram-raw.jsonl.gz", "rt")]
          assert len(rows) == 630, f"expected 630 cells, got {len(rows)}"
          seeds = {r["seeds"] for r in rows}
          assert seeds == {100}, f"unexpected seed counts: {seeds}"
          print(f"E015 artifact intact: {len(rows)} cells")

          full = [json.loads(l) for l in gzip.open(
              "experiments/results/E015-verification-phase-diagram-full-raw.jsonl.gz", "rt")]
          assert len(full) == 2592, f"expected 2592 full-grid cells, got {len(full)}"
          assert {r["seeds"] for r in full} == {150}
          assert sorted({r["quorum"] for r in full}) == [0.5, 0.6, 0.7, 0.8]
          keys = {(r["verifiers"], r["accuracy"], r["correlation"], r["quorum"]) for r in full}
          assert len(keys) == 2592, f"duplicate cells: {len(full) - len(keys)}"
          print(f"E015 full grid intact: {len(full)} cells")
          EOF

      - name: Smoke-test verifier correlation sweep
        run: |
          python sim/run_verifier_correlation_sweep.py --correlations 0,1 --seeds 2 --agents 10 --generations 12 --change-at 6 > /tmp/correlation-sweep.json
          python -m json.tool /tmp/correlation-sweep.json > /dev/null
      - name: Smoke-test independence-aware aggregation
        run: |
          python sim/verification_aggregation_sim.py --correlations 0,1 --seeds 3 --trials 200 > /tmp/aggregation.json
          python -m json.tool /tmp/aggregation.json > /dev/null
      - name: Smoke-test learned verifier calibration
        run: |
          python sim/e025_learned_verifiers.py --histories 40 --seeds 2 --heldout-trials 100 > /tmp/e025.json
          python -m json.tool /tmp/e025.json > /dev/null
