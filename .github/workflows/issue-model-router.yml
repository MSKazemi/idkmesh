name: Issue Model Router

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    # Backfill is recovery only; normal routing is event-driven.
    - cron: '7 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue-model-router.yml'
      - '.github/workflows/jules-dispatch.yml'
      - 'config/llm-routing-policy.json'
      - 'config/jules-dispatch.json'
      - 'scripts/issue_model_router.py'
      - 'tools/jules_dispatcher.py'
      - 'tools/check_jules_contract.py'
  workflow_dispatch:
    inputs:
      backfill_open_issues:
        description: Reclassify every currently open issue
        required: false
        default: true
        type: boolean
      bootstrap_labels:
        description: Create/update the managed routing labels before classification
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: issue-model-router-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      has_jules_candidate: ${{ steps.apply.outputs.has_jules_candidate }}
      routed_issue_number: ${{ steps.apply.outputs.routed_issue_number }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate router syntax
        run: python -m py_compile scripts/issue_model_router.py

      - name: Validate Jules control-plane contract
        run: python tools/check_jules_contract.py

      - name: Bootstrap managed routing labels
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          dispatch_policy = json.loads(
              Path("config/jules-dispatch.json").read_text(encoding="utf-8")
          )
          automatic_label = dispatch_policy["automatic_queue_label"]
          automatic_definition = dispatch_policy["label_definitions"][automatic_label]

          labels = {
              "model:t0-deterministic": ("d4c5f9", "No LLM required; deterministic CI/script lane"),
              "model:t1-small": ("c2e0c6", "Small/cheap model tier is sufficient"),
              "model:t2-standard": ("fef2c0", "Standard balanced model tier"),
              "model:t3-strong": ("f9d0c4", "Strong architecture-aware model tier"),
              "model:t4-peak": ("b60205", "Peak model plus independent review for high-impact work"),
              "model:none": ("eeeeee", "Model capability is not the completion authority for this issue"),
              "authority:agent-candidate": ("0e8a16", "Agent may produce a bounded candidate; normal verification still applies"),
              "authority:human-required": ("5319e7", "Human/external evidence is required to satisfy the issue"),
              "authority:human-gate": ("fbca04", "Human gate must pass before or alongside agent implementation"),
              "authority:deterministic": ("1d76db", "Workflow/script-maintained issue; do not dispatch an LLM"),
              automatic_label: (
                  automatic_definition["color"],
                  automatic_definition["description"],
              ),
          }
          for name, (color, description) in labels.items():
              subprocess.run(
                  ["gh", "label", "create", name, "--color", color, "--description", description, "--force"],
                  check=True,
              )
          PY

      - name: Classify issue event
        if: github.event_name == 'issues'
        run: |
          python scripts/issue_model_router.py \
            --policy config/llm-routing-policy.json \
            --overrides config/issue-model-routing-overrides.json \
            --dispatch-policy config/jules-dispatch.json \
            --event "$GITHUB_EVENT_PATH" \
            > /tmp/issue-model-routes.json

      - name: Classify all open issues
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.backfill_open_issues)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --state open --limit 500 --json number,title,body,labels > /tmp/open-issues.json
          python scripts/issue_model_router.py \
            --policy config/llm-routing-policy.json \
            --overrides config/issue-model-routing-overrides.json \
            --dispatch-policy config/jules-dispatch.json \
            --issues /tmp/open-issues.json \
            > /tmp/issue-model-routes.json

      - name: Apply managed labels
        id: apply
        if: github.event_name == 'issues' || github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.backfill_open_issues)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          dispatch_policy = json.loads(
              Path("config/jules-dispatch.json").read_text(encoding="utf-8")
          )
          automatic_label = dispatch_policy["automatic_queue_label"]
          managed = {
              "model:t0-deterministic", "model:t1-small", "model:t2-standard",
              "model:t3-strong", "model:t4-peak", "model:none",
              "authority:agent-candidate", "authority:human-required",
              "authority:human-gate", "authority:deterministic",
              automatic_label,
          }
          payload = json.loads(Path("/tmp/issue-model-routes.json").read_text(encoding="utf-8"))
          routes = payload.get("routes", [payload])
          rows = []
          has_jules_candidate = False
          routed_issue_number = ""

          for route in routes:
              number = str(route["issue_number"])
              desired = set(route["labels"])
              current = set(route.get("current_labels", []))
              remove = sorted((current & managed) - desired)
              add = sorted(desired - current)

              if remove or add:
                  command = ["gh", "issue", "edit", number]
                  for label in remove:
                      command.extend(["--remove-label", label])
                  for label in add:
                      command.extend(["--add-label", label])
                  subprocess.run(command, check=True)

              if automatic_label in desired:
                  has_jules_candidate = True
                  if len(routes) == 1:
                      routed_issue_number = number

              reason = "; ".join(route["reasons"]).replace("|", "/")
              rows.append(
                  f'| #{number} | {route.get("tier") or "none"} | {route["authority"]} | '
                  f'{route["recommended_lane"]} | {reason} |'
              )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Issue model routing\n\n")
              handle.write("Routing is advisory capability/authority metadata. It does not approve code or grant merge authority.\n\n")
              handle.write("| Issue | Tier | Authority | Lane | Reason |\n")
              handle.write("| --- | --- | --- | --- | --- |\n")
              handle.write("\n".join(rows) + "\n")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"has_jules_candidate={'true' if has_jules_candidate else 'false'}\n")
              handle.write(f"routed_issue_number={routed_issue_number}\n")
          PY

  dispatch-routed-issue:
    needs: route
    if: github.event_name == 'issues' && needs.route.outputs.has_jules_candidate == 'true'
    uses: ./.github/workflows/jules-dispatch.yml
    with:
      issue_number: ${{ needs.route.outputs.routed_issue_number }}
    secrets: inherit

  dispatch-after-manual-backfill:
    needs: route
    if: github.event_name == 'workflow_dispatch' && inputs.backfill_open_issues && needs.route.outputs.has_jules_candidate == 'true'
    uses: ./.github/workflows/jules-dispatch.yml
    with:
      fill_capacity: true
    secrets: inherit

  dispatch-after-control-plane-change:
    needs: route
    if: github.event_name == 'push' && needs.route.outputs.has_jules_candidate == 'true'
    uses: ./.github/workflows/jules-dispatch.yml
    with:
      bootstrap_labels: true
      fill_capacity: true
    secrets: inherit
