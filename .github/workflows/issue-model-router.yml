name: Issue Model Router

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      backfill_open_issues:
        description: Reclassify every currently open issue
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: issue-model-router-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate router
        run: |
          python -m py_compile scripts/issue_model_router.py tests/test_issue_model_router.py
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m pytest -q tests/test_issue_model_router.py

      - name: Ensure managed routing labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import subprocess

          labels = {
              "model:t0-deterministic": ("d4c5f9", "No LLM required; deterministic CI/script lane"),
              "model:t1-small": ("c2e0c6", "Small/cheap model tier is sufficient"),
              "model:t2-standard": ("fef2c0", "Standard balanced model tier"),
              "model:t3-strong": ("f9d0c4", "Strong architecture-aware model tier"),
              "model:t4-peak": ("b60205", "Peak model plus independent review for high-impact work"),
              "model:none": ("eeeeee", "Model capability is not the completion authority for this issue"),
              "authority:agent-candidate": ("0e8a16", "Agent may produce a bounded candidate; normal verification still applies"),
              "authority:human-required": ("5319e7", "Human/external evidence is required to satisfy the issue"),
              "authority:human-gate": ("fbca04", "Human gate must pass before or alongside agent implementation"),
              "authority:deterministic": ("1d76db", "Workflow/script-maintained issue; do not dispatch an LLM"),
              "agent:jules-eligible": ("bfdadc", "Low-risk bounded task routed for automatic Jules dispatch"),
          }
          for name, (color, description) in labels.items():
              subprocess.run(
                  ["gh", "label", "create", name, "--color", color, "--description", description, "--force"],
                  check=True,
              )
          PY

      - name: Classify issue event
        if: github.event_name == 'issues'
        run: |
          python scripts/issue_model_router.py \
            --policy config/llm-routing-policy.json \
            --overrides config/issue-model-routing-overrides.json \
            --event "$GITHUB_EVENT_PATH" \
            > /tmp/issue-model-routes.json

      - name: Classify all open issues
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill_open_issues)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --state open --limit 500 --json number,title,body,labels > /tmp/open-issues.json
          python scripts/issue_model_router.py \
            --policy config/llm-routing-policy.json \
            --overrides config/issue-model-routing-overrides.json \
            --issues /tmp/open-issues.json \
            > /tmp/issue-model-routes.json

      - name: Apply managed labels
        if: github.event_name == 'issues' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill_open_issues)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          managed = {
              "model:t0-deterministic", "model:t1-small", "model:t2-standard",
              "model:t3-strong", "model:t4-peak", "model:none",
              "authority:agent-candidate", "authority:human-required",
              "authority:human-gate", "authority:deterministic",
              "agent:jules-eligible",
          }
          payload = json.loads(Path("/tmp/issue-model-routes.json").read_text(encoding="utf-8"))
          routes = payload.get("routes", [payload])
          rows = []

          for route in routes:
              number = str(route["issue_number"])
              desired = set(route["labels"])
              current_payload = subprocess.check_output(
                  ["gh", "issue", "view", number, "--json", "labels"], text=True
              )
              current = {item["name"] for item in json.loads(current_payload)["labels"]}

              for label in sorted((current & managed) - desired):
                  subprocess.run(["gh", "issue", "edit", number, "--remove-label", label], check=True)
              for label in sorted(desired - current):
                  subprocess.run(["gh", "issue", "edit", number, "--add-label", label], check=True)

              reason = "; ".join(route["reasons"]).replace("|", "/")
              rows.append(
                  f'| #{number} | {route.get("tier") or "none"} | {route["authority"]} | '
                  f'{route["recommended_lane"]} | {reason} |'
              )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## Issue model routing\n\n")
              handle.write("Routing is advisory capability/authority metadata. It does not dispatch a provider, approve code, or grant merge authority.\n\n")
              handle.write("| Issue | Tier | Authority | Lane | Reason |\n")
              handle.write("| --- | --- | --- | --- | --- |\n")
              handle.write("\n".join(rows) + "\n")
          PY

      - name: Kick Jules dispatcher after routing
        if: github.event_name == 'issues' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backfill_open_issues)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run jules-dispatch.yml --ref "${{ github.event.repository.default_branch }}"
