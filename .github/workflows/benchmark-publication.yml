name: Publish Benchmark Snapshot

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "schemas/benchmark-cohort-v0.1.schema.json"
      - "tools/benchmark_cohort.py"
      - "tools/benchmark_publication.py"
      - "requirements-phase0.txt"
      - ".github/workflows/benchmark-publication.yml"
  workflow_dispatch:

# Publication is deliberately isolated from pull_request events. A proposed
# change may validate the publication contract, but only a commit that has
# reached protected main may create a public release/tag.
permissions:
  contents: write

concurrency:
  group: benchmark-publication-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install benchmark contract dependency
        run: python -m pip install -r requirements-phase0.txt

      - name: Verify benchmark publication is reproducible
        run: PYTHONPATH=. python tools/benchmark_publication.py --check

      - name: Re-run benchmark publication contract tests
        run: python -m unittest tests.test_benchmark_publication -v

      - name: Publish immutable benchmark snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: benchmark-cohort-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          expected_sha="${GITHUB_SHA}"

          # `gh api` writes the JSON body of a 404 to stdout on the hosted
          # runner, so `... || true` can accidentally turn a missing tag into
          # a non-empty "tag SHA". Query the public Git remote instead:
          # - an absent tag is a successful lookup with empty output;
          # - a network/protocol failure is non-zero and, with pipefail, stops
          #   publication rather than being mistaken for absence.
          tag_ref="$(
            git ls-remote --refs --tags \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/${RELEASE_TAG}" |
              awk '{print $1}'
          )"

          # Never move or reuse a release tag. A collision means the public
          # provenance chain is inconsistent and must be investigated.
          if [[ -n "${tag_ref}" && "${tag_ref}" != "${expected_sha}" ]]; then
            echo "release tag ${RELEASE_TAG} points to ${tag_ref}, expected ${expected_sha}" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [[ "${tag_ref}" != "${expected_sha}" ]]; then
              echo "release ${RELEASE_TAG} exists without the expected immutable tag" >&2
              exit 1
            fi
            echo "benchmark snapshot ${RELEASE_TAG} is already published"
            exit 0
          fi

          target_args=(--target "${expected_sha}")
          if [[ -n "${tag_ref}" ]]; then
            # The tag already exists and was checked above; reuse it without
            # asking GitHub to create or retarget anything.
            target_args=(--verify-tag)
          fi

          gh release create "${RELEASE_TAG}" \
            "benchmarks/PUBLICATION.md#benchmark-publication.md" \
            "benchmarks/publication.json#benchmark-publication.json" \
            --repo "${GITHUB_REPOSITORY}" \
            "${target_args[@]}" \
            --latest=false \
            --title "Benchmark cohort snapshot ${expected_sha:0:12}" \
            --notes-file benchmarks/PUBLICATION.md

# Scientific boundary:
# - the release republishes byte-for-byte committed, contract-checked artifacts;
# - it never generates/selects benchmark outcomes or computes a new score;
# - a release is a distribution/provenance surface, not additional evidence;
# - the tag embeds the exact protected-main SHA and is never retargeted.
