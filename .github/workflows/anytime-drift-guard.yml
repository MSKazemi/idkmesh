name: Anytime Drift Guard

on:
  push:
    branches: [main]
    paths:
      - "scripts/anytime_drift_guard.py"
      - "tests/test_anytime_drift_guard.py"
      - "scripts/sequential_evidence.py"
      - "tests/test_sequential_evidence.py"
      - "docs/architecture/ANYTIME_DRIFT_GUARD.md"
      - "docs/conversations/2026-08-28-anytime-drift-guard-continuation.md"
      - ".github/workflows/anytime-drift-guard.yml"
  pull_request:
    paths:
      - "scripts/anytime_drift_guard.py"
      - "tests/test_anytime_drift_guard.py"
      - "scripts/sequential_evidence.py"
      - "tests/test_sequential_evidence.py"
      - "docs/architecture/ANYTIME_DRIFT_GUARD.md"
      - "docs/conversations/2026-08-28-anytime-drift-guard-continuation.md"
      - ".github/workflows/anytime-drift-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anytime-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify on Python 3.11
        run: |
          python --version
          python -m py_compile scripts/anytime_drift_guard.py tests/test_anytime_drift_guard.py
          python -m unittest -v tests.test_anytime_drift_guard tests.test_sequential_evidence
          python scripts/anytime_drift_guard.py --demo --output /tmp/anytime-drift-demo-py3.11.json >/dev/null
          python -m json.tool /tmp/anytime-drift-demo-py3.11.json >/dev/null

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify on Python 3.13
        run: |
          python --version
          python -m py_compile scripts/anytime_drift_guard.py tests/test_anytime_drift_guard.py
          python -m unittest -v tests.test_anytime_drift_guard tests.test_sequential_evidence
          python scripts/anytime_drift_guard.py --demo --output /tmp/anytime-drift-demo-py3.13.json >/dev/null
          python -m json.tool /tmp/anytime-drift-demo-py3.13.json >/dev/null

      - name: Verify cross-interpreter determinism and control invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path('/tmp/anytime-drift-demo-py3.11.json'),
              Path('/tmp/anytime-drift-demo-py3.13.json'),
          ):
              payload = json.loads(path.read_text())
              invariants = payload['invariants']
              assert invariants['stable_constant_has_no_alarm'] is True
              assert invariants['persistent_shift_is_detected'] is True
              assert invariants['drift_blocks_nomination'] is True
              assert invariants['hard_guard_non_compensation'] is True
              assert invariants['history_is_preserved'] is True
              assert invariants['integration_authority'] is False
          PY

          cmp -s /tmp/anytime-drift-demo-py3.11.json /tmp/anytime-drift-demo-py3.13.json
          hash_311="$(sha256sum /tmp/anytime-drift-demo-py3.11.json | cut -d' ' -f1)"
          hash_313="$(sha256sum /tmp/anytime-drift-demo-py3.13.json | cut -d' ' -f1)"
          test "$hash_311" = "$hash_313"
          printf '%s  anytime-drift-demo.json\n' "$hash_311" > /tmp/anytime-drift-demo.sha256

      - name: Publish drift evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anytime-drift-${{ github.run_id }}
          path: |
            /tmp/anytime-drift-demo-py3.11.json
            /tmp/anytime-drift-demo-py3.13.json
            /tmp/anytime-drift-demo.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish job summary
        shell: bash
        run: |
          {
            echo "## Anytime Drift Guard"
            echo
            echo "Python 3.11 and 3.13 both passed drift + sequential evidence invariants."
            echo
            echo "Actual JSON payloads were compared byte-for-byte across interpreters."
            echo
            echo "Content digest: \`$(cut -d' ' -f1 /tmp/anytime-drift-demo.sha256)\`"
            echo
            echo "Detected drift blocks nomination; it does not delete history or grant integration authority."
            echo
            echo '```json'
            cat /tmp/anytime-drift-demo-py3.13.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
