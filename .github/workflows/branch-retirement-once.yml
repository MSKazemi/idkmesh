name: One-time branch retirement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-retirement-once.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-retirement-once
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main for workflow-reference guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Retire exact-head verified branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          candidates = json.loads(r'''[{"branch":"community-first-foundation","expected_sha":"46ce176d244eb10740f66ae5506c6b8372ea9335","state":"integrated-via-pr"},{"branch":"evolution-2026-08-28","expected_sha":"fd5bd9087d48552074f7d35dd237e3f05e4951d9","state":"integrated-via-pr"},{"branch":"fix/issue-3-workunit-contract","expected_sha":"8ade58277947c495522037e37327d8df8c348308","state":"integrated-via-pr"},{"branch":"feature/github-reflex-observatory","expected_sha":"d63e36810b355f0d1e204c7979e09336528185a0","state":"orphan-no-unique-commits"},{"branch":"feat/randomness-lab-foundation","expected_sha":"ff614d10a41156ea493392bc073ccfdf09c656fa","state":"integrated-via-pr"},{"branch":"feat/verification-result-backpressure","expected_sha":"abd6d7c2414ead6ca2fd16d0c5705442a881f745","state":"integrated-via-pr"},{"branch":"feat/r1-swarm-diversity","expected_sha":"db71e87d73d4821da903a74b6a96839e8af24f14","state":"integrated-via-pr"},{"branch":"feat/r1-help-hurt-sweep","expected_sha":"22047159a1d88c3e2dcd45ee8f374a3e7bf8618c","state":"integrated-via-pr"},{"branch":"fix/verification-provenance-binding","expected_sha":"a5be1b0904c44e4dda53606f08c3da164350893e","state":"integrated-via-pr"},{"branch":"research/correlated-verifiers","expected_sha":"4c62d1980bca5dbfabf50535985d869198a766d8","state":"integrated-via-pr"},{"branch":"feat/independence-aware-verification","expected_sha":"05fa3f682f55d4f9b79ef4e299e491357dcb1a4a","state":"integrated-via-pr"},{"branch":"research/independence-aware-aggregation","expected_sha":"9b87345bd13c22671f06d64d8e0db7c4f7dc32ba","state":"integrated-via-pr"},{"branch":"fix/replayable-e2e-evidence-current-main","expected_sha":"838add59ab9d92bfbfdd8e088ce61cfded03305e","state":"integrated-via-pr"},{"branch":"integration/active-compute-current-main-20260828","expected_sha":"8399bf944a7a81b8a692d1cc77bbda5a072701cf","state":"integrated-via-pr"},{"branch":"feature/free-resource-mesh","expected_sha":"84223d2c02226b8aaa57eaaac74bce08b9d31ce6","state":"