name: One-time branch retirement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-retirement-once.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-retirement-once
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main for workflow-reference guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Retire remaining canonical exact-head candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          candidates = [
            {"branch":"acceptance/real-mixed-outcome-current-main","expected_sha":"70c20a6d195925195d63d676df89631c120bb83e"},
            {"branch":"acceptance/real-two-attempt-520ad2c","expected_sha":"2fb282dd37639ed5e290bac91f44e9f2486130dd"},
            {"branch":"ace-activation-gate-v0","expected_sha":"5792aced517ed6c9103dca9462c63c6cb21ec34f"},
            {"branch":"ace-activity-metabolism","expected_sha":"71b32fa604dd1cbc300af20afed62da98f75af69"},
            {"branch":"ace-cohort-observer-refresh","expected_sha":"2ba12b3634be8be4b06ba5330e29f5b8c660fed8"},
            {"branch":"ace-lineage-refresh","expected_sha":"7eba2b820a79f2c270aec9a164aff2147c68110f"},
            {"branch":"ace-lineage-simulation-v0","expected_sha":"7749a4a019e1ed3a91227e68715a0f06905791f5"},
            {"branch":"ace-live-capacity-v0","expected_sha":"540e173f4a0565351acf362398e4f0443deca4ee"},
            {"branch":"audit/first-contact-mode","expected_sha":"814095aba5c9d45a96d3bd0e60c2573c1524d564"},
            {"branch":"ci/cover-e015-in-emergence-workflow","expected_sha":"89285532e723169b8f26211659485126b675144d"},
            {"branch":"cleanup/remove-task001-one-shot-harness","expected_sha":"08fc52dc0fbf5d59553d5e6be0d37c3511b7f48a"},
            {"branch":"evolution/repository-observatory-current-main","expected_sha":"9b52421e6158b3cb1800042824b551e81ddaa8c2"},
            {"branch":"experiment/ace-live-open-work-population-v1","expected_sha":"7a6c65209e4fd32cdf5fb20b30e3e93e52202ea8"},
            {"branch":"experiment/e015-cost-weighted-quorum","expected_sha":"cdb394e0ff232d20afab7aa7829bc769f0156b19"},
            {"branch":"experiment/phase-b2-successor-task001-attempt1","expected_sha":"bcd3ad77cbd4d20339b4236ab2e5d785a63629db"},
            {"branch":"experiment/r2-reference-scale","expected_sha":"7fd95c99920b4141723795ad14a160bbe185d6ee"},
            {"branch":"experiment/r3-reference-seed42","expected_sha":"2b04e49ad3e0c15f74555b2211b0675877633b69"},
            {"branch":"experiment/task001-v04-real-calibration","expected_sha":"c4e4810c618a0ab840e22727724937a6dcb40513"},
            {"branch":"experiment/verification-backpressure-benchmark","expected_sha":"3c209a1a572200ed893ff7d9a1a951aa115465bb"},
            {"branch":"feat/evaluator-plan-binding","expected_sha":"346c9b909744003bc9ca2a0e88d5e21c9a468b42"},
            {"branch":"feat/mathematical-evolution-kernel","expected_sha":"0d28a0ffb1e80ea8e88469883bcc4f5092fad6ed"},
            {"branch":"feat/r1-real-result-replay","expected_sha":"a0c3acb262f182998ff0f96d31c953cc99437985"},
            {"branch":"feat/r2-scale-sweep","expected_sha":"10a8506364b21fdd63dd14077e3c4150e821cdda"},
            {"branch":"feat/r2-scheduling-churn","expected_sha":"1ac96574440e7d663542d20c37d0ecd28355b46a"},
            {"branch":"feat/r3-evolutionary-orchestration","expected_sha":"1c66ce12c135b4099e0e1ba4bcb4f526393f25a9"},
            {"branch":"feat/r4-stigmergic-routing","expected_sha":"fd082c3bf7074ff497ebd0da22d3c9635f6f0dfb"},
            {"branch":"feat/repository-math-portfolio","expected_sha":"6da6e5bcb0a7d237a7b509034f651ecde5d53b2a"},
            {"branch":"feature/benchmark-cohort-contract-v1","expected_sha":"3400594292f1250fe89f2c45399a21de8c24fc9f"},
            {"branch":"feature/evaluator-plan-patch-backend-v2","expected_sha":"29e742cfce8c37522257690e715bc8f2cf3801fc"},
            {"branch":"feature/evaluator-plan-v0.3-semantic-contract","expected_sha":"a5e41dfc470e001d33dee18a6b795f1b91843d22"},
            {"branch":"feature/evaluator-plan-v0.4-transition-semantics","expected_sha":"f21313754528e3e739c9850ff7a77db401c3b202"},
            {"branch":"feature/free-resource-mesh-v0","expected_sha":"9a9a7cec9a3d3161731589e9cfb8005b88d64cd9"},
            {"branch":"feature/local-verifier-mvp","expected_sha":"ee074abf275cb063651f629c337815dafa325bb8"},
            {"branch":"feature/pr91-controlled-docker-harness","expected_sha":"eda602f82f522c5b59a3db638472387d09795212"},
            {"branch":"feature/run-evidence-replay-v0","expected_sha":"9c5f10c9b373b6a410437fadedd3d39d7d96b8f2"},
            {"branch":"feature/two-attempt-orchestrator","expected_sha":"27ced7d026ea921ad79ef831acbed6b4675d6164"},
            {"branch":"fix/adversarial-evidence-nonfinite-inputs","expected_sha":"d03697be18a3c913ef5b295299e824b2c8203204"},
            {"branch":"fix/local-verifier-output-boundary-v2","expected_sha":"9bb0f22d505924be00d7825e37892e268c3fc412"},
            {"branch":"fix/replayable-e2e-evidence-unified","expected_sha":"ae1f2676ec19d68460aa8e44be873b88dbce3939"},
            {"branch":"integration/real-two-attempt-evidence-v0","expected_sha":"90ecf15c5162099ee8896cfcf06d33e75714f4c2"}
          ]

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          self_workflow = Path(".github/workflows/branch-retirement-once.yml")
          result_path = Path(os.environ["RUNNER_TEMP"]) / "branch-retirement-result.json"

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls?state=open&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              open_heads = {item["head"]["ref"] for item in json.load(response)}

          def branch_heads():
              proc = subprocess.run(
                  ["git", "ls-remote", "--heads", f"https://github.com/{repo}.git"],
                  check=True, text=True, stdout=subprocess.PIPE,
              )
              heads = {}
              for line in proc.stdout.splitlines():
                  sha, ref = line.split("\t", 1)
                  if ref.startswith("refs/heads/"):
                      heads[ref[len("refs/heads/"):]] = sha
              return heads

          current = branch_heads()
          workflows = []
          for path in sorted(Path(".github/workflows").glob("*")):
              if path.is_file() and path != self_workflow:
                  try:
                      workflows.append((str(path), path.read_text(encoding="utf-8")))
                  except UnicodeDecodeError:
                      pass

          eligible, skipped = [], []
          for item in candidates:
              branch = item["branch"]
              observed = current.get(branch)
              if branch in open_heads:
                  skipped.append({**item, "reason":"open_pull_request"})
              elif observed is None:
                  skipped.append({**item, "reason":"already_absent"})
              elif observed != item["expected_sha"]:
                  skipped.append({**item, "reason":"head_moved", "observed_sha":observed})
              else:
                  refs = [path for path, text in workflows if branch in text]
                  if refs:
                      skipped.append({**item, "reason":"referenced_by_workflow", "workflow_paths":refs})
                  else:
                      eligible.append(item)

          push_url = f"https://x-access-token:{token}@github.com/{repo}.git"
          deleted, failed = [], []
          for item in eligible:
              proc = subprocess.run(
                  ["git", "push", push_url, "--delete", item["branch"]],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )
              if proc.returncode == 0:
                  deleted.append(item)
              else:
                  failed.append({**item, "reason":"delete_failed", "stderr":proc.stderr[-600:]})

          remaining = branch_heads()
          verified = [item for item in deleted if item["branch"] not in remaining]
          mismatch = [item for item in deleted if item["branch"] in remaining]
          record = {
              "schema_version":"0.2",
              "repository":repo,
              "canonical_remaining_retirement_manifest":True,
              "source_audit_generated_at":"2026-08-28T19:50:13.720035Z",
              "manifest_candidates":len(candidates),
              "eligible":len(eligible),
              "deleted_and_verified_absent":len(verified),
              "remaining_repository_branches":len(remaining),
              "open_pr_heads":sorted(open_heads),
              "deleted":verified,
              "skipped":skipped,
              "failed":failed,
              "verification_mismatch":mismatch,
          }
          result_path.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("## Corrected canonical retirement batch\n\n")
              out.write(f"- candidates: {len(candidates)}\n")
              out.write(f"- eligible: {len(eligible)}\n")
              out.write(f"- deleted + verified: {len(verified)}\n")
              out.write(f"- skipped: {len(skipped)}\n")
              out.write(f"- failures: {len(failed)}\n")
              out.write(f"- remaining repository branches: {len(remaining)}\n")
              out.write("\nEvidence-preservation and extract-or-retire branches are excluded.\n")
          print(json.dumps({"eligible":len(eligible),"deleted":len(verified),"skipped":len(skipped),"failed":len(failed),"remaining_branches":len(remaining)},sort_keys=True))
          if failed or mismatch:
              raise SystemExit("canonical retirement batch did not verify cleanly")
          PY

      - name: Upload retirement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-retirement-${{ github.run_id }}
          path: ${{ runner.temp }}/branch-retirement-result.json
          retention-days: 30
          if-no-files-found: error

# Corrected one-shot maintenance batch.
# These 40 refs are the still-present, unchanged subset of the canonical Branch
# Steward retirement queue after the first pass. Evidence-preservation and
# extract-or-retire branches are not present. Exact-head/open-PR/workflow guards
# remain fail closed; no merge, rebase, or force-update operation exists here.
