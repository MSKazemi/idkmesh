name: One-time branch retirement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-retirement-once.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retire four fresh canonical candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          candidates = {
              "feature/project-domain-contracts-v0": "868e672cedb32b745d12555071cd541a08729d68",
              "feature/idkgraph-p1-review-session-validator": "ec5a737cdf21285ac6e4908273b2d5c7f5307d20",
              "fix/branch-audit-rate-limit-feedback": "209890012adac3b218eb882d2d82adf88108a6dd",
              "feature/active-compute-pulse": "7ca19432ae4c812aba98376240fd0a8560659ca2",
          }
          repo = os.environ["GITHUB_REPOSITORY"]

          def heads():
              proc = subprocess.run(
                  ["git", "ls-remote", "--heads", f"https://github.com/{repo}.git"],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
              )
              out = {}
              for line in proc.stdout.splitlines():
                  sha, ref = line.split("\t", 1)
                  if ref.startswith("refs/heads/"):
                      out[ref[len("refs/heads/"):]] = sha
              return out

          before = heads()
          eligible = [branch for branch, sha in candidates.items() if before.get(branch) == sha]
          skipped = [
              {"branch": branch, "expected_sha": sha, "observed_sha": before.get(branch)}
              for branch, sha in candidates.items()
              if before.get(branch) != sha
          ]

          failed = []
          for branch in eligible:
              proc = subprocess.run(
                  [
                      "gh",
                      "api",
                      "--method",
                      "DELETE",
                      f"repos/{repo}/git/refs/heads/{branch}",
                  ],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  env=os.environ.copy(),
              )
              if proc.returncode != 0:
                  failed.append({"branch": branch, "stderr": proc.stderr[-500:]})

          after = heads()
          deleted = [branch for branch in eligible if branch not in after]
          mismatch = [branch for branch in eligible if branch in after]
          record = {
              "schema_version": "0.2",
              "source_branch_steward_run": 33209884971,
              "source_main_sha": "48f2144b0721fac61f57bc245b5c413621fb8044",
              "manifest_candidates": len(candidates),
              "eligible": len(eligible),
              "deleted_and_verified_absent": len(deleted),
              "remaining_repository_branches": len(after),
              "deleted": deleted,
              "skipped": skipped,
              "failed": failed,
              "verification_mismatch": mismatch,
              "authority": {
                  "delete_only": True,
                  "merge": False,
                  "force_update": False,
                  "exact_head_guard": True
              }
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "branch-retirement-result.json"
          path.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write("## Fresh canonical branch retirement\n\n")
              out.write(f"- candidates: {len(candidates)}\n")
              out.write(f"- eligible: {len(eligible)}\n")
              out.write(f"- deleted + verified: {len(deleted)}\n")
              out.write(f"- skipped: {len(skipped)}\n")
              out.write(f"- failures: {len(failed)}\n")
              out.write(f"- remaining branches: {len(after)}\n")
          print(json.dumps(record, sort_keys=True))
          if failed or mismatch:
              raise SystemExit("branch retirement verification failed")
          PY

      - name: Upload retirement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-retirement-${{ github.run_id }}
          path: ${{ runner.temp }}/branch-retirement-result.json
          retention-days: 30
          if-no-files-found: error

# One-shot cleanup surface built from the fresh Branch Steward run 33209884971.
# Exact-head verified deletion only. No merge, force-update, or rebase authority.
