-evidence","expected_sha":"7e177fe21f12c78a00e340c59b89f1c3330d3062","state":"integrated-via-pr"},{"branch":"benchmark/task-001-path-boundary-evidence","expected_sha":"af77440ba31aa9b53035818db02b09b9286401c7","state":"integrated-via-pr"},{"branch":"fix/phase-b2-task-001-cohort-path-boundary","expected_sha":"fb4faa87ccbbd10327be7f1f8c85173a796df1c4","state":"integrated-via-pr"},{"branch":"benchmark/phase-b2-successor-five","expected_sha":"1fcc6647f99b50041b3b6c044e643bd6497faeff","state":"orphan-no-unique-commits"},{"branch":"benchmark/phase-b2-successor-v2-scaffold","expected_sha":"5bb42560c58fb90a534635ff9dee8e11ccc983c0","state":"orphan-no-unique-commits"},{"branch":"benchmark/phase-b2-successor-v2-scaffold-current","expected_sha":"391b2905ff55885def2a4930281d148682d012a6","state":"integrated-via-pr"},{"branch":"benchmark/phase-b2-successor-v2-scaffold-fix","expected_sha":"1986b8cace7ab3ccfa4f8df1902f9805bc962a42","state":"integrated-via-pr"},{"branch":"benchmark/phase-b2-v2-definition-integrity","expected_sha":"2af7968cf885a104ae2243b87cae4ed532055f9e","state":"integrated-via-pr"},{"branch":"benchmark/phase-b2-v3-calibrated-freeze","expected_sha":"5472e621631055547ce6019b1ac9c4e83c71c226","state":"orphan-no-unique-commits"},{"branch":"calibration/phase-b2-v2-task002-nonfinite","expected_sha":"a74a57a88aefe0797263205474d37dcbae3a7d0f","state":"integrated-via-pr"},{"branch":"calibration/phase-b2-v2-task002-record","expected_sha":"1634c0d42d69992de8c76faae8cac241fc40be81","state":"integrated-via-pr"},{"branch":"calibration/phase-b2-v2-task003-unobserved-head","expected_sha":"fdbb829180738d6000873c3321d6b02ea8456e2e","state":"integrated-via-pr"},{"branch":"calibration/phase-b2-v2-task003-record","expected_sha":"d6f1a83d47748d9a0aecbb89132c2523553d5ae0","state":"integrated-via-pr"},{"branch":"calibration/phase-b2-v2-task005-output-boundary","expected_sha":"b71d84959abec5d446d5c41e2ccd4fc0164fd536","state":"integrated-via-pr"},{"branch":"feature/phase-b2-v2-task005-calibration-record","expected_sha":"ce1f90a89b8b87609c36652acdab9380f5d5a827","state":"integrated-via-pr"},{"branch":"feature/idkgraph-p1-independent-review","expected_sha":"466c5baedb2cc124ef0c7aa21999cda483355ea0","state":"integrated-via-pr"},{"branch":"feature/idkgraph-p1-review-session-validator","expected_sha":"b6646b541fa742da5f8a668f85454a2901586ab4","state":"integrated-via-pr"},{"branch":"idkgraph/p1-adr-linkage-triage","expected_sha":"c9b5b9589ac20c00f5dba6f212c47e4b0ebe8af1","state":"integrated-via-pr"},{"branch":"idkgraph/p1-orphan-sample","expected_sha":"7696665a1b7ec0f73c34ab6ad3f0af56307136d4","state":"integrated-via-pr"},{"branch":"idkgraph/p1-warning-sample","expected_sha":"9a24f28f29816da082240df3b7d597a7c7d051ed","state":"integrated-via-pr"},{"branch":"idkgraph/p1-orphan-cohort-1","expected_sha":"da6df72e320e778c053c1000b94e7df97dfd8033","state":"integrated-via-pr"},{"branch":"idkgraph/p0-residual-health-checks","expected_sha":"c6c4c03ae78f03f74764ccf570570675d2e01068","state":"integrated-via-pr"},{"branch":"idkgraph/t1-stable-markdown-identity","expected_sha":"99bc3d14a3d2fca9902f9a6c352e9655fda84d7e","state":"integrated-via-pr"},{"branch":"idkgraph/t2-link-integrity","expected_sha":"36e24ffa541f90326ee1d7c5ffc8726c5eb1d355","state":"integrated-via-pr"},{"branch":"idkgraph/t2-internal-link-diagnostics","expected_sha":"787f08009c6e18eade93f0de990ab794f8c0e168","state":"integrated-via-pr"},{"branch":"idkgraph/t3-deterministic-type-mapping","expected_sha":"9ad8c2813d5329a93719ceb26576c785c277a7e7","state":"integrated-via-pr"},{"branch":"idkgraph/t3-integrity-hardening","expected_sha":"d3f581ef7af8746109e7ba5164de6b88137523bc","state":"integrated-via-pr"},{"branch":"idkgraph/t4-workunit-cycle-check","expected_sha":"32477d8bf9a626007f740f5e186e5040b76294b4","state":"integrated-via-pr"},{"branch":"idkgraph/t5-observatory-integration","expected_sha":"e22e1178c20517358aee6f2b5d7d45ee9fb1b489","state":"integrated-via-pr"},{"branch":"hardening/evolution-artifact-minimization-post148","expected_sha":"5a9f6e2e8249574267982cbeae4e974ca6783370","state":"integrated-via-pr"},{"branch":"maintenance/branch-convergence-audit-v0","expected_sha":"c09d46c6709e9b373feb9b935965124bafbeef7a","state":"integrated-via-pr"},{"branch":"maintenance/branch-merge-plan-v0","expected_sha":"f344042430f63e2741f287826b21d90d95ad3628","state":"integrated-via-pr"},{"branch":"maintenance/branch-plan-pr-lifecycle-trigger","expected_sha":"7700c6d4d1bf1a467bb5fb475c2f16854439f739","state":"integrated-via-pr"},{"branch":"maintenance/branch-merge-plan-current-main","expected_sha":"a6c34a72e895f00540108764e3d33d76389dd453","state":"integrated-via-pr"},{"branch":"maintenance/branch-plan-post-merge-trigger","expected_sha":"950c53cae54c1a6bb9035a4e86c78038bb19f0ea","state":"integrated-via-pr"},{"branch":"planning/branch-steward-agent","expected_sha":"fa16847f9acec344013092d2e45efdeb3fc9a6e6","state":"integrated-via-pr"},{"branch":"planning/execution-target-graph-v0","expected_sha":"b40bf9ba54c80a7978b37c7e44bdb10ded2797d1","state":"integrated-via-pr"},{"branch":"planning/execution-target-graph-v1","expected_sha":"625b7379d88a58b8b9ac36fe31d4b2ca2f35bef2","state":"integrated-via-pr"},{"branch":"planning/current-execution-graph-v2","expected_sha":"8df21e4688da1dbee72e64513097c243ac5286ee","state":"integrated-via-pr"},{"branch":"planning/refresh-current-priorities-post-evidence","expected_sha":"c093a7d535ce2df0aeefd1884269b8119408d13c","state":"integrated-via-pr"},{"branch":"feature/project-domain-contracts-v0","expected_sha":"d3c5cbb73d6a1b3cbeec654e5d2f17eb55dcf65a","state":"integrated-via-pr"},{"branch":"architecture/algorithm-collaboration-fabric-v0","expected_sha":"124582180ac2411572d4f1e8fec297f82aa7901b","state":"integrated-via-pr"},{"branch":"codex/adversarial-evidence-envelope","expected_sha":"c94b1f4a7574c1a6811a64de18fbe2127a4aa29e","state":"integrated-via-pr"},{"branch":"codex/sequential-evidence-kernel","expected_sha":"18e7bbe79ca8e857b4adcb20ba4fe4fc1e593b3b","state":"integrated-via-pr"},{"branch":"codex/sequential-evidence-reproducibility","expected_sha":"64c08f9f8b4aa5fa473627445e6b46564abb0544","state":"integrated-via-pr"},{"branch":"codex/anytime-drift-guard","expected_sha":"cccb6e7ba7f06b7f43b3d41784787b2b8115957a","state":"integrated-via-pr"},{"branch":"codex/evidence-aggregation-fabric","expected_sha":"2ebf27acd7b73cb8cf92fb6a533757c220d16dfc","state":"integrated-via-pr"},{"branch":"fix/evidence-fabric-strict-booleans","expected_sha":"ca1cdde63f6b7e57f84f49035821874e9d35625a","state":"integrated-via-pr"},{"branch":"codex/trust-domain-fault-budget","expected_sha":"c635d90d66a99092cc17b50edf0e766747b02ce7","state":"integrated-via-pr"},{"branch":"growth/fast-discovery-20260828","expected_sha":"bbf49f72d815959a00409b07d15dd699c5aedb78","state":"integrated-via-pr"},{"branch":"growth/pages-front-door-v0","expected_sha":"38af1a0c69c5ee751337a853c55eb5c18b9d66d9","state":"integrated-via-pr"},{"branch":"growth/readme-live-front-door","expected_sha":"8d5f404d2272e80c527f29a260bf73458b6fadc7","state":"integrated-via-pr"},{"branch":"growth-seed/28-idkgraph-microtasks","expected_sha":"0bcfb045be3ffd49864d463e63b0564b5127d5ea","state":"integrated-via-pr"},{"branch":"biology-aco-stigmergy-v0","expected_sha":"6112b2dc9500b42a5233f9e7b366699de9a1a75e","state":"integrated-via-pr"},{"branch":"clarify/repository-improvement-loop","expected_sha":"1de4a0423fefd67d59b02d8b7dab4a823824ed52","state":"integrated-via-pr"},{"branch":"project-memory-and-criticality","expected_sha":"22909ff08768a78e0b95eab074426c25d69232f7","state":"integrated-via-pr"},{"branch":"repo-homeostasis-v0","expected_sha":"6fa5bb091a2bf1f2c9a3d9b8d7aedc910c10511b","state":"integrated-via-pr"},{"branch":"security/ace-workflow-threat-model","expected_sha":"5331f2a5dceb82f8056a513fdddbe7e4418dabde","state":"integrated-via-pr"} ]''')
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          self_workflow = Path(".github/workflows/branch-retirement-once.yml")
          result_path = Path(os.environ["RUNNER_TEMP"]) / "branch-retirement-result.json"

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls?state=open&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              open_pulls = json.load(response)
          open_heads = {item["head"]["ref"] for item in open_pulls}

          ls = subprocess.run(
              ["git", "ls-remote", "--heads", f"https://github.com/{repo}.git"],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          )
          current = {}
          for line in ls.stdout.splitlines():
              sha, ref = line.split("\t", 1)
              prefix = "refs/heads/"
              if ref.startswith(prefix):
                  current[ref[len(prefix):]] = sha

          workflow_text = []
          for path in sorted(Path(".github/workflows").glob("*")):
              if not path.is_file() or path == self_workflow:
                  continue
              try:
                  workflow_text.append((str(path), path.read_text(encoding="utf-8")))
              except UnicodeDecodeError:
                  pass

          eligible = []
          skipped = []
          for item in candidates:
              branch = item["branch"]
              expected = item["expected_sha"]
              observed = current.get(branch)
              if branch == "main":
                  skipped.append({**item, "reason": "default_branch"})
                  continue
              if branch in open_heads:
                  skipped.append({**item, "reason": "open_pull_request"})
                  continue
              if observed is None:
                  skipped.append({**item, "reason": "already_absent"})
                  continue
              if observed != expected:
                  skipped.append({**item, "reason": "head_moved", "observed_sha": observed})
                  continue
              refs = [path for path, text in workflow_text if branch in text]
              if refs:
                  skipped.append({**item, "reason": "referenced_by_workflow", "workflow_paths": refs})
                  continue
              eligible.append(item)

          push_url = f"https://x-access-token:{token}@github.com/{repo}.git"
          deleted = []
          failed = []
          for item in eligible:
              branch = item["branch"]
              proc = subprocess.run(
                  ["git", "push", push_url, "--delete", branch],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if proc.returncode == 0:
                  deleted.append(item)
              else:
                  failed.append({**item, "reason": "delete_failed", "stderr": proc.stderr[-600:]})

          final_ls = subprocess.run(
              ["git", "ls-remote", "--heads", f"https://github.com/{repo}.git"],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          )
          remaining = set()
          for line in final_ls.stdout.splitlines():
              _sha, ref = line.split("\t", 1)
              if ref.startswith("refs/heads/"):
                  remaining.add(ref[len("refs/heads/"):])

          verified_deleted = [item for item in deleted if item["branch"] not in remaining]
          verification_mismatch = [item for item in deleted if item["branch"] in remaining]
          record = {
              "schema_version": "0.1",
              "repository": repo,
              "source_retirement_manifest_generated_at": "2026-08-28T19:50:13.720035Z",
              "source_retirement_candidates": len(candidates),
              "open_pr_heads": sorted(open_heads),
              "eligible_exact_head_candidates": len(eligible),
              "deleted_and_verified_absent": len(verified_deleted),
              "skipped": skipped,
              "failed": failed,
              "verification_mismatch": verification_mismatch,
              "deleted": verified_deleted,
              "authority": {
                  "operation": "user_requested_branch_retirement",
                  "merge_branches": False,
                  "delete_only_exact_head_candidates": True,
                  "force_update": False,
              },
          }
          result_path.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## One-time branch retirement\n\n")
              handle.write(f"- manifest candidates: {len(candidates)}\n")
              handle.write(f"- exact-head eligible: {len(eligible)}\n")
              handle.write(f"- deleted + verified absent: {len(verified_deleted)}\n")
              handle.write(f"- skipped: {len(skipped)}\n")
              handle.write(f"- deletion failures: {len(failed)}\n")
              handle.write(f"- post-delete verification mismatches: {len(verification_mismatch)}\n")
              handle.write(f"- remaining repository branches: {len(remaining)}\n")
              handle.write("\nNo stale branch was merged into `main`; retirement candidates were deletion-only.\n")

          print(json.dumps({"manifest": len(candidates), "eligible": len(eligible), "deleted": len(verified_deleted), "skipped": len(skipped), "failed": len(failed), "verification_mismatch": len(verification_mismatch), "remaining_branches": len(remaining)}, sort_keys=True))
          if failed or verification_mismatch:
              raise SystemExit("one or more eligible branch deletions did not verify cleanly")
          PY

      - name: Upload retirement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-retirement-${{ github.run_id }}
          path: ${{ runner.temp }}/branch-retirement-result.json
          retention-days: 30
          if-no-files-found: error

# One-shot maintenance surface.
# - It is triggered only when this workflow file itself changes on main.
# - It contains a frozen retirement manifest from the last complete Branch Steward audit.
# - Exact branch SHA, open-PR status, and workflow references are revalidated live.
# - It never merges, force-updates, or rebases a branch.
# - Any changed branch is skipped rather than guessed about.
