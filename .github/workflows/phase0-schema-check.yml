name: Phase 0 schema check

on:
  pull_request:
    paths:
      - "schemas/**"
      - "config/**"
      - "examples/**"
      - "experiments/**"
      - "requirements-phase0.txt"
      - ".github/workflows/phase0-schema-check.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "config/**"
      - "examples/**"
      - "experiments/**"
      - "requirements-phase0.txt"
      - ".github/workflows/phase0-schema-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Phase 0 dependency
        run: python -m pip install -r requirements-phase0.txt
      - name: Validate schemas and fixtures
        run: python experiments/harness.py validate
      - name: Verify risk-weighted verification backpressure
        run: python experiments/verification_backpressure.py --self-test
      - name: Verify zero-cost compute routing
        run: python experiments/free_compute_router.py self-test
      - name: Show example free compute selection
        run: python experiments/free_compute_router.py select
      - name: Run safe built-in smoke fixture
        run: python experiments/harness.py smoke --output results/phase0-smoke.jsonl

# Security note: Phase 0 CI does not execute provider- or contributor-supplied
# task commands. The harness validates contracts and executes only its built-in
# deterministic_smoke runner. The verification backpressure utility performs
# scheduling/control arithmetic only, and free_compute_router.py performs
# selection only. Repository policy must fail closed rather than granting new
# execution or project-paid compute authority.
