name: Phase 0 schema check

on:
  pull_request:
    paths:
      - "schemas/**"
      - "config/**"
      - "examples/**"
      - "verification/**"
      - "experiments/**"
      - "tests/test_verification_backpressure_benchmark.py"
      - "tests/test_criticality_susceptibility.py"
      - "tests/test_patch_evaluator_transition_v04.py"
      - "requirements-phase0.txt"
      - ".github/workflows/phase0-schema-check.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "config/**"
      - "examples/**"
      - "verification/**"
      - "experiments/**"
      - "tests/test_verification_backpressure_benchmark.py"
      - "tests/test_criticality_susceptibility.py"
      - "tests/test_patch_evaluator_transition_v04.py"
      - "requirements-phase0.txt"
      - ".github/workflows/phase0-schema-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Phase 0 dependency
        run: python -m pip install -r requirements-phase0.txt
      - name: Validate schemas and fixtures
        run: python experiments/harness.py validate
      - name: Verify cross-object provenance integrity
        run: python experiments/provenance_integrity.py --self-test
      - name: Run executable independent verifier MVP
        run: |
          python experiments/local_verifier.py self-test \
            --good-candidate-root examples/verifier/good/candidate-root \
            --bad-candidate-root examples/verifier/bad/candidate-root
      - name: Preserve EvaluatorPlan v0.2 patch semantics
        run: python experiments/evaluator_plan_runner.py patch-self-test
      - name: Prove EvaluatorPlan semantic version boundaries
        run: |
          python -m py_compile \
            experiments/evaluator_plan_runner.py \
            experiments/substring_patch_verifier.py \
            experiments/transition_patch_verifier.py
          python experiments/evaluator_plan_runner.py semantic-version-self-test
          python -m unittest tests.test_patch_evaluator_transition_v04 -v
      - name: Run deterministic two-attempt orchestration kernel
        run: python experiments/two_attempt_orchestrator.py self-test
      - name: Verify risk-weighted verification backpressure
        run: python experiments/verification_backpressure.py --self-test
      - name: Verify temporal verification-backpressure benchmark
        run: |
          python experiments/verification_backpressure_benchmark.py --self-test
          python -m unittest discover -s tests -p 'test_verification_backpressure_benchmark.py' -v
      - name: Verify coordination-criticality susceptibility experiment
        run: |
          python experiments/criticality_susceptibility.py --self-test
          python -m unittest discover -s tests -p 'test_criticality_susceptibility.py' -v
      - name: Verify zero-cost compute routing
        run: python experiments/free_compute_router.py self-test
      - name: Verify capped local capability discovery
        run: python experiments/local_compute_offer.py self-test
      - name: Route a real discovered local offer
        run: |
          python experiments/local_compute_offer.py discover --output results/local-offer.json
          python experiments/free_compute_router.py select --offers results/local-offer.json
      - name: Show mixed-pool free compute selection
        run: python experiments/free_compute_router.py select
      - name: Run safe built-in smoke fixture
        run: python experiments/harness.py smoke --output results/phase0-smoke.jsonl

# Security note: Phase 0 CI does not execute provider- or contributor-supplied
# task commands. The harness validates contracts and executes only its built-in
# deterministic_smoke runner. provenance_integrity.py performs canonical hashing
# and cross-object lineage checks only. local_verifier.py and the versioned
# EvaluatorPlan patch adapters parse isolated fixture metadata/diffs and apply
# verifier-owned deterministic policy without executing candidate code. v0.2
# exact-line semantics, v0.3 added-substring semantics, and v0.4 added+removed
# transition semantics are tested side-by-side so historical verifier meanings
# cannot silently change and the known inert-added-text decoy remains rejected by
# the newest contract. two_attempt_orchestrator.py coordinates replayable fixture
# ResultManifests and verifier calls only; it has no worker-execution,
# canonical-write, push, or merge authority. The verification backpressure
# utilities perform deterministic scheduling, queue, and synthetic evidence
# arithmetic only; the temporal benchmark does not execute candidates or grant
# integration authority. local_compute_offer.py performs local resource discovery
# only, and free_compute_router.py performs selection only. Repository policy must
# fail closed rather than granting new execution or project-paid compute authority.
