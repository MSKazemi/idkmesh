name: Active Compute Pulse

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: active-compute-pulse
  cancel-in-progress: true

env:
  WORK_UNIT: examples/work-units/phase0-smoke.work-unit.json
  OFFER_POOL: results/active-compute/github-actions-offer.json
  ROUTE_REPORT: results/active-compute/route.json
  RESULT_JSONL: results/active-compute/phase0-smoke.jsonl
  ACTIVE_COMPUTE_PULSE_ENABLED: ${{ vars.ACTIVE_COMPUTE_PULSE_ENABLED }}

jobs:
  pulse:
    if: >-
      github.repository == 'MSKazemi/idkmesh' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.ACTIVE_COMPUTE_PULSE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify protected current-main activation boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          expected_sha = os.environ['GITHUB_SHA']
          token = os.environ['GH_TOKEN']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/branches/main',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              branch = json.load(response)

          if branch.get('protected') is not True:
              raise SystemExit('Active compute is blocked: GitHub does not report main as protected')

          observed_sha = (branch.get('commit') or {}).get('sha')
          if observed_sha != expected_sha:
              raise SystemExit(
                  f'Active compute is blocked: workflow SHA {expected_sha} is not current main tip {observed_sha}'
              )

          print(f'Protected-main gate passed at {observed_sha}')
          PY
          echo 'IDKMESH_MAIN_PROTECTED=true' >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Phase 0 dependency
        run: python -m pip install -r requirements-phase0.txt

      - name: Validate Free Resource Mesh registry
        run: |
          python scripts/free_resource_planner.py validate examples/resources/free-resource-registry-v0.1.json
          python scripts/free_resource_planner.py plan \
            examples/resources/free-resource-registry-v0.1.json \
            examples/resources/task-public-code-analysis-v0.1.json \
            --limit 6 \
            --today "$(date -u +%F)" \
            > results/free-resource-plan.json

      - name: Discover the current GitHub-hosted compute offer
        run: |
          mkdir -p results/active-compute
          python experiments/github_actions_compute_offer.py discover --output "$OFFER_POOL"
          python -m json.tool "$OFFER_POOL" >/dev/null

      - name: Select a zero-project-cost live offer
        run: |
          python experiments/free_compute_router.py select \
            --work-unit "$WORK_UNIT" \
            --offers "$OFFER_POOL" \
            > "$ROUTE_REPORT"
          python -m json.tool "$ROUTE_REPORT" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('results/active-compute/route.json').read_text())
          if report['status'] != 'selected':
              raise SystemExit('No eligible zero-cost offer selected')
          selected = report['selected'] or {}
          if selected.get('offer_id') != 'github-actions-current-job':
              raise SystemExit(f"Unexpected selected offer: {selected}")
          if float(selected.get('project_cost_usd', 1)) != 0:
              raise SystemExit('Selected offer has non-zero project cost')
          PY

      - name: Execute one fixed repository-owned deterministic Work Unit
        run: python experiments/harness.py smoke --output "$RESULT_JSONL"

      - name: Validate collected result
        run: |
          python experiments/harness.py validate
          test -s "$RESULT_JSONL"
          sha256sum "$OFFER_POOL" "$ROUTE_REPORT" "$RESULT_JSONL" > results/active-compute/SHA256SUMS

      - name: Publish pulse summary
        run: |
          echo '## IDKMesh Active Compute Pulse' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The repository acquired its normal GitHub-hosted CI job, promoted that already-running job into a policy-checked zero-project-cost offer, routed one fixed repository-owned Work Unit, executed the deterministic Phase 0 smoke computation, and retained the evidence as a workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Activation required both an explicit repository-variable opt-in and a live GitHub branch-metadata check confirming the workflow SHA was the protected current main tip.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does not search the internet for machines, does not attach self-hosted volunteer runners, does not use repository secrets, and does not push/merge/write canonical state.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Route' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$ROUTE_REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable pulse evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: active-compute-pulse-${{ github.run_id }}
          path: |
            results/free-resource-plan.json
            results/active-compute/github-actions-offer.json
            results/active-compute/route.json
            results/active-compute/phase0-smoke.jsonl
            results/active-compute/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

# Authority and safety boundary:
# - schedule/manual dispatch is dormant unless ACTIVE_COMPUTE_PULSE_ENABLED == "true";
# - even after opt-in, GitHub must report the exact current main tip as protected;
# - contents: read only; checkout credentials are not persisted;
# - no repository secrets or external credentials;
# - GitHub-hosted public-project CI is used only for legitimate repository work;
# - execution is a fixed checked-in deterministic smoke runner, never contributor-supplied shell;
# - no issue/PR/branch mutation, push, merge, approval, or canonical-state write;
# - volunteer/external compute remains behind explicit opt-in adapters and independent verification.
