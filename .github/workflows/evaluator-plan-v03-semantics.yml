name: EvaluatorPlan v0.3 semantics

on:
  pull_request:
    paths:
      - "schemas/evaluator-plan-v0.3.schema.json"
      - "experiments/patch_verifier_v020.py"
      - "experiments/evaluator_plan_v03.py"
      - "verification/fixtures/patch-smoke-evaluator-plan-v0.3.json"
      - "tests/test_evaluator_plan_v03_semantics.py"
      - "docs/specifications/EVALUATOR_PLAN_V0_3_SEMANTIC_MATCHING.md"
      - "docs/conversations/2026-08-28-versioned-semantic-matching-after-burned-cohort.md"
      - ".github/workflows/evaluator-plan-v03-semantics.yml"
  push:
    branches: [main]
    paths:
      - "schemas/evaluator-plan-v0.3.schema.json"
      - "experiments/patch_verifier_v020.py"
      - "experiments/evaluator_plan_v03.py"
      - "verification/fixtures/patch-smoke-evaluator-plan-v0.3.json"
      - "tests/test_evaluator_plan_v03_semantics.py"
      - ".github/workflows/evaluator-plan-v03-semantics.yml"

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: evaluator-plan-v03-semantics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Phase 0 verifier dependency
        run: python -m pip install -r requirements-phase0.txt

      - name: Compile additive versioned verifier path
        run: |
          python -m py_compile \
            experiments/patch_verifier_v020.py \
            experiments/evaluator_plan_v03.py \
            tests/test_evaluator_plan_v03_semantics.py

      - name: Re-run historical v0.2 exact-line safety suite unchanged
        run: python -m unittest tests.test_patch_evaluator_safety -v

      - name: Distinguish exact-line v0.2 from substring v0.3 semantics
        run: python -m unittest tests.test_evaluator_plan_v03_semantics -v

      - name: Exercise v0.3 CLI and provenance binding
        run: |
          python experiments/evaluator_plan_v03.py \
            --work-unit examples/work-units/patch-verifier-smoke.work-unit.json \
            --result-manifest examples/verifier/patch/good/result-manifest.json \
            --candidate-root examples/verifier/patch/good \
            --evaluator-plan verification/fixtures/patch-smoke-evaluator-plan-v0.3.json \
            --output results/verification/evaluator-plan-v03-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('results/verification/evaluator-plan-v03-smoke.json').read_text())
          assert value['status'] == 'passed'
          assert value['verifier']['adapter_version'] == '0.2.0'
          assert value['extensions']['org.idkmesh.evaluator_plan.semantic_contract'] == 'substring_in_validated_added_line'
          assert value['decision_support']['recommendation'] == 'accept_candidate'
          print('EvaluatorPlan v0.3 smoke is provenance-bound and metadata-only')
          PY

# Security / compatibility boundary:
# - EvaluatorPlan v0.2 and deterministic patch verifier v0.1.1 are not edited;
# - v0.3/v0.2.0 is additive and uses explicit required_added_substrings semantics;
# - strict unified-diff parsing, path authority, artifact/log integrity and WorkUnit
#   binding are reused from the existing verifier kernel;
# - semantic matches are computed only from additions inside validated balanced hunks;
# - candidate code is never executed;
# - generated verification output remains under ignored results/;
# - checkout credentials are not persisted and workflow permissions are contents:read;
# - no repository write, approval, candidate selection or merge authority is introduced.
