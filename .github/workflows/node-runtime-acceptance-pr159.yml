name: Controlled Node Runtime Acceptance - PR159

on:
  pull_request:
    paths:
      - "tools/node_runtime_acceptance.py"
      - "tools/node_runtime_acceptance_pr159.py"
      - "tools/node_runtime_positive_probe.py"
      - "tools/node_runtime_positive_probe_pr159.py"
      - ".github/workflows/node-runtime-acceptance-pr159.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out evaluator-owned acceptance harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: harness
          persist-credentials: false

      - name: Check out exact PR 159 node candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 61cafa86f7e0e86343d73182862e3cead1080ab9
          path: candidate
          persist-credentials: false

      - name: Verify frozen candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "61cafa86f7e0e86343d73182862e3cead1080ab9"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install evaluator dependency only
        run: python -m pip install "jsonschema>=4.23,<5"

      - name: Preload allowlisted runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine

      - name: Probe positive runtime diagnostics
        shell: bash
        run: python harness/tools/node_runtime_positive_probe_pr159.py candidate

      - name: Run independent positive and negative acceptance cases
        shell: bash
        run: |
          set -euo pipefail
          python harness/tools/node_runtime_acceptance_pr159.py \
            --candidate candidate \
            --evidence "$RUNNER_TEMP/idkmesh-node-pr159-runtime-evidence.json"

      - name: Publish sanitized evidence to job summary
        if: always()
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/idkmesh-node-pr159-runtime-evidence.json"
          if test -f "$EVIDENCE"; then
            echo '## PR #159 exact-head controlled runtime acceptance evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$EVIDENCE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Acceptance evidence file was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

# Security / authority boundary:
# - this branch is evaluator-owned evidence instrumentation, not worker code;
# - candidate PR #159 is checked out only by exact SHA;
# - action dependencies are pinned to immutable reviewed SHAs;
# - checkout credentials are not persisted;
# - permissions are contents:read;
# - no repository secrets are passed to candidate code;
# - candidate subprocesses receive the acceptance harness's sanitized environment;
# - task containers retain the node's network-none/read-only/cap-drop/no-new-privileges profile;
# - workflow creates no approval, merge, push, settings, or candidate-selection authority;
# - a PASS is controlled-runtime evidence only and still requires separate human review.
