name: Phase B2 v2 Task 003 calibration

on:
  pull_request:
    paths:
      - "tools/task003_branch_unobserved_head_calibration.py"
      - ".github/workflows/phase-b2-v2-task003-calibration.yml"
      - "docs/research/PHASE_B2_V2_TASK003_UNOBSERVED_HEAD_CALIBRATION.md"
      - "docs/conversations/2026-08-28-phase-b2-v2-task003-calibration.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_SOURCE: a69aa0ae1ae4862e507511cbd9ad854237d0ad32

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evaluator-owned current tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evaluator
          persist-credentials: false

      - name: Check out exact successor source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FROZEN_SOURCE }}
          path: source
          persist-credentials: false

      - name: Verify frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$FROZEN_SOURCE"
          test -z "$(git -C source status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency
        working-directory: evaluator
        run: python -m pip install -r requirements-phase0.txt

      - name: Compile calibration and canonical verifier path
        working-directory: evaluator
        run: |
          python -m py_compile \
            tools/task003_branch_unobserved_head_calibration.py \
            experiments/evaluator_plan_runner.py \
            experiments/transition_patch_verifier.py

      - name: Revalidate successor scaffold before calibration
        working-directory: evaluator
        run: |
          python tools/benchmark_cohort.py validate \
            --cohort benchmarks/phase-b2-successor-v2/cohort.json

      - name: Run Task 003 straightforward and inert-decoy calibration
        working-directory: evaluator
        run: |
          python tools/task003_branch_unobserved_head_calibration.py \
            --source ../source \
            --output-root results/verification/phase-b2-v2-task003-calibration

      - name: Assert calibration matrix and authority boundary
        working-directory: evaluator
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('results/verification/phase-b2-v2-task003-calibration/calibration-summary.json')
          value = json.loads(path.read_text())
          assert value['calibration_passed'] is True
          assert value['source_revision'] == 'a69aa0ae1ae4862e507511cbd9ad854237d0ad32'
          assert value['verifier_adapter_version'] == '0.3.0'
          assert value['straightforward']['verification_status'] == 'passed'
          assert value['straightforward']['recommendation'] == 'accept_candidate'
          assert value['straightforward']['safe_unobserved_head_matrix_passed'] is True
          assert value['straightforward']['matched_added_substrings'] == 1
          assert value['straightforward']['matched_removed_substrings'] == 1
          assert value['inert_decoy']['verification_status'] == 'failed'
          assert value['inert_decoy']['recommendation'] == 'reject_candidate'
          assert value['inert_decoy']['vulnerable_missing_head_inherits_merge_history'] is True
          assert value['inert_decoy']['matched_added_substrings'] == 1
          assert value['inert_decoy']['matched_removed_substrings'] == 0
          assert value['calibration_candidates_are_benchmark_outcomes'] is False
          assert value['metadata_only_verifier_executes_candidate_code'] is False
          assert value['behavioral_execution_is_separate_evidence_channel'] is True
          assert value['automatic_candidate_selection'] is False
          assert value['canonical_state_write_authority'] is False
          assert value['merge_authority'] is False
          print('Task 003 calibration distinguishes exact-head evidence from missing-head history')
          PY

      - name: Publish calibration summary
        if: always()
        shell: bash
        run: |
          SUMMARY="evaluator/results/verification/phase-b2-v2-task003-calibration/calibration-summary.json"
          if test -f "$SUMMARY"; then
            echo '### Phase B2 successor Task 003 calibration' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Task 003 calibration summary was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-b2-v2-task003-unobserved-head-calibration
          path: evaluator/results/verification/phase-b2-v2-task003-calibration/
          if-no-files-found: error
          retention-days: 14

# Scientific / authority boundary:
# - calibration uses exact public frozen source a69aa0ae...;
# - successor-v2 remains a scaffold: no definition digest and no scored outcome is created here;
# - the canonical v0.4 verifier is metadata-only and executes no candidate code;
# - importing the disposable modified source for behavioral checks is a separate evaluator-owned evidence channel;
# - the inert decoy contains the required added lexical marker while preserving the vulnerable missing-head condition;
# - all candidate writes stay in the disposable frozen-source checkout or evaluator results/;
# - checkout credentials are not persisted; workflow permissions are contents:read; no secrets are used;
# - no canonical write, push, approval, merge, spending, or automatic candidate-selection authority exists.
