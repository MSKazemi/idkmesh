name: ACE safety contract

on:
  pull_request:
    paths:
      - '.github/workflows/ace-community-growth.yml'
      - 'tests/test_ace_safety_contract.py'
      - '.github/workflows/ace-safety-contract.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ace-community-growth.yml'
      - 'tests/test_ace_safety_contract.py'
      - '.github/workflows/ace-safety-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: ace-safety-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce ACE privileged-workflow safety invariants
        run: python -m unittest tests.test_ace_safety_contract -v

# This workflow only reads repository-owned workflow text and enforces invariants.
# It has no write permission and never executes pull-request-controlled code under
# pull_request_target.
