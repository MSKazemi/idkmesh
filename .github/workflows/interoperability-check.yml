name: Interoperability check

on:
  pull_request:
    paths:
      - "interop/**"
      - "docs/interoperability/**"
      - "idkips/0001-interoperability-first-work-contract.md"
      - "schemas/work-unit-v0.2.schema.json"
      - "examples/work-units/**"
      - ".github/workflows/interoperability-check.yml"
  push:
    branches: [main]
    paths:
      - "interop/**"
      - "docs/interoperability/**"
      - "idkips/0001-interoperability-first-work-contract.md"
      - "schemas/work-unit-v0.2.schema.json"
      - "examples/work-units/**"
      - ".github/workflows/interoperability-check.yml"

permissions:
  contents: read

jobs:
  semantic-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Phase 0 contract dependency
        run: python -m pip install -r requirements-phase0.txt
      - name: Validate canonical WorkUnit v0.2 fixtures
        run: python experiments/harness.py validate
      - name: Test lossless A2A and MCP bindings
        run: python -m unittest discover -s interop/tests -v

# These tests validate semantic preservation and trust boundaries. They do not
# claim wire-level conformance to a particular A2A/MCP SDK implementation; official
# SDK conformance remains a follow-up experiment in issue #17.
