name: Publish to PyPI

# Inert until a PyPI trusted publisher exists for this repository and workflow.
# Nothing here stores or reads an API token: publication is authorised by the
# short-lived OIDC identity GitHub mints for this job, so there is no long-lived
# credential in repository secrets to leak or rotate.
#
# One-time setup on PyPI, done by the maintainer, before the first release:
#   PyPI -> Publishing -> Add a new pending publisher
#     owner:      MSKazemi
#     repository: idkmesh
#     workflow:   publish-pypi.yml
#     environment: pypi
# Until that exists, a release simply fails the publish job and publishes nothing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

# A publish must never be cancelled midway, so runs queue rather than race.
# cancel-in-progress: false also satisfies the repository-wide invariant that
# no workflow cancels runs outside pull requests.
concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out the tagged release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Verify tag and package version identity
        run: python tools/check_release_version.py --tag "$RELEASE_TAG"

      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*

      - name: Build SBOM, checksums, and release identity manifest
        run: |
          set -eu
          SOURCE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$SOURCE_SHA" = "$TAG_SHA"
          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python tools/build_release_supply_chain.py \
            --source-sha "$SOURCE_SHA" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --created-at "$CREATED_AT"
          (cd dist && sha256sum -c ../release-metadata/checksums.txt)

      - name: Detect artifact-attestation availability
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          PRIVATE_ATTESTATIONS_ENABLED: ${{ vars.IDKMESH_ATTESTATIONS_ENABLED }}
        run: |
          set -eu
          if [ "$REPOSITORY_VISIBILITY" = "public" ]; then
            echo "Artifact attestations are supported for public repositories."
            exit 0
          fi
          if [ "$PRIVATE_ATTESTATIONS_ENABLED" = "true" ]; then
            echo "Private/internal attestation support was explicitly verified by the repository owner."
            exit 0
          fi
          echo "::error::Artifact attestation availability has not been verified for this private/internal repository plan."
          echo "::error::After verifying GitHub artifact-attestation support, set repository variable IDKMESH_ATTESTATIONS_ENABLED=true."
          exit 1

      - name: Attest built distributions
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Verify registered build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-supply-chain
          path: release-metadata/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment is the human gate. Require reviewers on it so a release
    # cannot publish to a public index without a deliberate approval.
    environment:
      name: pypi
      url: https://pypi.org/p/idkmesh
    permissions:
      contents: write
      # Mints the OIDC token trusted publishing exchanges for an upload token.
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Download release supply-chain evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-supply-chain
          path: release-metadata/

      - name: Re-verify artifact checksums before publication
        run: (cd dist && sha256sum -c ../release-metadata/checksums.txt)

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Attach SBOM and release evidence to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG"             release-metadata/checksums.txt             release-metadata/release-provenance.json             release-metadata/sbom.spdx.json             --clobber             --repo "$GITHUB_REPOSITORY"
