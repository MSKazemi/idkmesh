name: Publish to PyPI

# Inert until a PyPI trusted publisher exists for this repository and workflow.
# Nothing here stores or reads an API token: publication is authorised by the
# short-lived OIDC identity GitHub mints for this job, so there is no long-lived
# credential in repository secrets to leak or rotate.
#
# One-time setup on PyPI, done by the maintainer, before the first release:
#   PyPI -> Publishing -> Add a new pending publisher
#     owner:      MSKazemi
#     repository: idkmesh
#     workflow:   publish-pypi.yml
#     environment: pypi
# Until that exists, a release simply fails this job and publishes nothing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

# A publish must never be cancelled midway, so runs queue rather than race.
# cancel-in-progress: false also satisfies the repository-wide invariant that
# no workflow cancels runs outside pull requests.
concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out the tagged release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Verify tag and package version identity
        run: python tools/check_release_version.py --tag "$RELEASE_TAG"

      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment is the human gate. Require reviewers on it so a release
    # cannot publish to a public index without a deliberate approval.
    environment:
      name: pypi
      url: https://pypi.org/p/idkmesh
    permissions:
      # Mints the OIDC token trusted publishing exchanges for an upload token.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
