name: CI Shadow Planner

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-shadow-planner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-phase0.txt

      - name: Resolve immutable comparison revisions
        id: revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="${BEFORE_SHA:-0000000000000000000000000000000000000000}"
            head_sha="$CURRENT_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            if parent="$(git rev-parse "${head_sha}^" 2>/dev/null)"; then
              base_sha="$parent"
            else
              base_sha="0000000000000000000000000000000000000000"
            fi
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Test planner contracts and authority boundaries
        run: |
          set -euo pipefail
          python -m py_compile tools/ci_shadow_planner.py tests/test_ci_shadow_planner.py
          python -m unittest tests.test_ci_shadow_planner -v
          python tools/ci_shadow_planner.py self-test

      - name: Build exact-revision shadow plan and planning receipt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/idkmesh-ci-shadow"
          python tools/ci_shadow_planner.py plan \
            --repository "$GITHUB_REPOSITORY" \
            --repo-root . \
            --base-sha '${{ steps.revisions.outputs.base_sha }}' \
            --head-sha '${{ steps.revisions.outputs.head_sha }}' \
            --policy config/ci-policy-v0.1.json \
            --output-plan "$RUNNER_TEMP/idkmesh-ci-shadow/ci-plan.json" \
            --output-receipt "$RUNNER_TEMP/idkmesh-ci-shadow/ci-receipt.json" \
            --output-md "$RUNNER_TEMP/idkmesh-ci-shadow/ci-plan.md"

      - name: Recheck non-authority invariants on emitted artifacts
        env:
          EXPECTED_HEAD: ${{ steps.revisions.outputs.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(os.environ['RUNNER_TEMP']) / 'idkmesh-ci-shadow'
          plan = json.loads((root / 'ci-plan.json').read_text(encoding='utf-8'))
          receipt = json.loads((root / 'ci-receipt.json').read_text(encoding='utf-8'))
          plan_schema = json.loads(Path('schemas/ci-plan-v0.1.schema.json').read_text(encoding='utf-8'))
          receipt_schema = json.loads(Path('schemas/ci-receipt-v0.1.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator(plan_schema).validate(plan)
          Draft202012Validator(receipt_schema).validate(receipt)
          assert plan['head_sha'] == os.environ['EXPECTED_HEAD']
          assert plan['summary']['full_suite_baseline_required'] is True
          assert plan['authority'] == {
              'advisory_only': True,
              'execute': False,
              'skip_required_checks': False,
              'approve': False,
              'merge': False,
              'repository_write': False,
          }
          assert receipt['executed_checks'] == []
          assert receipt['authority']['execute'] is False
          assert receipt['authority']['merge'] is False
          PY

      - name: Publish shadow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-shadow-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/idkmesh-ci-shadow
          retention-days: 30
          if-no-files-found: error

      - name: Publish readable plan
        run: cat "$RUNNER_TEMP/idkmesh-ci-shadow/ci-plan.md" >> "$GITHUB_STEP_SUMMARY"

# Authority boundary:
# - the workflow reads candidate code through an ordinary pull_request event;
# - it receives no secrets and only contents:read;
# - policy entries are data and are never executed as commands;
# - all existing CI continues to run during shadow mode;
# - the plan and receipt cannot skip, execute, approve, merge, or write repository state;
# - public-project CI use remains within the repository's zero-project-spend policy.
