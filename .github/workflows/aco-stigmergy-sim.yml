name: aco-stigmergy-sim

on:
  push:
    paths:
      - "sim/aco_stigmergy_sim.py"
      - "sim/run_aco_sweep.py"
      - "sim/run_aco_parameter_sweep.py"
      - "sim/homeostatic_stigmergy_sim.py"
      - "sim/replay_task_routing.py"
      - "tests/test_aco_stigmergy_sim.py"
      - "tests/test_aco_parameter_sweep.py"
      - "tests/test_homeostatic_stigmergy_sim.py"
      - "tests/test_replay_task_routing.py"
      - "schemas/routing-replay-v0.schema.json"
      - "examples/routing-replay.example.json"
      - "experiments/E014-aco-stigmergic-task-routing.md"
      - "experiments/results/E014-*"
      - "docs/algorithms/ACO_STIGMERGIC_TASK_ROUTING.md"
      - "docs/algorithms/HOMEOSTATIC_STIGMERGY_ROUTING.md"
      - ".github/workflows/aco-stigmergy-sim.yml"
  pull_request:
    paths:
      - "sim/aco_stigmergy_sim.py"
      - "sim/run_aco_sweep.py"
      - "sim/run_aco_parameter_sweep.py"
      - "sim/homeostatic_stigmergy_sim.py"
      - "sim/replay_task_routing.py"
      - "tests/test_aco_stigmergy_sim.py"
      - "tests/test_aco_parameter_sweep.py"
      - "tests/test_homeostatic_stigmergy_sim.py"
      - "tests/test_replay_task_routing.py"
      - "schemas/routing-replay-v0.schema.json"
      - "examples/routing-replay.example.json"
      - "experiments/E014-aco-stigmergic-task-routing.md"
      - "experiments/results/E014-*"
      - "docs/algorithms/ACO_STIGMERGIC_TASK_ROUTING.md"
      - "docs/algorithms/HOMEOSTATIC_STIGMERGY_ROUTING.md"
      - ".github/workflows/aco-stigmergy-sim.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Run routing research tests
        run: python -m pytest -q tests/test_aco_stigmergy_sim.py tests/test_aco_parameter_sweep.py tests/test_homeostatic_stigmergy_sim.py tests/test_replay_task_routing.py
      - name: Validate replay schema/example
        run: |
          python -m json.tool schemas/routing-replay-v0.schema.json > /dev/null
          python -m json.tool examples/routing-replay.example.json > /dev/null
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open('schemas/routing-replay-v0.schema.json', encoding='utf-8'))
          example = json.load(open('examples/routing-replay.example.json', encoding='utf-8'))
          Draft202012Validator(schema).validate(example)
          PY
      - name: Smoke-test single simulation
        run: |
          python sim/aco_stigmergy_sim.py --strategy all --seed 7 --workers 12 --epochs 8 > /tmp/aco.json
          python -m json.tool /tmp/aco.json > /dev/null
      - name: Run reference 40-seed sweep
        run: |
          python sim/run_aco_sweep.py --seed-start 1 --seeds 40 --workers 24 --epochs 50 > /tmp/aco-sweep.json
          python -m json.tool /tmp/aco-sweep.json > /dev/null
          python - <<'PY'
          import json
          data = json.load(open('/tmp/aco-sweep.json', encoding='utf-8'))
          print('E014_REFERENCE_SUMMARY')
          for strategy in ('random', 'greedy', 'capability', 'aco'):
              print(strategy, json.dumps(data['summary'][strategy], sort_keys=True))
          PY
      - name: Run ACO parameter/Pareto sweep
        run: |
          python sim/run_aco_parameter_sweep.py --seed-start 1 --seeds 12 --workers 24 --epochs 50 > /tmp/aco-params.json
          python -m json.tool /tmp/aco-params.json > /dev/null
          python - <<'PY'
          import json
          data = json.load(open('/tmp/aco-params.json', encoding='utf-8'))
          print('E014_PARAMETER_SWEEP')
          print('configurations_tested', data['configurations_tested'])
          print('pareto_count', len(data['pareto_configurations']))
          for row in data['pareto_configurations'][:12]:
              print(json.dumps(row, sort_keys=True))
          PY
      - name: Run homeostatic hybrid comparison
        run: |
          python sim/homeostatic_stigmergy_sim.py --seed-start 1 --seeds 40 --workers 24 --epochs 50 > /tmp/homeostatic.json
          python -m json.tool /tmp/homeostatic.json > /dev/null
          python - <<'PY'
          import json
          data = json.load(open('/tmp/homeostatic.json', encoding='utf-8'))
          print('E014_HOMEOSTATIC_HYBRID')
          for strategy, row in data['summary'].items():
              print(strategy, json.dumps(row, sort_keys=True))
          PY
      - name: Smoke-test read-only replay
        run: |
          python sim/replay_task_routing.py examples/routing-replay.example.json --output /tmp/routing-replay.json
          python -m json.tool /tmp/routing-replay.json > /dev/null
          python - <<'PY'
          import json
          data = json.load(open('/tmp/routing-replay.json', encoding='utf-8'))
          print('E014_REPLAY_EXAMPLE')
          print('decisions', data['decisions'])
          print('heldout', json.dumps(data['mean_heldout_verified_utility_of_top_recommendation'], sort_keys=True))
          PY
