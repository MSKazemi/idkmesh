name: Independent verifier check

on:
  pull_request:
    paths:
      - "verifier/**"
      - "schemas/evaluator-plan-v0.1.schema.json"
      - "schemas/evaluator-plan-v0.2.schema.json"
      - "schemas/work-unit-v0.2.schema.json"
      - "schemas/result-manifest-v0.1.schema.json"
      - "schemas/verification-result-v0.1.schema.json"
      - "experiments/provenance_integrity.py"
      - ".github/workflows/independent-verifier-check.yml"
  push:
    branches: [main]
    paths:
      - "verifier/**"
      - "schemas/evaluator-plan-v0.1.schema.json"
      - "schemas/evaluator-plan-v0.2.schema.json"
      - "schemas/work-unit-v0.2.schema.json"
      - "schemas/result-manifest-v0.1.schema.json"
      - "schemas/verification-result-v0.1.schema.json"
      - "experiments/provenance_integrity.py"
      - ".github/workflows/independent-verifier-check.yml"

permissions:
  contents: read

jobs:
  verifier-contract-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install verifier package
        run: python -m pip install -e verifier
      - name: Validate evaluator schema and existing protocol contracts
        run: |
          python -m json.tool schemas/evaluator-plan-v0.2.schema.json > /dev/null
          python -m pip install -r requirements-phase0.txt
          python experiments/harness.py validate
          python experiments/provenance_integrity.py --self-test
      - name: Run independent verifier unit tests
        env:
          PYTHONPATH: verifier/src
        run: python -m unittest discover -s verifier/tests -v

# CI does not execute candidate code or Docker evaluator commands. Container/Git
# execution is mocked in unit tests. Real low-risk patch-evaluator acceptance still
# requires an explicitly controlled Docker host and separately retained evidence.
