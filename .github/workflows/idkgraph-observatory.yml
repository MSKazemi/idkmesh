name: idkgraph-observatory

on:
  pull_request:
    paths:
      - "**/*.md"
      - "tools/idkgraph_observatory.py"
      - "tools/idkgraph_health_checks.py"
      - "tools/idkgraph_markdown_index.py"
      - "tools/idkgraph_link_check.py"
      - "tools/idkgraph_repository_mapping.py"
      - "tools/idkgraph_workunit_cycles.py"
      - "tools/idkgraph_warning_sample.py"
      - "tools/idkgraph_review_session.py"
      - "tests/test_idkgraph_health_checks.py"
      - "tests/test_idkgraph_observatory.py"
      - "tests/test_conversation_index.py"
      - "tests/test_documentation_directory_index.py"
      - "tests/test_idkgraph_warning_sample.py"
      - "tests/test_idkgraph_review_session.py"
      - "tests/fixtures/idkgraph_observatory/**"
      - "examples/idkgraph-p1-review-session.example.json"
      - "schemas/idkgraph.schema.json"
      - ".github/workflows/idkgraph-observatory.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "tools/idkgraph_observatory.py"
      - "tools/idkgraph_health_checks.py"
      - "tools/idkgraph_markdown_index.py"
      - "tools/idkgraph_link_check.py"
      - "tools/idkgraph_repository_mapping.py"
      - "tools/idkgraph_workunit_cycles.py"
      - "tools/idkgraph_warning_sample.py"
      - "tools/idkgraph_review_session.py"
      - "tests/test_idkgraph_health_checks.py"
      - "tests/test_idkgraph_observatory.py"
      - "tests/test_conversation_index.py"
      - "tests/test_documentation_directory_index.py"
      - "tests/test_idkgraph_warning_sample.py"
      - "tests/test_idkgraph_review_session.py"
      - "tests/fixtures/idkgraph_observatory/**"
      - "examples/idkgraph-p1-review-session.example.json"
      - "schemas/idkgraph.schema.json"
      - ".github/workflows/idkgraph-observatory.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Phase 0 schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-phase0.txt
      - name: Run focused observatory, navigation, sampling, and review-evidence tests
        run: python -m unittest tests.test_idkgraph_health_checks tests.test_idkgraph_observatory tests.test_conversation_index tests.test_documentation_directory_index tests.test_idkgraph_warning_sample tests.test_idkgraph_review_session -v
      - name: Clean fixture must have zero deterministic errors
        run: |
          rm -rf /tmp/idkgraph-valid
          python tools/idkgraph_observatory.py \
            tests/fixtures/idkgraph_observatory/valid \
            --source-revision fixture:valid \
            --output-dir /tmp/idkgraph-valid \
            --fail-on-errors \
            --pretty
          python -m json.tool /tmp/idkgraph-valid/idkgraph.json > /dev/null
          python -m json.tool /tmp/idkgraph-valid/observatory.json > /dev/null
      - name: Broken fixture must fail closed after writing evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/idkgraph-broken
          if python tools/idkgraph_observatory.py \
            tests/fixtures/idkgraph_observatory/broken \
            --source-revision fixture:broken \
            --output-dir /tmp/idkgraph-broken \
            --fail-on-errors \
            --pretty; then
            echo "broken fixture unexpectedly passed" >&2
            exit 1
          fi
          python -m json.tool /tmp/idkgraph-broken/observatory.json > /dev/null
          python - <<'PY'
          import json
          report = json.load(open('/tmp/idkgraph-broken/observatory.json', encoding='utf-8'))
          categories = {item['category'] for item in report['findings'] if item['severity'] == 'error'}
          expected = {'missing_markdown_file', 'missing_markdown_anchor'}
          if categories != expected:
              raise SystemExit(f'unexpected broken-fixture categories: {sorted(categories)}')
          print('OK: two independent deterministic defect classes retained')
          PY
      - name: Replay full repository twice byte-for-byte
        run: |
          rm -rf /tmp/idkgraph-run-a /tmp/idkgraph-run-b
          python tools/idkgraph_observatory.py . --output-dir /tmp/idkgraph-run-a --pretty
          python tools/idkgraph_observatory.py . --output-dir /tmp/idkgraph-run-b --pretty
          cmp /tmp/idkgraph-run-a/idkgraph.json /tmp/idkgraph-run-b/idkgraph.json
          cmp /tmp/idkgraph-run-a/observatory.json /tmp/idkgraph-run-b/observatory.json
          cmp /tmp/idkgraph-run-a/repository-health.md /tmp/idkgraph-run-b/repository-health.md
      - name: Validate integrated graph and live repository health
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open('schemas/idkgraph.schema.json', encoding='utf-8'))
          graph = json.load(open('/tmp/idkgraph-run-a/idkgraph.json', encoding='utf-8'))
          summary = json.load(open('/tmp/idkgraph-run-a/observatory.json', encoding='utf-8'))
          schema_errors = sorted(Draft202012Validator(schema).iter_errors(graph), key=lambda error: list(error.absolute_path))
          if schema_errors:
              for error in schema_errors[:20]:
                  print('/'.join(map(str, error.absolute_path)), error.message)
              raise SystemExit(f'{len(schema_errors)} schema validation error(s)')

          hard_errors = [finding for finding in summary['findings'] if finding['severity'] == 'error']
          print(
              'OK: '
              f"{summary['graph']['nodes']} nodes, "
              f"{summary['graph']['hyperedges']} hyperedges, "
              f"{len(hard_errors)} deterministic error(s), "
              f"{summary['finding_counts']['by_severity'].get('warning', 0)} warning(s), "
              f"{summary['expected_negative_fixtures']['finding_count']} expected negative-fixture finding(s), "
              f"{summary['residual_health']['orphan_document_candidates']} orphan candidate(s), "
              f"{summary['residual_health']['accepted_decisions_without_document_link']} accepted-decision linkage warning(s)"
          )
          if hard_errors:
              for finding in hard_errors:
                  print(
                      'ERROR:',
                      finding['category'],
                      finding.get('source_path'),
                      f"line={finding.get('line', 0)}",
                      finding.get('message', ''),
                  )
              raise SystemExit(f'{len(hard_errors)} unexpected deterministic repository-health error(s)')
          PY
      - name: Emit deterministic orphan-review cohort
        run: |
          rm -f /tmp/idkgraph-orphan-sample.json
          python tools/idkgraph_warning_sample.py . \
            --category orphan_document_candidate \
            --sample-size 15 \
            --seed idkgraph-p1-orphans-v1 \
            --output /tmp/idkgraph-orphan-sample.json \
            --pretty
          python -m json.tool /tmp/idkgraph-orphan-sample.json > /dev/null
          cat /tmp/idkgraph-orphan-sample.json

# The observatory, sampler, and review-session validator compose deterministic
# evidence handling only. They have no repository/GitHub write, repair, semantic
# inference, approval, push, merge, or integration authority.
