name: Interoperability bindings check

on:
  pull_request:
    paths:
      - "interop/**"
      - "examples/work-units/**"
      - "schemas/work-unit.schema.json"
      - "schemas/result-manifest-v0.1.schema.json"
      - "schemas/verification-result-v0.1.schema.json"
      - "requirements-interoperability.txt"
      - "docs/interoperability/**"
      - ".github/workflows/interop-bindings-check.yml"
  push:
    branches: [main]
    paths:
      - "interop/**"
      - "examples/work-units/**"
      - "schemas/work-unit.schema.json"
      - "schemas/result-manifest-v0.1.schema.json"
      - "schemas/verification-result-v0.1.schema.json"
      - "requirements-interoperability.txt"
      - "docs/interoperability/**"
      - ".github/workflows/interop-bindings-check.yml"

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: interop-bindings-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official SDKs and schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-interoperability.txt
      - name: Test bindings, heterogeneous adapters, and normalization
        run: python -m unittest discover -s interop/tests -v

# The adapter test executes only an in-process deterministic mock: no network,
# subprocess, sandbox, secrets, or repository write. Worker completion never
# confers IDKMesh acceptance, which remains a separate verifier decision.
