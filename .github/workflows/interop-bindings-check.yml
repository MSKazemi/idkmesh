name: Interoperability bindings check

on:
  pull_request:
    paths:
      - "interop/**"
      - "examples/work-units/**"
      - "schemas/work-unit.schema.json"
      - "schemas/result-manifest-v0.1.schema.json"
      - "schemas/verification-result-v0.1.schema.json"
      - "requirements-interoperability.txt"
      - "docs/interoperability/**"
      - ".github/workflows/interop-bindings-check.yml"
  push:
    branches: [main]
    paths:
      - "interop/**"
      - "examples/work-units/**"
      - "schemas/work-unit.schema.json"
      - "schemas/result-manifest-v0.1.schema.json"
      - "schemas/verification-result-v0.1.schema.json"
      - "requirements-interoperability.txt"
      - "docs/interoperability/**"
      - ".github/workflows/interop-bindings-check.yml"

permissions:
  contents: read

jobs:
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned official SDKs and schema validator
        run: python -m pip install --disable-pip-version-check -r requirements-interoperability.txt
      - name: Test bindings, heterogeneous adapters, and normalization
        run: python -m unittest discover -s interop/tests -v

# The adapter test executes only an in-process deterministic mock: no network,
# subprocess, sandbox, secrets, or repository write. Worker completion never
# confers IDKMesh acceptance, which remains a separate verifier decision.
