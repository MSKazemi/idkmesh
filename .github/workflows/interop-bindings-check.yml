name: Interoperability bindings check

on:
  pull_request:
    paths:
      - "interop/**"
      - "examples/work-units/**"
      - "schemas/work-unit.schema.json"
      - "docs/interoperability/**"
      - ".github/workflows/interop-bindings-check.yml"
  push:
    branches: [main]
    paths:
      - "interop/**"
      - "examples/work-units/**"
      - "schemas/work-unit.schema.json"
      - "docs/interoperability/**"
      - ".github/workflows/interop-bindings-check.yml"

permissions:
  contents: read

jobs:
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test A2A and MCP semantic bindings
        run: python -m unittest discover -s interop/tests -v

# Pure binding logic only: no Work Unit is executed and no sandbox is started.
# The bindings translate work contracts between protocols; they never confer
# IDKMesh acceptance, which remains the verifier's decision.
