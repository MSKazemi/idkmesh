name: PR Gate

# Every other workflow in this repository is path-filtered, so no status check runs
# on every pull request. That makes branch protection unusable: a required check that
# never runs leaves the pull request permanently blocked, which is the "unrecoverable
# deadlock" issue #35 warns against. This workflow is deliberately unfiltered so it can
# serve as the one stable required check on `main`.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements-phase0.txt

      - name: Run the full test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Check deterministic Markdown link integrity
        env:
          PYTHONPATH: .
        run: |
          # Seeded negative fixtures under tests/fixtures/ are intentional, so this
          # asserts no NEW broken link is introduced outside those fixtures.
          python - <<'PY'
          import json, subprocess, sys
          raw = subprocess.run(
              [sys.executable, "tools/idkgraph_link_check.py"],
              capture_output=True, text=True, check=True,
          ).stdout
          findings = [
              f for f in json.loads(raw)["findings"]
              if "tests/fixtures/" not in f["source_path"]
          ]
          for f in findings:
              print(f"{f['severity']}: {f['source_path']}:{f['line']} {f['message']}")
          print(f"non-fixture link findings: {len(findings)}")
          sys.exit(1 if findings else 0)
          PY
