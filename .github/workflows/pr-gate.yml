name: PR Gate

# Every other workflow in this repository is path-filtered, so no status check runs
# on every pull request. That makes branch protection unusable: a required check that
# never runs leaves the pull request permanently blocked, which is the "unrecoverable
# deadlock" issue #35 warns against. This workflow is deliberately unfiltered so it can
# serve as the one stable required check on `main`.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history so the guard below can read every commit message in the
          # pull request. The repository is a few MiB, so this is effectively free.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Runs before the dependency install so an accidental auto-closure fails
      # fast. The guard is pure standard library and needs no packages.
      - name: Guard against unintended issue auto-closure
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: .
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Untrusted pull request text reaches the tool through the environment
          # and argv only, never through the shell as code.
          args=(--text "pull-request-title=${PR_TITLE}" --text "pull-request-body=${PR_BODY}")
          messages="${RUNNER_TEMP}/commit-messages"
          mkdir -p "${messages}"
          if ! revisions="$(git rev-list "${BASE_SHA}..${HEAD_SHA}" 2>/dev/null)"; then
            echo "::warning::commit range unavailable; scanning the head commit only"
            revisions="${HEAD_SHA}"
          fi
          for sha in ${revisions}; do
            git log -1 --format=%B "${sha}" > "${messages}/${sha}.txt"
            args+=(--file "commit-${sha:0:8}=${messages}/${sha}.txt")
          done
          python tools/closing_keyword_guard.py "${args[@]}"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements-phase0.txt

      - name: Run the full test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Check deterministic Markdown link integrity
        env:
          PYTHONPATH: .
        # The same script `make integration` runs locally. It previously lived
        # here as an inline heredoc, which no developer could execute before
        # pushing and which was free to drift from whatever was checked by hand.
        run: python scripts/check_links.py
