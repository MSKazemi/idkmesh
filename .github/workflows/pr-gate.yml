name: PR Gate

# This workflow is deliberately unfiltered so branch protection can depend on one
# stable required check for every pull request. Product/research workflows may be
# path-filtered, while CI Shadow Planner remains intentionally advisory and unfiltered.
# A required path-filtered check can deadlock a PR when it never runs; issue #35 records
# that failure mode. Keep PR Gate as the stable merge-safety surface on `main`.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history so the guard below can read every commit message in the
          # pull request. The repository is a few MiB, so this is effectively free.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-phase0.txt

      # Runs before the dependency install so an accidental auto-closure fails
      # fast. The guard is pure standard library and needs no packages.
      - name: Guard against unintended issue auto-closure
        if: github.event_name == 'pull_request'
        env:
          PYTHONPATH: .
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Untrusted pull request text reaches the tool through the environment
          # and argv only, never through the shell as code.
          args=(--text "pull-request-title=${PR_TITLE}" --text "pull-request-body=${PR_BODY}")
          messages="${RUNNER_TEMP}/commit-messages"
          mkdir -p "${messages}"
          if ! revisions="$(git rev-list "${BASE_SHA}..${HEAD_SHA}" 2>/dev/null)"; then
            echo "::warning::commit range unavailable; scanning the head commit only"
            revisions="${HEAD_SHA}"
          fi
          for sha in ${revisions}; do
            git log -1 --format=%B "${sha}" > "${messages}/${sha}.txt"
            args+=(--file "commit-${sha:0:8}=${messages}/${sha}.txt")
          done
          python tools/closing_keyword_guard.py "${args[@]}"

      - name: Guard Jules router-dispatch contract
        env:
          PYTHONPATH: .
        run: python tools/check_jules_contract.py

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements-phase0.txt

      # The `unit` tier (-m "not sim and not slow") is the same one a
      # contributor runs locally with `make test`, so this cannot drift from
      # what's documented. The full suite, including every `sim`/`slow`
      # simulation and sweep test, runs separately on a schedule (see
      # nightly-full-suite.yml) rather than blocking every PR on it: those
      # tests can take minutes and are about the health of the research
      # content, not about whether this specific change is safe to merge.
      - name: Run the unit test tier
        env:
          PYTHONPATH: .
        run: python scripts/testkit.py unit

      - name: Check deterministic Markdown link integrity
        env:
          PYTHONPATH: .
        # Shared with contributors: Markdown/anchors plus tracked local assets.
        # Seeded negative sources under tests/fixtures/ remain excluded.
        run: python scripts/check_links.py
