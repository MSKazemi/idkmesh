name: Phase B2 successor Task 001 attempt

on:
  pull_request:
    paths:
      - "tools/phase_b2_successor_task001_attempt.py"
      - ".github/workflows/phase-b2-successor-task001-attempt.yml"
      - "benchmarks/phase-b2-successor-five/**"
      - "experiments/evaluator_plan_runner.py"
      - "experiments/transition_patch_verifier.py"
  push:
    branches: [main]
    paths:
      - "tools/phase_b2_successor_task001_attempt.py"
      - ".github/workflows/phase-b2-successor-task001-attempt.yml"
      - "benchmarks/phase-b2-successor-five/**"
      - "experiments/evaluator_plan_runner.py"
      - "experiments/transition_patch_verifier.py"

permissions:
  contents: read

jobs:
  attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out frozen evaluator control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false

      - name: Check out exact Task 001 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MSKazemi/idkmesh
          ref: a69aa0ae1ae4862e507511cbd9ad854237d0ad32
          path: source
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "a69aa0ae1ae4862e507511cbd9ad854237d0ad32"
          test -z "$(git -C source status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency
        working-directory: control
        run: python -m pip install -r requirements-phase0.txt

      - name: Compile attempt and canonical verifier path
        working-directory: control
        run: |
          python -m py_compile \
            tools/phase_b2_successor_task001_attempt.py \
            experiments/evaluator_plan_runner.py \
            experiments/transition_patch_verifier.py

      - name: Run bounded single-worker baseline attempt
        working-directory: control
        run: |
          python tools/phase_b2_successor_task001_attempt.py \
            --source ../source \
            --output-root results/benchmarks/phase-b2-successor-five/task-001

      - name: Publish attempt summary
        if: always()
        shell: bash
        run: |
          SUMMARY="control/results/benchmarks/phase-b2-successor-five/task-001/attempt-001/attempt-summary.json"
          if test -f "$SUMMARY"; then
            echo '### Phase B2 successor Task 001 — attempt 001' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Attempt summary was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-b2-successor-task001-attempt001
          path: control/results/benchmarks/phase-b2-successor-five/task-001/attempt-001/
          if-no-files-found: error
          retention-days: 14

# Evidence and authority boundaries:
# - the benchmark definition and EvaluatorPlan are read-only frozen control inputs;
# - the worker transformation runs only in an isolated checkout of the immutable public source;
# - the canonical v0.4 patch verifier remains metadata-only and never executes candidate code;
# - the opaque-evidence regression is a separate behavioral seeded-negative channel;
# - workflow permissions are read-only, checkout credentials are not persisted, and no secrets are used;
# - no canonical write, push, PR approval, merge, project-paid compute, or automatic candidate-selection authority exists.
