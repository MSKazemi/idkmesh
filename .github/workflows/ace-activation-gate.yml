name: ACE Activation Gate

on:
  pull_request:
    paths:
      - 'scripts/ace_activation_gate.py'
      - 'tests/test_ace_activation_gate.py'
      - 'examples/community/ace-activation-gate-current.example.json'
      - 'docs/community/ACE_ACTIVATION_GATE.md'
      - '.github/workflows/ace-activation-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ace_activation_gate.py'
      - 'tests/test_ace_activation_gate.py'
      - 'examples/community/ace-activation-gate-current.example.json'
      - 'docs/community/ACE_ACTIVATION_GATE.md'
      - '.github/workflows/ace-activation-gate.yml'

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: ace-activation-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile gate
        run: python -m py_compile scripts/ace_activation_gate.py tests/test_ace_activation_gate.py
      - name: Run fail-closed unit tests
        run: python -m unittest tests.test_ace_activation_gate -v
      - name: Evaluate current repository fixture
        run: |
          python scripts/ace_activation_gate.py \
            examples/community/ace-activation-gate-current.example.json \
            --output /tmp/ace-activation.json
          python -m json.tool /tmp/ace-activation.json >/dev/null
      - name: Assert current fixture remains blocked by real descendant evidence only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/ace-activation.json').read_text())
          blockers = set(result['blockers'])
          assert result['decision'] == 'BLOCK'
          assert result['activation_gate_passed'] is False
          assert result['required_controller_mode_if_blocked'] == 'SHADOW'
          assert 'real_verified_descendant_evidence' in blockers
          # `main` is protected with required checks, so protection must NOT block.
          # Asserting the opposite would pin a false claim about repository state.
          assert 'component:integration_protection' not in blockers
          # Real external descendant evidence is the only honest remaining gate.
          assert blockers == {'real_verified_descendant_evidence'}
          assert 'review_capacity' not in blockers
          assert 'component:observer' not in blockers
          assert 'component:lineage' not in blockers
          assert 'component:security' not in blockers
          assert 'component:controller' not in blockers
          print('ACE Phase B correctly remains blocked by real-descendant evidence alone')
          PY
