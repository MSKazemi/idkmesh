name: Jules Dispatcher

# `agent-ready` is the approval boundary. This workflow adds `jules`, which the
# Google Labs Jules GitHub App treats as the execution signal.
on:
  issues:
    types: [labeled, closed]
  schedule:
    # Recovery sweep only. Normal dispatch is event-driven and immediate.
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jules-dispatch.yml'
      - 'config/jules-dispatch.json'
      - 'tools/jules_dispatcher.py'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jules-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name != 'issues' ||
      github.event.action == 'closed' ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Ensure dispatch labels exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/jules_dispatcher.py --init-labels

      - name: Dispatch newly approved issue immediately
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          python tools/jules_dispatcher.py
          --dispatch
          --event-issue "${ISSUE_NUMBER}"
          --max-dispatch 1

      - name: Fill available Jules capacity
        if: github.event_name != 'issues' || github.event.action == 'closed'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/jules_dispatcher.py --dispatch
