name: Jules Dispatcher

# Routing and execution are deliberately separate. The issue router decides
# whether bounded work is Jules-eligible; this workflow performs guarded
# provider dispatch. Routine runs never bootstrap labels so the hot path stays
# within a small GitHub API budget.
on:
  issues:
    types: [labeled, closed]
  schedule:
    # Recovery sweep only. Normal dispatch is event-driven through the router.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional routed issue to prioritize for one immediate dispatch
        required: false
        default: ''
        type: string
      bootstrap_labels:
        description: Create any missing Jules policy labels before dispatch
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/jules-dispatch.yml'
      - 'config/jules-dispatch.json'
      - 'tools/jules_dispatcher.py'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jules-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name != 'issues' ||
      github.event.action == 'closed' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'agent-ready' ||
        github.event.label.name == 'agent:jules-eligible'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Bootstrap dispatch labels
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/jules_dispatcher.py --init-labels

      - name: Dispatch explicitly labeled issue
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          python tools/jules_dispatcher.py
          --dispatch
          --event-issue "${ISSUE_NUMBER}"
          --max-dispatch 1

      - name: Dispatch routed issue from router
        if: github.event_name == 'workflow_dispatch' && inputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: >-
          python tools/jules_dispatcher.py
          --dispatch
          --event-issue "${ISSUE_NUMBER}"
          --max-dispatch 1

      - name: Fill available Jules capacity
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.issue_number == '') ||
          (github.event_name == 'issues' && github.event.action == 'closed')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/jules_dispatcher.py --dispatch
