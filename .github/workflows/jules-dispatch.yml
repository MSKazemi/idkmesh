name: Jules Dispatcher

# Routing and execution are deliberately separate. `agent-ready` is the
# manual approval boundary; `agent:jules-eligible` is deterministic routing
# metadata for trusted-authored low-risk work. The router calls this workflow
# through workflow_call so GitHub validates the handoff contract before runtime.
on:
  workflow_call:
    inputs:
      issue_number:
        description: Optional routed issue to prioritize for one immediate dispatch
        required: false
        default: ''
        type: string
      bootstrap_labels:
        description: Create any missing Jules policy labels before dispatch
        required: false
        default: false
        type: boolean
      fill_capacity:
        description: Reconcile sessions and fill available capacity for reusable callers
        required: false
        default: false
        type: boolean
    secrets:
      JULES_API_KEY:
        required: true
  issues:
    types: [labeled, closed]
  schedule:
    # Recovery/reconciliation only. Normal dispatch is event-driven.
    - cron: '17,47 * * * *'
  workflow_run:
    # Recovery/reconciliation only. A successful PR Gate completion is a
    # verification-capacity release event: the gate's matrix jobs have left
    # the active set, so live provider/repository/CI capacity may now admit
    # more dispatch. This never widens the 12/8 backpressure limits; the
    # dispatcher still decides admission from the current live backlog.
    workflows: ["PR Gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional routed issue to prioritize for one immediate dispatch
        required: false
        default: ''
        type: string
      bootstrap_labels:
        description: Create any missing Jules policy labels before dispatch
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jules-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (inputs.issue_number != '' ||
       github.event_name != 'issues' ||
       github.event.action == 'closed' ||
       (github.event.action == 'labeled' &&
        (github.event.label.name == 'agent-ready' ||
         github.event.label.name == 'agent:jules-eligible')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate Jules control-plane contract
        run: python tools/check_jules_contract.py

      - name: Bootstrap dispatch labels
        if: inputs.bootstrap_labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/jules_dispatcher.py --init-labels

      - name: Dispatch explicitly labeled issue
        if: github.event_name == 'issues' && github.event.action == 'labeled' && inputs.issue_number == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          python tools/jules_dispatcher.py
          --reconcile
          --dispatch
          --event-issue "${ISSUE_NUMBER}"
          --max-dispatch 1

      - name: Dispatch routed issue
        if: inputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: >-
          python tools/jules_dispatcher.py
          --reconcile
          --dispatch
          --event-issue "${ISSUE_NUMBER}"
          --max-dispatch 1

      - name: Reconcile and fill available Jules capacity
        if: >-
          inputs.fill_capacity ||
          (inputs.issue_number == '' &&
           (github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'workflow_run' ||
            (github.event_name == 'issues' && github.event.action == 'closed')))
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/jules_dispatcher.py --reconcile --dispatch
