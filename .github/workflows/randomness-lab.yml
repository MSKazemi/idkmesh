name: randomness-lab

on:
  push:
    paths:
      - "randomness_lab/**"
      - "tests/**"
      - ".github/workflows/randomness-lab.yml"
  pull_request:
    paths:
      - "randomness_lab/**"
      - "tests/**"
      - ".github/workflows/randomness-lab.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run randomness-lab tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test base CLI and JSON output
        run: |
          python -m randomness_lab --policy thompson --rounds 100 --seed 42 --output /tmp/result.json
          python -m json.tool /tmp/result.json > /dev/null
      - name: Smoke-test R1 experiment and JSON output
        run: |
          python -m randomness_lab.r1 --tasks 20 --trials 2 --swarm-size 3 --seed 42 --no-task-records --output /tmp/r1.json
          python -m json.tool /tmp/r1.json > /dev/null
      - name: Smoke-test R1 help-hurt sweep
        run: |
          python -m randomness_lab.r1_sweep --tasks 15 --trials 2 --worker-correlations 0,1 --verifier-correlations 0.5 --quality-penalties 0,0.5 --swarm-sizes 2 --seed 42 --output /tmp/r1-sweep.json
          python -m json.tool /tmp/r1-sweep.json > /dev/null
      - name: Smoke-test R1 real-result replay command surface
        run: python -m randomness_lab.r1_replay --help > /dev/null
      - name: Smoke-test R2 replayable scheduling benchmark
        run: |
          python -m randomness_lab.r2 --workers 20 --ticks 15 --arrivals 2 --churn-fraction 0.2 --availability-lag 2 --load-lag 2 --drain-ticks 40 --trace-output /tmp/r2-trace.json --output /tmp/r2.json
          python -m json.tool /tmp/r2-trace.json > /dev/null
          python -m json.tool /tmp/r2.json > /dev/null
          python -m randomness_lab.r2 --trace /tmp/r2-trace.json --policies power-two,capability-power-two,global-least-loaded --availability-lag 2 --load-lag 2 --drain-ticks 40 --output /tmp/r2-replay.json
          python -m json.tool /tmp/r2-replay.json > /dev/null
      - name: Smoke-test R2 scale/regime sweep
        run: |
          python -m randomness_lab.r2_scale --worker-counts 1,10,20 --seeds 7 --regimes fresh,stale --ticks 5 --arrival-divisor 10 --max-arrivals 2 --max-work 3 --drain-ticks 20 --oracle-max-workers 10 --output /tmp/r2-scale.json
          python -m json.tool /tmp/r2-scale.json > /dev/null
      - name: Smoke-test R3 evolutionary orchestration
        run: |
          python -m randomness_lab.r3 --population 8 --generations 3 --trials 12 --seed 42 --output /tmp/r3.json --report /tmp/r3.md
          python -m json.tool /tmp/r3.json > /dev/null
          grep -q "Human review required" /tmp/r3.md
          grep -q "Pre-heldout champion" /tmp/r3.md
