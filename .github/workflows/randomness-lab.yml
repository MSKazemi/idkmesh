name: randomness-lab

on:
  push:
    paths:
      - "randomness_lab/**"
      - "tests/**"
      - ".github/workflows/randomness-lab.yml"
  pull_request:
    paths:
      - "randomness_lab/**"
      - "tests/**"
      - ".github/workflows/randomness-lab.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run randomness-lab tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test base CLI and JSON output
        run: |
          python -m randomness_lab --policy thompson --rounds 100 --seed 42 --output /tmp/result.json
          python -m json.tool /tmp/result.json > /dev/null
      - name: Smoke-test R1 experiment and JSON output
        run: |
          python -m randomness_lab.r1 --tasks 20 --trials 2 --swarm-size 3 --seed 42 --no-task-records --output /tmp/r1.json
          python -m json.tool /tmp/r1.json > /dev/null
      - name: Smoke-test R1 help-hurt sweep
        run: |
          python -m randomness_lab.r1_sweep --tasks 15 --trials 2 --worker-correlations 0,1 --verifier-correlations 0.5 --quality-penalties 0,0.5 --swarm-sizes 2 --seed 42 --output /tmp/r1-sweep.json
          python -m json.tool /tmp/r1-sweep.json > /dev/null
      - name: Smoke-test churn scheduling benchmark
        run: |
          python -m randomness_lab.scheduling --workers 20 --steps 20 --seed 42 --output /tmp/scheduling.json
          python -m json.tool /tmp/scheduling.json > /dev/null

# Security note: randomness-lab CI executes only repository-owned synthetic
# simulators. It does not execute Work Unit/task commands, use secrets, or
# require external network access for experiment execution.
