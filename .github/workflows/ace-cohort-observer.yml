name: ACE Cohort Observer

on:
  issues:
    types: [opened, closed, reopened, assigned, unassigned, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, closed, reopened, edited, labeled, unlabeled]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ace-cohort-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Build ACE cohort snapshot
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoOwner = owner.toLowerCase();
            const statusTitle = '[ACE] Bootstrap Cohort Observatory';
            const statusLabel = 'ace:cohort-observer';
            const verifiedLabel = 'ace:verified-descendant';
            const trustedSeedAuthors = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const isExternalHuman = user => Boolean(
              user?.login &&
              user.login.toLowerCase() !== repoOwner &&
              user.type !== 'Bot'
            );

            // SECURITY: this workflow is metadata-only. In particular, the
            // pull_request_target trigger never checks out, imports, evaluates,
            // builds, installs, or executes pull-request-controlled content.

            const managedLabels = [
              {
                name: verifiedLabel,
                color: '1D76DB',
                description: 'Merged ACE descendant explicitly accepted as bootstrap verification evidence'
              },
              {
                name: statusLabel,
                color: '0E8A16',
                description: 'Workflow-owned ACE Bootstrap Cohort observatory issue'
              }
            ];
            for (const label of managedLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            const seeds = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              labels: 'growth-seed',
              per_page: 100
            });

            // A body marker plus a label is not sufficient provenance. Cohort 1 was
            // deliberately created by trusted repository actors, so require trusted
            // author association as an independent admission condition.
            const cohortSeeds = seeds.filter(issue =>
              !issue.pull_request &&
              (issue.body || '').includes('cohort=bootstrap-1') &&
              trustedSeedAuthors.has(issue.author_association || 'NONE')
            );

            const participants = new Set();
            const allCandidatePRs = new Map();
            const rows = [];
            let claimedSeeds = 0;
            let seedsWithCandidatePR = 0;
            let seedsWithMergedCandidate = 0;

            for (const seed of cohortSeeds.sort((a, b) => a.number - b.number)) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: seed.number,
                per_page: 100
              });

              const externalComments = comments.filter(comment => isExternalHuman(comment.user));
              for (const comment of externalComments) participants.add(comment.user.login);

              const claimComments = externalComments.filter(comment =>
                /(^|\s)\/claim(?:\s|$)/i.test(comment.body || '')
              );

              const externalAssignees = (seed.assignees || []).filter(user => isExternalHuman(user));
              for (const user of externalAssignees) participants.add(user.login);

              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner,
                repo,
                issue_number: seed.number,
                per_page: 100
              });

              const prNumbers = new Set();
              for (const event of timeline) {
                if (event.event === 'cross-referenced' && event.source?.issue?.pull_request) {
                  prNumbers.add(event.source.issue.number);
                }
              }

              const prs = [];
              for (const prNumber of prNumbers) {
                const { data: pr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber
                });
                if (!isExternalHuman(pr.user)) continue;
                prs.push(pr);
                allCandidatePRs.set(pr.number, pr);
                participants.add(pr.user.login);
              }

              const merged = prs.filter(pr => Boolean(pr.merged_at));
              const verified = merged.filter(pr =>
                (pr.labels || []).some(label => label.name === verifiedLabel)
              );

              const claimed = externalAssignees.length > 0 || claimComments.length > 0 || prs.length > 0;
              if (claimed) claimedSeeds += 1;
              if (prs.length > 0) seedsWithCandidatePR += 1;
              if (merged.length > 0) seedsWithMergedCandidate += 1;

              rows.push({
                number: seed.number,
                state: seed.state,
                claimed,
                externalInterest: externalComments.length,
                candidatePRs: prs.map(pr => pr.number),
                mergedPRs: merged.map(pr => pr.number),
                verifiedPRs: verified.map(pr => pr.number)
              });
            }

            const candidatePRs = [...allCandidatePRs.values()];
            const openCandidatePRs = candidatePRs.filter(pr => pr.state === 'open');
            const mergedCandidatePRs = candidatePRs.filter(pr => Boolean(pr.merged_at));
            const verifiedPRNumbers = new Set();
            for (const row of rows) {
              for (const number of row.verifiedPRs) verifiedPRNumbers.add(number);
            }

            // Read the ACE ledger only as a capacity signal and never edit it.
            // Prefer workflow-owned ledger identity; fall back to legacy #23 while
            // the consolidated ACE safety change is still under review.
            let reviewLoad = null;
            let capacity = null;
            try {
              const labelledLedgers = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: 'ace:ledger', per_page: 100
              });
              let ledger = labelledLedgers.find(issue => !issue.pull_request);
              if (!ledger) {
                const legacy = await github.rest.issues.get({ owner, repo, issue_number: 23 });
                ledger = legacy.data;
              }
              const match = (ledger.body || '').match(/<!-- ACE_STATE\n([\s\S]*?)\nACE_STATE -->/);
              if (match) {
                const state = JSON.parse(match[1]);
                reviewLoad = Number(state.review_load || 0);
                const K = 8;
                const tau = 2;
                capacity = 1 / (1 + Math.exp((reviewLoad - K) / tau));
              }
            } catch (_) {
              // Capacity is advisory here. Missing/unparseable ledger evidence yields
              // unknown capacity rather than fabricated zero/default state.
            }

            const seedReproductionRatio = cohortSeeds.length
              ? verifiedPRNumbers.size / cohortSeeds.length
              : 0;

            const capacityHealthy = capacity === null || capacity >= 0.60;
            const recommendation = (
              verifiedPRNumbers.size >= 2 &&
              claimedSeeds >= 2 &&
              openCandidatePRs.length <= 3 &&
              capacityHealthy
            ) ? 'EVALUATE_COHORT_2' : 'HOLD_COHORT_1';

            const snapshot = {
              version: 1,
              updated_at: new Date().toISOString(),
              cohort: 'bootstrap-1',
              metric_scope: 'bootstrap_growth_seed_exposure',
              full_r_community_ready: false,
              seeds_total: cohortSeeds.length,
              trusted_seed_numbers: cohortSeeds.map(seed => seed.number).sort((a, b) => a - b),
              seeds_claimed: claimedSeeds,
              seeds_with_candidate_pr: seedsWithCandidatePR,
              seeds_with_merged_candidate: seedsWithMergedCandidate,
              verified_descendant_prs: [...verifiedPRNumbers].sort((a, b) => a - b),
              candidate_prs_total: candidatePRs.length,
              candidate_prs_open: openCandidatePRs.length,
              merged_candidate_prs: mergedCandidatePRs.length,
              distinct_external_participants: participants.size,
              seed_reproduction_ratio: seedReproductionRatio,
              ace_review_load: reviewLoad,
              ace_capacity: capacity,
              recommendation
            };

            const tableRows = rows.map(row => {
              const fmt = values => values.length ? values.map(n => `#${n}`).join(', ') : '—';
              return `| #${row.number} | ${row.state} | ${row.claimed ? 'yes' : 'no'} | ${row.externalInterest} | ${fmt(row.candidatePRs)} | ${fmt(row.verifiedPRs)} |`;
            });

            const body = [
              '# ACE Bootstrap Cohort Observatory',
              '',
              'This issue is maintained by `.github/workflows/ace-cohort-observer.yml`.',
              '',
              'It observes trusted Bootstrap Cohort 1 Growth Seeds and separates **interest**, **claim**, **candidate work**, **merge**, and a bootstrap **verified-descendant label**. Raw activity is not success.',
              '',
              `**Recommendation:** \`${recommendation}\`  `,
              `**Trusted seeds:** ${cohortSeeds.length}  `,
              `**Claimed seeds:** ${claimedSeeds}  `,
              `**Seeds with candidate PRs:** ${seedsWithCandidatePR}  `,
              `**Bootstrap verified descendant PRs:** ${verifiedPRNumbers.size}  `,
              `**Distinct external participants:** ${participants.size}  `,
              `**Seed reproduction ratio:** ${seedReproductionRatio.toFixed(3)}  `,
              `**ACE capacity:** ${capacity === null ? 'unknown' : capacity.toFixed(3)}  `,
              `**Updated:** ${snapshot.updated_at}`,
              '',
              '> `SeedReproductionRatio = bootstrap verified descendant PRs / trusted Growth Seeds` is a cohort-exposure metric, **not** the full `R_community`. PR #48 defines the causal ACE lineage contract. A future generation snapshot must combine an independent matured-parent inventory with validated lineage receipts; this observer alone must not claim the full reproduction number.',
              '',
              '## Cohort state',
              '',
              '| Seed | State | Claimed | External comments | Candidate PRs | Verified PRs |',
              '| --- | --- | --- | ---: | --- | --- |',
              ...tableRows,
              '',
              '## Evidence rules',
              '',
              '- Cohort admission requires `growth-seed`, the explicit `cohort=bootstrap-1` marker, and trusted repository author association.',
              '- Bootstrap community metrics exclude repository-owner activity and GitHub bot accounts.',
              '- A seed is **claimed** by an external human assignee, an external human `/claim` comment, or an external-human-authored cross-referenced PR.',
              '- A cross-referenced PR is **candidate work**, not verified evidence.',
              `- A merged candidate receives bootstrap verified-descendant status only after a trusted repository actor applies the \`${verifiedLabel}\` label.`,
              '- That label is an acceptance signal eligible to support an ACE lineage receipt; it is not by itself cross-generation causal proof and does not grant merge authority.',
              '- The observer never creates Cohort 2. `EVALUATE_COHORT_2` is only a recommendation for human/community review.',
              '',
              '<!-- ACE_COHORT_STATE',
              JSON.stringify(snapshot, null, 2),
              'ACE_COHORT_STATE -->'
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });
            let statusIssue = openIssues.find(issue =>
              !issue.pull_request &&
              (issue.labels || []).some(label => label.name === statusLabel)
            );

            // Migrate the oldest legitimate legacy observatory only when it already
            // contains the machine state marker. A matching title alone is not identity.
            if (!statusIssue) {
              const legacy = openIssues
                .filter(issue =>
                  !issue.pull_request &&
                  issue.title === statusTitle &&
                  (issue.body || '').includes('<!-- ACE_COHORT_STATE')
                )
                .sort((a, b) => a.number - b.number)[0];
              if (legacy) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: legacy.number, labels: [statusLabel]
                });
                statusIssue = legacy;
              }
            }

            if (statusIssue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: statusIssue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: statusTitle,
                body,
                labels: [statusLabel]
              });
            }
