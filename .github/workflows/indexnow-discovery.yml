name: IndexNow Discovery

on:
  push:
    branches:
      - main
    paths:
      - 'docs/index.html'
      - 'docs/topics/**'
      - 'docs/sitemap.xml'
      - 'docs/llms.txt'
      - 'docs/_config.yml'
      - 'tools/submit_indexnow.py'
      - '.github/workflows/indexnow-discovery.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-discovery
  cancel-in-progress: false

jobs:
  notify:
    name: notify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out canonical repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Notify IndexNow about recently changed documentation
        run: python tools/submit_indexnow.py --days 3
