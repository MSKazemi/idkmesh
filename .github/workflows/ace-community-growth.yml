name: ACE Community Growth

on:
  issues:
    types: [opened, closed]
  pull_request_target:
    types: [opened, closed]
  push:
    branches: [main]
  watch:
    types: [started]
  fork:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ace-community-growth
  cancel-in-progress: false

jobs:
  update-growth-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Update ACE Growth Ledger
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ACE_AUTONOMOUS_ACTUATION_ENABLED: ${{ vars.ACE_AUTONOMOUS_ACTUATION_ENABLED }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            const ledgerTitle = '[ACE] Community Growth Ledger';
            const trustedIssueAuthors = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            // SECURITY: pull_request_target has write-capable permissions. This workflow
            // intentionally NEVER checks out, imports, executes, evaluates, builds, or
            // installs PR-controlled code. It consumes GitHub metadata only.
            //
            // A generic `protected: true` branch bit is necessary but not sufficient to
            // prove that the intended IDKMesh integration rules are configured. ACE
            // reproductive actuation therefore requires BOTH GitHub protection and a
            // separate explicit repository-level opt-in made after the admin verification
            // procedure in docs/admin/MAIN_PROTECTION.md.
            const { data: mainBranch } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main'
            });
            const mainProtected = Boolean(mainBranch.protected);
            const explicitActuationOptIn =
              process.env.ACE_AUTONOMOUS_ACTUATION_ENABLED === 'true';
            const actuationAllowed = mainProtected && explicitActuationOptIn;

            // ACE bootstraps only labels it owns. Standard GitHub labels such as
            // good first issue / help wanted remain under normal repository control.
            const managedLabels = [
              { name: 'growth:spawn', color: '0E8A16', description: 'Allow a verified merged PR to create one bounded ACE Growth Seed' },
              { name: 'growth-seed', color: '5319E7', description: 'Bounded contribution opportunity participating in an ACE growth experiment' },
              { name: 'ace:ledger', color: '1D76DB', description: 'Workflow-owned ACE community-growth state ledger' }
            ];

            for (const label of managedLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            const event = context.eventName;
            const action = context.payload.action || 'event';
            let type = `${event}:${action}`;
            let q = 0.05, d = 0.05, r = 0.05;

            if (event === 'push') {
              type = 'push:main'; q = 0.25; d = 0.10; r = 0;
            } else if (event === 'issues' && action === 'opened') {
              q = 0.10; d = 0.60; r = 0.20;
            } else if (event === 'issues' && action === 'closed') {
              q = 0.80; d = 0.10; r = 0.20;
            } else if (event === 'pull_request_target' && action === 'opened') {
              type = 'pull_request:opened'; q = 0.20; d = 0.70; r = 0.40;
            } else if (event === 'pull_request_target' && action === 'closed' && context.payload.pull_request?.merged) {
              type = 'pull_request:merged'; q = 2.50; d = 0.40; r = 1.00;
            } else if (event === 'pull_request_target' && action === 'closed') {
              type = 'pull_request:closed'; q = 0.10; d = 0.05; r = 0.10;
            } else if (event === 'watch') {
              type = 'watch:star'; q = 0; d = 0.35; r = 0;
            } else if (event === 'fork') {
              type = 'fork:created'; q = 0.10; d = 0.90; r = 0.10;
            }

            // Marker text is data, not authorization. Only repository-trusted issue
            // authors may cause the workflow to apply the growth-seed label.
            if (event === 'issues' && action === 'opened') {
              const issue = context.payload.issue;
              const association = issue?.author_association || 'NONE';
              if (
                (issue?.body || '').includes('<!-- ACE_SEED') &&
                trustedIssueAuthors.has(association)
              ) {
                const currentLabels = (issue.labels || []).map(label => label.name);
                if (!currentLabels.includes('growth-seed')) {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: issue.number, labels: ['growth-seed']
                  });
                }
              }
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });

            // Canonical ledger identity must be unambiguous. Multiple workflow-labelled
            // ledgers are controller-state corruption and require human repair.
            const labelledLedgers = issues.filter(
              i => !i.pull_request &&
                (i.labels || []).some(label => label.name === 'ace:ledger')
            );
            if (labelledLedgers.length > 1) {
              throw new Error(
                'Multiple open ACE ledgers carry ace:ledger; refusing ambiguous controller state.'
              );
            }
            let ledger = labelledLedgers[0];

            // Migration may adopt exactly one legacy ledger, but never one created by an
            // untrusted external issue author. A look-alike title/state marker is data,
            // not authority to become controller memory.
            if (!ledger) {
              const legacyLedgers = issues
                .filter(
                  i => !i.pull_request &&
                    i.title === ledgerTitle &&
                    (i.body || '').includes('<!-- ACE_STATE') &&
                    trustedIssueAuthors.has(i.author_association || 'NONE')
                )
                .sort((a, b) => a.number - b.number);
              if (legacyLedgers.length > 1) {
                throw new Error(
                  'Multiple trusted legacy ACE ledgers found; refusing ambiguous migration.'
                );
              }
              ledger = legacyLedgers[0];
              if (ledger) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: ledger.number, labels: ['ace:ledger']
                });
              }
            }

            const defaultState = {
              version: 1,
              updated_at: now.toISOString(),
              credit: 0,
              review_load: 0,
              review_load_components: null,
              counts: {},
              total_events: 0
            };

            const isPlainObject = value =>
              value !== null && typeof value === 'object' && !Array.isArray(value);

            const validateAceState = candidate => {
              if (!isPlainObject(candidate)) {
                throw new Error('ACE_STATE must be a JSON object.');
              }
              if (candidate.version !== 1) {
                throw new Error(`Unsupported ACE_STATE version: ${candidate.version}`);
              }
              if (typeof candidate.updated_at !== 'string') {
                throw new Error('ACE_STATE updated_at must be an ISO timestamp string.');
              }
              const updatedAt = new Date(candidate.updated_at);
              if (
                Number.isNaN(updatedAt.getTime()) ||
                updatedAt.toISOString() !== candidate.updated_at
              ) {
                throw new Error('ACE_STATE updated_at must be a canonical ISO timestamp.');
              }
              if (updatedAt.getTime() > now.getTime() + 300000) {
                throw new Error('ACE_STATE updated_at is implausibly far in the future.');
              }
              for (const [field, value] of [
                ['credit', candidate.credit],
                ['review_load', candidate.review_load]
              ]) {
                if (typeof value !== 'number' || !Number.isFinite(value) || value < 0) {
                  throw new Error(`ACE_STATE ${field} must be a finite non-negative number.`);
                }
              }
              if (!Number.isSafeInteger(candidate.total_events) || candidate.total_events < 0) {
                throw new Error('ACE_STATE total_events must be a non-negative safe integer.');
              }
              if (!isPlainObject(candidate.counts)) {
                throw new Error('ACE_STATE counts must be an object.');
              }
              for (const [key, value] of Object.entries(candidate.counts)) {
                if (!/^[a-z0-9:_-]{1,64}$/.test(key)) {
                  throw new Error(`ACE_STATE contains invalid count key: ${key}`);
                }
                if (!Number.isSafeInteger(value) || value < 0) {
                  throw new Error(
                    `ACE_STATE count ${key} must be a non-negative safe integer.`
                  );
                }
              }
              return candidate;
            };

            let state = defaultState;
            if (ledger) {
              const match = (ledger.body || '').match(/<!-- ACE_STATE\n([\s\S]*?)\nACE_STATE -->/);
              if (!match) {
                throw new Error('ACE ledger is missing its ACE_STATE block; refusing to overwrite state.');
              }
              try {
                state = validateAceState(JSON.parse(match[1]));
              } catch (error) {
                throw new Error(
                  `ACE ledger state is invalid; refusing to reset or overwrite it: ${error.message}`
                );
              }
            }

            const previous = new Date(state.updated_at);
            const days = Math.max(0, (now - previous) / 86400000);
            const lambda = 0.035;
            state.credit = state.credit * Math.exp(-lambda * days);

            const count = state.counts[type] || 0;
            const novelty = 1 / Math.sqrt(1 + count);

            // Carrying capacity represents current recoverable review pressure, not a
            // historical activity accumulator. Completed work can therefore release
            // pressure instead of leaving permanent residual load in controller state.
            const labelsOf = item => new Set((item.labels || []).map(label => label.name));
            const readyPullRequests = openPullRequests.filter(pr => !pr.draft);
            const draftPullRequests = openPullRequests.filter(pr => Boolean(pr.draft));
            const openGrowthSeeds = issues.filter(item =>
              !item.pull_request && labelsOf(item).has('growth-seed')
            );
            const otherOpenIssues = issues.filter(item => {
              if (item.pull_request || item.number === ledger?.number) return false;
              const labels = labelsOf(item);
              if (labels.has('growth-seed')) return false;
              if (labels.has('ace:ledger') || labels.has('ace:cohort-observer')) return false;
              return true;
            });

            // live-open-work-v1 is an explicit bootstrap heuristic, not an empirical law.
            // Review-ready PRs dominate pressure; drafts reserve discounted future review
            // capacity; Growth Seeds carry coordination cost; ordinary issues are capped.
            const liveReviewLoad =
              1.00 * readyPullRequests.length +
              0.25 * draftPullRequests.length +
              0.50 * openGrowthSeeds.length +
              0.10 * Math.min(otherOpenIssues.length, 20);

            state.review_load = liveReviewLoad;
            state.review_load_components = {
              model: 'live-open-work-v1',
              ready_pull_requests: readyPullRequests.length,
              draft_pull_requests: draftPullRequests.length,
              open_growth_seeds: openGrowthSeeds.length,
              other_open_issues: otherOpenIssues.length,
              other_open_issues_capped_at: 20
            };

            const K = 8;
            const tau = 2;
            const capacity = 1 / (1 + Math.exp((state.review_load - K) / tau));
            const activityEnergy = q + d + r;
            const deltaCredit = activityEnergy * novelty * capacity;

            state.credit += deltaCredit;
            state.counts[type] = count + 1;
            state.total_events += 1;
            state.updated_at = now.toISOString();

            let mode = 'DORMANT';
            if (!actuationAllowed || state.review_load > K) mode = 'CONSOLIDATE';
            else if (state.credit >= 8) mode = 'GROW';
            else if (state.credit >= 2) mode = 'EXPLORE';

            const sortedRows = Object.entries(state.counts)
              .sort((a, b) => b[1] - a[1])
              .slice(0, 12)
              .map(([k, v]) => `| ${k} | ${v} |`);

            const protectionLine = !mainProtected
              ? '**Main protection:** DISABLED; ACE reproductive actuation is fail-closed.  '
              : explicitActuationOptIn
                ? '**Main protection:** enabled; explicit ACE actuation opt-in is enabled.  '
                : '**Main protection:** enabled; explicit ACE actuation opt-in is DISABLED.  ';

            const body = [
              '# ACE Community Growth Ledger',
              '',
              'This issue is maintained by the experimental [Autocatalytic Community Evolution](../blob/main/COMMUNITY_GROWTH_ENGINE.md) workflow.',
              '',
              `**Mode:** ${mode}  `,
              protectionLine,
              `**Reproductive credit:** ${state.credit.toFixed(3)}  `,
              `**Review-load proxy:** ${state.review_load.toFixed(2)}  `,
              `**Review-load model:** \`${state.review_load_components.model}\`  `,
              `**Open-work components:** ${readyPullRequests.length} ready PRs + ${draftPullRequests.length} draft PRs + ${openGrowthSeeds.length} Growth Seeds + ${otherOpenIssues.length} other issues  `,
              `**Capacity multiplier:** ${capacity.toFixed(3)}  `,
              `**Last event:** \`${type}\`  `,
              `**Last credit increment:** ${deltaCredit.toFixed(3)}  `,
              `**Updated:** ${state.updated_at}`,
              '',
              'The objective is not maximum activity. ACE aims to increase **verified useful descendants per unit of scarce human attention** while reducing reproduction pressure when review capacity becomes constrained.',
              '',
              ...(actuationAllowed ? [] : [
                '> Safety gate: autonomous ACE reproduction is disabled. Both the protected integration boundary and the explicit repository actuation opt-in must be enabled before ACE may spawn Growth Seeds.',
                ''
              ]),
              '| Event type | Observed count |',
              '| --- | ---: |',
              ...(sortedRows.length ? sortedRows : ['| none yet | 0 |']),
              '',
              '> Event counts are historical observations, not current review load. `live-open-work-v1`, its weights, `K=8`, and `tau=2` are explicit bootstrap hypotheses that must be calibrated from real review latency/attention evidence.',
              '',
              '<!-- ACE_STATE',
              JSON.stringify(state, null, 2),
              'ACE_STATE -->'
            ].join('\n');

            if (ledger) {
              await github.rest.issues.update({ owner, repo, issue_number: ledger.number, body });
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: ledgerTitle, body, labels: ['ace:ledger']
              });
              ledger = created.data;
            }

            // Conservative v0 actuator: only an explicitly labelled merged PR can
            // reproduce, and only while both safety gates are enabled.
            if (actuationAllowed && event === 'pull_request_target' && action === 'closed' && context.payload.pull_request?.merged) {
              const pr = context.payload.pull_request;
              const labels = (pr.labels || []).map(l => l.name);
              if (labels.includes('growth:spawn')) {
                const marker = `spawned-from:pr-${pr.number}`;
                const existing = await github.paginate(github.rest.issues.listForRepo, {
                  owner, repo, state: 'all', per_page: 100
                });
                const alreadySpawned = existing.some(
                  i => !i.pull_request &&
                    (i.labels || []).some(label => label.name === 'growth-seed') &&
                    (i.body || '').includes(marker)
                );

                if (!alreadySpawned) {
                  const seedBody = [
                    `## Growth Seed: reproduce, challenge, or extend PR #${pr.number}`,
                    '',
                    'A useful contribution should make the next useful contribution easier. This seed was created by ACE because the merged PR was explicitly labelled `growth:spawn`.',
                    '',
                    'Choose one bounded path:',
                    '',
                    '- **Reproduce:** independently verify the result and document what you observe.',
                    '- **Challenge:** try to falsify an assumption, test an edge case, or find a regression.',
                    '- **Extend:** propose one small, independently reviewable next step.',
                    '- **Explain:** turn the result into a newcomer-legible example or tutorial.',
                    '',
                    '### Acceptance principle',
                    '',
                    'Return evidence, not only an opinion: a test, reproduction log, benchmark, patch, documentation improvement, threat model, or other inspectable artifact.',
                    '',
                    '### Parent',
                    '',
                    `- PR: #${pr.number}`,
                    `- ${marker}`,
                    '',
                    '### Community impact',
                    '',
                    'Keep the task bounded enough that a new contributor can understand what success means without private maintainer guidance.',
                    '',
                    '<!-- ACE_SEED type=reproduce cohort=automatic -->'
                  ].join('\n');

                  await github.rest.issues.create({
                    owner,
                    repo,
                    title: `[Growth Seed] Reproduce or extend PR #${pr.number}`,
                    body: seedBody,
                    labels: ['growth-seed', 'help wanted']
                  });
                }
              }
            }
