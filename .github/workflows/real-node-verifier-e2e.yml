name: Real Node to Independent Verifier E2E

on:
  pull_request:
    paths:
      - "tools/real_node_verifier_e2e.py"
      - ".github/workflows/real-node-verifier-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-node-verifier-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evaluator-owned current tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: evaluator
          persist-credentials: false

      - name: Check out exact accepted node candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 520ad2c9aa5825476de4957da4702d6823f4edb3
          path: candidate
          persist-credentials: false

      - name: Verify producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "520ad2c9aa5825476de4957da4702d6823f4edb3"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency only
        run: python -m pip install "jsonschema>=4.23,<5"

      - name: Preload allowlisted runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine

      - name: Generate real bundle then independently verify
        shell: bash
        run: |
          set -euo pipefail
          python evaluator/tools/real_node_verifier_e2e.py \
            --candidate candidate \
            --output-root results/verification/real-node-520ad2c

      - name: Publish evidence to job summary
        if: always()
        shell: bash
        run: |
          EVIDENCE="evaluator/results/verification/real-node-520ad2c/e2e-evidence.json"
          VERIFICATION="evaluator/results/verification/real-node-520ad2c/verification-result.json"
          if test -f "$EVIDENCE"; then
            echo '## Real node -> independent verifier' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$EVIDENCE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'E2E evidence file was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$VERIFICATION"; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Canonical VerificationResult generated under evaluator-owned results/.' >> "$GITHUB_STEP_SUMMARY"
          fi

# Authority boundary:
# - worker is checked out by exact accepted SHA and cannot modify evaluator control;
# - checkout credentials are not persisted and no repository secrets are supplied;
# - evaluator plan is derived from the current canonical v0.2 fixture only after candidate generation;
# - verifier is metadata-only and executes no candidate code;
# - workflow has read-only repository permission and no approve/push/merge authority;
# - verifier recommendation remains decision support; human integration is external.
