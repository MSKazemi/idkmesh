name: Real Node to Independent Verifier E2E

on:
  pull_request:
    paths:
      - "tools/node_runtime_acceptance.py"
      - "tools/node_verifier_e2e.py"
      - "tools/node_verifier_e2e_current.py"
      - ".github/workflows/real-node-verifier-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-node-to-independent-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out evaluator-owned harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: harness
          persist-credentials: false

      - name: Check out exact frozen PR 91 node producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 520ad2c9aa5825476de4957da4702d6823f4edb3
          path: candidate
          persist-credentials: false

      - name: Verify producer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "520ad2c9aa5825476de4957da4702d6823f4edb3"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency only
        run: python -m pip install "jsonschema>=4.23,<5"

      - name: Preload allowlisted runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine

      - name: Generate real node bundle and independently verify it
        shell: bash
        run: |
          set -euo pipefail
          python harness/tools/node_verifier_e2e_current.py \
            --candidate candidate \
            --output-root results/verification/real-node-520ad2c

      - name: Publish evidence to job summary
        if: always()
        shell: bash
        run: |
          EVIDENCE="harness/results/verification/real-node-520ad2c/e2e-evidence.json"
          VERIFICATION="harness/results/verification/real-node-520ad2c/verification-result.json"
          if test -f "$EVIDENCE"; then
            echo '## Real node -> independent verifier evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$EVIDENCE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Real node -> verifier evidence file was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$VERIFICATION"; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'VerificationResult was generated under evaluator-owned results/.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Persist replayable evaluator evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-node-verifier-evidence-${{ github.run_id }}
          path: harness/results/verification/real-node-520ad2c/
          if-no-files-found: error
          retention-days: 30

# Security boundary:
# - evaluator workflow is separate from the exact frozen worker candidate tree;
# - candidate is checked out only by immutable SHA;
# - checkout/setup/upload actions are pinned to reviewed immutable SHAs;
# - checkout credentials are not persisted;
# - workflow has contents: read and no repository secrets are passed to candidate code;
# - candidate subprocesses receive a sanitized environment from the evaluator harness;
# - task containers run under the node's network-none/read-only/cap-drop/no-new-privileges policy;
# - EvaluatorPlan is constructed outside the candidate bundle after generation;
# - the unified-diff verifier performs metadata-only verification and executes no candidate code;
# - evidence is persisted for replay/review but grants no merge/approval authority.
