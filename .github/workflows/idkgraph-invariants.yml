name: IDKGraph Invariants

on:
  push:
    branches: [main]
    paths:
      - 'scripts/idkgraph_check.py'
      - 'schemas/idkgraph.schema.json'
      - 'examples/idkgraph*.json'
      - '.github/workflows/idkgraph-invariants.yml'
  pull_request:
    paths:
      - 'scripts/idkgraph_check.py'
      - 'schemas/idkgraph.schema.json'
      - 'examples/idkgraph*.json'
      - '.github/workflows/idkgraph-invariants.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: idkgraph-invariants-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Valid graph passes
        run: python scripts/idkgraph_check.py examples/idkgraph.valid.json --json
      - name: Cyclic executable graph fails closed
        shell: bash
        run: |
          if python scripts/idkgraph_check.py examples/idkgraph.invalid-cycle.json --json; then
            echo 'Expected invalid cycle fixture to fail' >&2
            exit 1
          fi
