name: IDKMesh Evolution Loop

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  # Trusted metadata observation. pull_request_target runs the workflow definition
  # from the default branch; this job never checks out or executes PR-head code.
  pull_request_target:
    types: [opened, closed, reopened, synchronize, ready_for_review, converted_to_draft]
  # PR-head event is used only by the token-minimal deterministic test job below.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

# No workflow-wide token authority. Each job receives only its explicit minimum.
permissions: {}

# One run per ref at a time. A superseded pull-request run is cancelled: nobody
# reads the result for a commit that has already been replaced. Runs on a
# branch or a schedule are queued instead, never cancelled -- several of these
# workflows upload the evidence artifact for their commit, and cancelling such
# a run destroys that record with nothing left to re-read it from.
concurrency:
  group: evolution-loop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  observe:
    # Never run the live observer from a pull_request-controlled workflow definition.
    # Trusted PR metadata arrives only through pull_request_target; scheduled snapshots
    # observe review changes without granting a review event a checkpoint-producing job.
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    concurrency:
      # Artifact-backed Bayesian state must have one successor lineage. The observer
      # converges to the newest state rather than forking from concurrent restores.
      # Advisory PR-target observations cannot become canonical checkpoint parents,
      # so isolate them: a PR-close event must not cancel the canonical main-push
      # observation that the merge just triggered.
      #
      # The advisory side is keyed per pull request. It used to be one global
      # `advisory` group with cancel-in-progress, so every pull request shared one
      # slot and each new observation cancelled whichever was running -- with N
      # pull requests touched together, N-1 reported a red `observe` check that
      # meant nothing. Canonical stays unkeyed on purpose: that single lineage is
      # the property the comment above is protecting.
      group: evolution-observer-${{ github.event_name == 'pull_request_target' && format('advisory-{0}', github.event.pull_request.number) || 'canonical' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify checked-in persistent and live implementations
        run: |
          python -m py_compile \
            scripts/evolution_math.py \
            scripts/checkpoint_manifest.py \
            scripts/evolution_score.py \
            scripts/evolution_snapshot.py \
            scripts/repository_evolution_score.py \
            scripts/conjunctive_evolution_control.py \
            tests/test_evolution_math.py \
            tests/test_evolution_observer.py \
            tests/test_conjunctive_evolution_control.py \
            tests/test_checkpoint_manifest.py \
            tests/test_evolution_checkpoint_validation.py \
            tests/test_evolution_workflow_security.py
          python -m unittest -v \
            tests.test_evolution_math \
            tests.test_evolution_observer \
            tests.test_conjunctive_evolution_control \
            tests.test_checkpoint_manifest \
            tests.test_evolution_checkpoint_validation \
            tests.test_evolution_workflow_security

      - name: Normalize event kind
        id: event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            kind="schedule.audit"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            kind="workflow_dispatch.manual"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            kind="push.main"
          elif [[ "$EVENT_NAME" == "pull_request_target" && "$EVENT_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
            kind="pull_request.merged"
          elif [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            kind="pull_request.${EVENT_ACTION:-unknown}"
          else
            kind="${EVENT_NAME}.${EVENT_ACTION:-unknown}"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Find latest successful default-branch Bayesian checkpoint
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          selected=""
          selected_head_sha=""
          selected_event=""
          rows="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/evolution-loop.yml/runs?branch=${DEFAULT_BRANCH}&status=success&exclude_pull_requests=true&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "issues" or .event == "push" or .event == "workflow_dispatch" or .event == "schedule") | [.id, .head_sha, .event] | @tsv')"
          while IFS=$'\t' read -r run_id head_sha run_event; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "invalid workflow run id" >&2; exit 1; }
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid workflow head SHA" >&2; exit 1; }
            [[ "$run_event" =~ ^[a-z_]+$ ]] || { echo "invalid workflow event" >&2; exit 1; }
            artifact_name="evolution-checkpoint-v2-${run_id}"
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
            count="$(jq --arg name "$artifact_name" \
              '[.artifacts[] | select(.expired == false and .name == $name)] | length' \
              <<<"$artifacts")"
            if [[ "$count" -gt 1 ]]; then
              echo "multiple unexpired checkpoints named ${artifact_name}" >&2
              exit 1
            fi
            if [[ "$count" -eq 1 ]]; then
              selected="$run_id"
              selected_head_sha="$head_sha"
              selected_event="$run_event"
              break
            fi
          done <<<"$rows"
          echo "run_id=${selected}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${selected_head_sha}" >> "$GITHUB_OUTPUT"
          echo "event_name=${selected_event}" >> "$GITHUB_OUTPUT"

      - name: Download previous trusted Bayesian checkpoint
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evolution-checkpoint-v2-${{ steps.previous.outputs.run_id }}
          path: /tmp/previous-evolution
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Restore Bayesian checkpoint or use repository seed
        id: checkpoint
        shell: bash
        env:
          SELECTED_RUN_ID: ${{ steps.previous.outputs.run_id }}
          SELECTED_HEAD_SHA: ${{ steps.previous.outputs.head_sha }}
          SELECTED_EVENT_NAME: ${{ steps.previous.outputs.event_name }}
        run: |
          set -euo pipefail
          source="repository-seed"
          if [[ -n "$SELECTED_RUN_ID" ]]; then
            test -f /tmp/previous-evolution/state/evolution-state.json
            test -f /tmp/previous-evolution/state/evolution-events.jsonl
            test -f /tmp/previous-evolution/state/evolution-checkpoint-manifest.json
            parent_run_id="$(jq -r '.provenance.parent_run_id // empty' /tmp/previous-evolution/state/evolution-checkpoint-manifest.json)"
            verify_args=(
              verify
              --manifest /tmp/previous-evolution/state/evolution-checkpoint-manifest.json
              --repository "$GITHUB_REPOSITORY"
              --workflow evolution-loop.yml
              --run-id "$SELECTED_RUN_ID"
              --head-sha "$SELECTED_HEAD_SHA"
              --event-name "$SELECTED_EVENT_NAME"
              --file evolution-state.json=/tmp/previous-evolution/state/evolution-state.json
              --file evolution-events.jsonl=/tmp/previous-evolution/state/evolution-events.jsonl
            )
            if [[ -n "$parent_run_id" ]]; then
              verify_args+=(--parent-run-id "$parent_run_id")
            fi
            python scripts/checkpoint_manifest.py "${verify_args[@]}"
            PYTHONPATH=scripts python - \
              /tmp/previous-evolution/state/evolution-state.json \
              /tmp/previous-evolution/state/evolution-events.jsonl <<'PY'
          import sys
          from evolution_score import load_event_ledger, load_json, validate_event_ledger, validate_evolution_state

          state = load_json(sys.argv[1])
          validate_evolution_state(state)
          validate_event_ledger(state, load_event_ledger(sys.argv[2]))
          PY
            cp /tmp/previous-evolution/state/evolution-state.json state/evolution-state.json
            cp /tmp/previous-evolution/state/evolution-events.jsonl state/evolution-events.jsonl
            source="trusted-main-artifact:${SELECTED_RUN_ID}"
          fi
          echo "source=${source}" >> "$GITHUB_OUTPUT"

      - name: Update persistent Bayesian history
        run: |
          python scripts/evolution_score.py \
            --kind '${{ steps.event.outputs.kind }}' \
            --actor '${{ github.actor }}' \
            --repository '${{ github.repository }}' \
            --ref '${{ github.ref }}' \
            --run-id '${{ github.run_id }}' \
            --source '${{ github.event_name }}' \
            --checkpoint-source '${{ steps.checkpoint.outputs.source }}'

      - name: Collect bounded live repository evidence
        id: observation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/evolution_snapshot.py \
            --repository '${{ github.repository }}' \
            --event-kind '${{ steps.event.outputs.kind }}' \
            --run-id '${{ github.run_id }}' \
            --output results/evolution/repository-snapshot.json \
            2>"$RUNNER_TEMP/evolution-observation-error.txt"
          status=$?
          set -e
          if [[ "$status" -eq 75 ]]; then
            cat "$RUNNER_TEMP/evolution-observation-error.txt" >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=github_api_rate_limit" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            cat "$RUNNER_TEMP/evolution-observation-error.txt" >&2
            exit "$status"
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Evaluate multi-algorithm live evolution policy
        if: steps.observation.outputs.available == 'true'
        run: |
          python scripts/repository_evolution_score.py \
            --snapshot results/evolution/repository-snapshot.json \
            --policy config/evolution-policy-v1.json \
            --output results/evolution/evolution-decision.json \
            --report results/evolution/EVOLUTION_REPORT.md

      - name: Evaluate conjunctive history plus live guards
        if: steps.observation.outputs.available == 'true'
        run: |
          python scripts/conjunctive_evolution_control.py \
            --history state/evolution-state.json \
            --math-policy state/evolution-math-policy.json \
            --live results/evolution/evolution-decision.json \
            --live-policy config/evolution-policy-v1.json \
            --output results/evolution/conjunctive-control.json \
            --report results/evolution/CONJUNCTIVE_CONTROL_REPORT.md

      - name: Validate generated evidence and state
        if: steps.observation.outputs.available == 'true'
        run: |
          python -m json.tool state/evolution-state.json >/dev/null
          python -m json.tool state/evolution-math-policy.json >/dev/null
          python -m json.tool config/evolution-policy-v1.json >/dev/null
          python -m json.tool results/evolution/repository-snapshot.json >/dev/null
          python -m json.tool results/evolution/evolution-decision.json >/dev/null
          python -m json.tool results/evolution/conjunctive-control.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for line in Path('state/evolution-events.jsonl').read_text().splitlines():
              if line.strip():
                  json.loads(line)
          print('Bayesian history, live observation, and conjunctive control are valid')
          PY

      - name: Bind checkpoint files to trusted run provenance
        env:
          PARENT_RUN_ID: ${{ steps.previous.outputs.run_id }}
        run: |
          set -euo pipefail
          manifest_args=(
            create
            --manifest state/evolution-checkpoint-manifest.json
            --repository "$GITHUB_REPOSITORY"
            --workflow evolution-loop.yml
            --run-id "$GITHUB_RUN_ID"
            --head-sha "$GITHUB_SHA"
            --event-name "$GITHUB_EVENT_NAME"
            --file evolution-state.json=state/evolution-state.json
            --file evolution-events.jsonl=state/evolution-events.jsonl
          )
          if [[ -n "$PARENT_RUN_ID" ]]; then
            manifest_args+=(--parent-run-id "$PARENT_RUN_ID")
          fi
          python scripts/checkpoint_manifest.py "${manifest_args[@]}"

      - name: Publish persistent checkpoint and live evidence
        if: steps.observation.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evolution-checkpoint-v2-${{ github.run_id }}
          path: |
            EVOLUTION_REPORT.md
            state/evolution-state.json
            state/evolution-events.jsonl
            state/evolution-checkpoint-manifest.json
            state/evolution-math-policy.json
            config/evolution-policy-v1.json
            results/evolution/
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        if: steps.observation.outputs.available == 'true'
        run: |
          echo "# Persistent Bayesian history" >> "$GITHUB_STEP_SUMMARY"
          cat EVOLUTION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "# Recomputed live repository observatory" >> "$GITHUB_STEP_SUMMARY"
          cat results/evolution/EVOLUTION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat results/evolution/CONJUNCTIVE_CONTROL_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record fail-closed unavailable observation
        if: steps.observation.outputs.available != 'true'
        run: |
          echo "# Evolution observation unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub API rate-limit exhaustion prevented a complete live snapshot." >> "$GITHUB_STEP_SUMMARY"
          echo "No decision, recommendation, or Bayesian checkpoint was published; authority remains fail-closed." >> "$GITHUB_STEP_SUMMARY"

  verify-pr-head:
    # Proposed code receives only public-repository contents read authority and no
    # explicitly exported repository token/secrets. It cannot invoke the live API.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    concurrency:
      group: evolution-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out proposed PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test deterministic persistent, live, and conjunctive policies
        run: |
          python -m py_compile \
            scripts/evolution_math.py \
            scripts/checkpoint_manifest.py \
            scripts/evolution_score.py \
            scripts/evolution_snapshot.py \
            scripts/repository_evolution_score.py \
            scripts/conjunctive_evolution_control.py \
            tests/test_checkpoint_manifest.py \
            tests/test_evolution_checkpoint_validation.py \
            tests/test_evolution_workflow_security.py
          python -m unittest -v \
            tests.test_evolution_math \
            tests.test_evolution_observer \
            tests.test_conjunctive_evolution_control \
            tests.test_checkpoint_manifest \
            tests.test_evolution_checkpoint_validation \
            tests.test_evolution_workflow_security
          python -m json.tool state/evolution-math-policy.json >/dev/null
          python -m json.tool config/evolution-policy-v1.json >/dev/null
