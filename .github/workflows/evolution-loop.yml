name: IDKMesh Evolution Loop

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  # Trusted metadata observation. pull_request_target runs the workflow definition
  # from the default branch; this job never checks out or executes PR-head code.
  pull_request_target:
    types: [opened, closed, reopened, synchronize, ready_for_review, converted_to_draft]
  # PR-head event is used only by the token-minimal deterministic test job below.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

# No workflow-wide token authority. Each job receives only its explicit minimum.
permissions: {}

jobs:
  observe:
    # Never run the live observer from a pull_request-controlled workflow definition.
    # On PR activity the observer arrives through pull_request_target, whose YAML and
    # checked-out implementation both come from the trusted default branch.
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    concurrency:
      group: evolution-observer
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Normalize event kind
        id: event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            kind="schedule.audit"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            kind="workflow_dispatch.manual"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            kind="push.main"
          elif [[ "$EVENT_NAME" == "pull_request_target" && "$EVENT_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
            kind="pull_request.merged"
          elif [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            kind="pull_request.${EVENT_ACTION:-unknown}"
          else
            kind="${EVENT_NAME}.${EVENT_ACTION:-unknown}"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Verify observer implementation
        run: |
          python -m py_compile scripts/evolution_snapshot.py scripts/evolution_score.py tests/test_evolution_observer.py
          python -m unittest tests.test_evolution_observer -v

      - name: Collect bounded live repository evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/evolution_snapshot.py \
            --repository '${{ github.repository }}' \
            --event-kind '${{ steps.event.outputs.kind }}' \
            --run-id '${{ github.run_id }}' \
            --output results/evolution/repository-snapshot.json

      - name: Evaluate multi-algorithm evolution policy
        run: |
          python scripts/evolution_score.py \
            --snapshot results/evolution/repository-snapshot.json \
            --policy config/evolution-policy-v1.json \
            --output results/evolution/evolution-decision.json \
            --report results/evolution/EVOLUTION_REPORT.md

      - name: Validate generated evidence
        run: |
          python -m json.tool results/evolution/repository-snapshot.json >/dev/null
          python -m json.tool results/evolution/evolution-decision.json >/dev/null

      - name: Publish evolution observation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evolution-observation-${{ github.run_id }}
          path: results/evolution/
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        run: cat results/evolution/EVOLUTION_REPORT.md >> "$GITHUB_STEP_SUMMARY"

  verify-pr-head:
    # Proposed code receives only public-repository contents read authority and no
    # explicitly exported repository token/secrets. It cannot invoke the live API.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    concurrency:
      group: evolution-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test deterministic observer policy
        run: |
          python -m py_compile scripts/evolution_snapshot.py scripts/evolution_score.py tests/test_evolution_observer.py
          python -m unittest tests.test_evolution_observer -v
