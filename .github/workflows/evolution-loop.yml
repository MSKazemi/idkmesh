name: IDKMesh Evolution Loop

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  # Trusted metadata observation. pull_request_target runs the workflow definition
  # from the default branch; this job never checks out or executes PR-head code.
  pull_request_target:
    types: [opened, closed, reopened, synchronize, ready_for_review, converted_to_draft]
  # PR-head event is used only by the token-minimal deterministic test job below.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

# No workflow-wide token authority. Each job receives only its explicit minimum.
permissions: {}

jobs:
  observe:
    # Never run the live observer from a pull_request-controlled workflow definition.
    # On PR activity the observer arrives through pull_request_target, whose YAML and
    # checked-out implementation both come from the trusted default branch.
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    concurrency:
      # Artifact-backed Bayesian state must have one successor lineage. The observer
      # converges to the newest state rather than forking from concurrent restores.
      group: evolution-observer
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Normalize event kind
        id: event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            kind="schedule.audit"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            kind="workflow_dispatch.manual"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            kind="push.main"
          elif [[ "$EVENT_NAME" == "pull_request_target" && "$EVENT_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
            kind="pull_request.merged"
          elif [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            kind="pull_request.${EVENT_ACTION:-unknown}"
          else
            kind="${EVENT_NAME}.${EVENT_ACTION:-unknown}"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Find latest successful default-branch Bayesian checkpoint
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          selected=""
          for run_id in $(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/evolution-loop.yml/runs?branch=${DEFAULT_BRANCH}&status=success&per_page=20" \
            --jq '.workflow_runs[].id'); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '[.artifacts[] | select(.expired == false and (.name | startswith("evolution-checkpoint-")))] | length' || echo 0)"
            if [[ "$count" -gt 0 ]]; then
              selected="$run_id"
              break
            fi
          done
          echo "run_id=${selected}" >> "$GITHUB_OUTPUT"

      - name: Download previous trusted Bayesian checkpoint
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evolution-checkpoint-*
          path: /tmp/previous-evolution
          merge-multiple: true
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Restore Bayesian checkpoint or use repository seed
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          source="repository-seed"
          if [[ -f /tmp/previous-evolution/state/evolution-state.json ]]; then
            cp /tmp/previous-evolution/state/evolution-state.json state/evolution-state.json
            if [[ -f /tmp/previous-evolution/state/evolution-events.jsonl ]]; then
              cp /tmp/previous-evolution/state/evolution-events.jsonl state/evolution-events.jsonl
            fi
            source="trusted-main-artifact:${{ steps.previous.outputs.run_id }}"
          fi
          echo "source=${source}" >> "$GITHUB_OUTPUT"

      - name: Verify persistent and live mathematical implementations
        run: |
          python -m py_compile \
            scripts/evolution_math.py \
            scripts/evolution_score.py \
            scripts/evolution_snapshot.py \
            scripts/repository_evolution_score.py \
            scripts/conjunctive_evolution_control.py \
            tests/test_evolution_math.py \
            tests/test_evolution_observer.py \
            tests/test_conjunctive_evolution_control.py
          python -m unittest -v \
            tests.test_evolution_math \
            tests.test_evolution_observer \
            tests.test_conjunctive_evolution_control

      - name: Update persistent Bayesian history
        run: |
          python scripts/evolution_score.py \
            --kind '${{ steps.event.outputs.kind }}' \
            --actor '${{ github.actor }}' \
            --repository '${{ github.repository }}' \
            --ref '${{ github.ref }}' \
            --run-id '${{ github.run_id }}' \
            --source '${{ github.event_name }}' \
            --checkpoint-source '${{ steps.checkpoint.outputs.source }}'

      - name: Collect bounded live repository evidence
        id: observation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/evolution_snapshot.py \
            --repository '${{ github.repository }}' \
            --event-kind '${{ steps.event.outputs.kind }}' \
            --run-id '${{ github.run_id }}' \
            --output results/evolution/repository-snapshot.json \
            2>"$RUNNER_TEMP/evolution-observation-error.txt"
          status=$?
          set -e
          if [[ "$status" -eq 75 ]]; then
            cat "$RUNNER_TEMP/evolution-observation-error.txt" >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=github_api_rate_limit" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            cat "$RUNNER_TEMP/evolution-observation-error.txt" >&2
            exit "$status"
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Evaluate multi-algorithm live evolution policy
        if: steps.observation.outputs.available == 'true'
        run: |
          python scripts/repository_evolution_score.py \
            --snapshot results/evolution/repository-snapshot.json \
            --policy config/evolution-policy-v1.json \
            --output results/evolution/evolution-decision.json \
            --report results/evolution/EVOLUTION_REPORT.md

      - name: Evaluate conjunctive history plus live guards
        if: steps.observation.outputs.available == 'true'
        run: |
          python scripts/conjunctive_evolution_control.py \
            --history state/evolution-state.json \
            --math-policy state/evolution-math-policy.json \
            --live results/evolution/evolution-decision.json \
            --live-policy config/evolution-policy-v1.json \
            --output results/evolution/conjunctive-control.json \
            --report results/evolution/CONJUNCTIVE_CONTROL_REPORT.md

      - name: Validate generated evidence and state
        if: steps.observation.outputs.available == 'true'
        run: |
          python -m json.tool state/evolution-state.json >/dev/null
          python -m json.tool state/evolution-math-policy.json >/dev/null
          python -m json.tool config/evolution-policy-v1.json >/dev/null
          python -m json.tool results/evolution/repository-snapshot.json >/dev/null
          python -m json.tool results/evolution/evolution-decision.json >/dev/null
          python -m json.tool results/evolution/conjunctive-control.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for line in Path('state/evolution-events.jsonl').read_text().splitlines():
              if line.strip():
                  json.loads(line)
          print('Bayesian history, live observation, and conjunctive control are valid')
          PY

      - name: Publish persistent checkpoint and live evidence
        if: steps.observation.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evolution-checkpoint-${{ github.run_id }}
          path: |
            EVOLUTION_REPORT.md
            state/evolution-state.json
            state/evolution-events.jsonl
            state/evolution-math-policy.json
            config/evolution-policy-v1.json
            results/evolution/
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        if: steps.observation.outputs.available == 'true'
        run: |
          echo "# Persistent Bayesian history" >> "$GITHUB_STEP_SUMMARY"
          cat EVOLUTION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "# Recomputed live repository observatory" >> "$GITHUB_STEP_SUMMARY"
          cat results/evolution/EVOLUTION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat results/evolution/CONJUNCTIVE_CONTROL_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record fail-closed unavailable observation
        if: steps.observation.outputs.available != 'true'
        run: |
          echo "# Evolution observation unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub API rate-limit exhaustion prevented a complete live snapshot." >> "$GITHUB_STEP_SUMMARY"
          echo "No decision, recommendation, or Bayesian checkpoint was published; authority remains fail-closed." >> "$GITHUB_STEP_SUMMARY"

  verify-pr-head:
    # Proposed code receives only public-repository contents read authority and no
    # explicitly exported repository token/secrets. It cannot invoke the live API.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    concurrency:
      group: evolution-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out proposed PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test deterministic persistent, live, and conjunctive policies
        run: |
          python -m py_compile \
            scripts/evolution_math.py \
            scripts/evolution_score.py \
            scripts/evolution_snapshot.py \
            scripts/repository_evolution_score.py \
            scripts/conjunctive_evolution_control.py
          python -m unittest -v \
            tests.test_evolution_math \
            tests.test_evolution_observer \
            tests.test_conjunctive_evolution_control
          python -m json.tool state/evolution-math-policy.json >/dev/null
          python -m json.tool config/evolution-policy-v1.json >/dev/null
