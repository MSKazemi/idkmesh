name: Gate Audit Action Self-Test

on:
  push:
    branches: [main]
    paths:
      - "actions/gate-audit/**"
      - "idkmesh/**"
      - "pyproject.toml"
      - "examples/gate-audit/**"
      - ".github/workflows/gate-audit-action-selftest.yml"
  pull_request:
    paths:
      - "actions/gate-audit/**"
      - "idkmesh/**"
      - "pyproject.toml"
      - "examples/gate-audit/**"
      - ".github/workflows/gate-audit-action-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-audit-action-selftest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run the gate-audit action on the committed example
        id: audit
        uses: ./actions/gate-audit
        with:
          votes-file: examples/gate-audit/panel-votes.example.json
          report-file: selftest-report.json
          markdown-file: selftest-report.md

      - name: Assert the action reproduces the committed report example
        run: |
          python - <<'EOF'
          from pathlib import Path

          produced = Path("selftest-report.json").read_bytes()
          committed = Path(
              "examples/gate-audit/gate-audit-report.example.json").read_bytes()
          assert produced == committed, (
              "action output is not byte-identical to the committed example report")
          summary = Path("selftest-report.md").read_text(encoding="utf-8")
          assert "effective independent votes" in summary
          assert "not acceptance authority" in summary
          print("action output is byte-identical to the committed example report")
          EOF

      - name: Run the action in JSON-only mode
        id: audit-json-only
        uses: ./actions/gate-audit
        with:
          votes-file: examples/gate-audit/panel-votes.example.json
          report-file: selftest-json-only-report.json
          markdown-file: ""
          job-summary: "false"

      - name: Assert JSON-only mode emits no Markdown artifact
        run: |
          python - <<'EOF'
          from pathlib import Path

          produced = Path("selftest-json-only-report.json").read_bytes()
          committed = Path(
              "examples/gate-audit/gate-audit-report.example.json").read_bytes()
          assert produced == committed, (
              "JSON-only action output is not byte-identical to the committed report")
          assert not Path("selftest-json-only-report.md").exists(), (
              "JSON-only mode unexpectedly emitted a Markdown artifact")
          print("JSON-only mode emitted the canonical JSON report and no Markdown file")
          EOF
