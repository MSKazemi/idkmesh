name: Gate Audit Action Self-Test

on:
  push:
    branches: [main]
    paths:
      - "actions/gate-audit/**"
      - "idkmesh/__init__.py"
      - "idkmesh/cli.py"
      - "idkmesh/gate_audit.py"
      - "pyproject.toml"
      - "examples/gate-audit/**"
      - ".github/workflows/gate-audit-action-selftest.yml"
  pull_request:
    paths:
      - "actions/gate-audit/**"
      - "idkmesh/__init__.py"
      - "idkmesh/cli.py"
      - "idkmesh/gate_audit.py"
      - "pyproject.toml"
      - "examples/gate-audit/**"
      - ".github/workflows/gate-audit-action-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-audit-action-selftest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run the gate-audit action on the committed example
        id: audit
        uses: ./actions/gate-audit
        with:
          votes-file: examples/gate-audit/panel-votes.example.json
          report-file: selftest-report.json
          markdown-file: selftest-report.md

      - name: Assert the action reproduces the committed report example
        run: |
          python - <<'EOF'
          from pathlib import Path

          produced = Path("selftest-report.json").read_bytes()
          committed = Path(
              "examples/gate-audit/gate-audit-report.example.json").read_bytes()
          assert produced == committed, (
              "action output is not byte-identical to the committed example report")
          summary = Path("selftest-report.md").read_text(encoding="utf-8")
          assert "effective independent votes" in summary
          assert "not acceptance authority" in summary
          print("action output is byte-identical to the committed example report")
          EOF

      - name: Run the action in JSON-only mode with default job-summary behavior
        id: audit-json-only
        uses: ./actions/gate-audit
        with:
          votes-file: examples/gate-audit/panel-votes.example.json
          report-file: selftest-json-only-report.json
          markdown-file: ""

      - name: Assert JSON-only mode emits no Markdown artifact
        env:
          REPORT_OUTPUT: ${{ steps.audit-json-only.outputs.report-file }}
          MARKDOWN_OUTPUT: ${{ steps.audit-json-only.outputs.markdown-file }}
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path

          produced = Path("selftest-json-only-report.json").read_bytes()
          committed = Path(
              "examples/gate-audit/gate-audit-report.example.json").read_bytes()
          assert produced == committed, (
              "JSON-only action output is not byte-identical to the committed report")
          assert not Path("selftest-json-only-report.md").exists(), (
              "JSON-only mode unexpectedly emitted a Markdown artifact")
          assert os.environ["REPORT_OUTPUT"] == "selftest-json-only-report.json", (
              "JSON-only mode exposed the wrong report-file output")
          assert os.environ["MARKDOWN_OUTPUT"] == "", (
              "JSON-only mode did not expose an empty markdown-file output")
          print(
              "JSON-only mode emitted canonical JSON, no Markdown artifact, and "
              "reported matching action outputs")
          EOF

      - name: Run the action with bootstrap uncertainty enabled
        id: audit-bootstrap
        uses: ./actions/gate-audit
        with:
          votes-file: examples/gate-audit/panel-votes.example.json
          report-file: selftest-bootstrap-report.json
          markdown-file: ""
          bootstrap: "true"

      - name: Assert bootstrap mode reproduces the committed v0.2 example
        run: |
          python - <<'EOF'
          # Compared by value with a tight float tolerance, not byte-for-byte:
          # phi()'s plain sum() over floats changed summation algorithm
          # between Python 3.11 and 3.12+ (see assert_close in
          # tests/test_gate_audit_uncertainty.py), so a seeded bootstrap can
          # round a correlation to a different last representable bit across
          # interpreter versions even though the resampling itself is exactly
          # reproducible.
          import json
          from pathlib import Path

          def assert_close(actual, expected, path="$"):
              if isinstance(expected, float) and isinstance(actual, float):
                  assert abs(actual - expected) < 1e-9, (
                      f"{path}: {actual!r} != {expected!r}")
              elif isinstance(expected, dict) and isinstance(actual, dict):
                  assert set(actual) == set(expected), path
                  for key in expected:
                      assert_close(actual[key], expected[key], f"{path}.{key}")
              elif isinstance(expected, list) and isinstance(actual, list):
                  assert len(actual) == len(expected), path
                  for i, (a, e) in enumerate(zip(actual, expected)):
                      assert_close(a, e, f"{path}[{i}]")
              else:
                  assert actual == expected, f"{path}: {actual!r} != {expected!r}"

          produced = json.loads(
              Path("selftest-bootstrap-report.json").read_text(encoding="utf-8"))
          committed = json.loads(
              Path("examples/gate-audit/gate-audit-report-v0.2.example.json")
              .read_text(encoding="utf-8"))
          assert_close(produced, committed)
          print(
              "bootstrap action output matches the committed v0.2 example "
              "report (float tolerance 1e-9)")
          EOF
