name: Visibility and Community Observatory

on:
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/visibility-observatory.yml"
      - "config/seo-topics-v1.json"
      - "config/discovery-query-portfolio-v0.1.json"
      - "config/visibility-growth-policy-v0.1.json"
      - "scripts/discovery_query_portfolio.py"
      - "scripts/search_console_snapshot.py"
      - "scripts/visibility_growth_selector.py"
      - "scripts/visibility_observatory.py"

permissions:
  contents: read

concurrency:
  group: visibility-community-observatory
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test visibility and query-portfolio observatories
        run: |
          python -m unittest \
            tests.test_visibility_observatory \
            tests.test_discovery_query_portfolio \
            tests.test_search_console_snapshot \
            tests.test_visibility_growth_selector \
            -v

      - name: Validate discovery query portfolio
        run: |
          python scripts/discovery_query_portfolio.py \
            --portfolio config/discovery-query-portfolio-v0.1.json \
            --root . \
            --output results/visibility/query-portfolio.json

      - name: Collect visibility and acquisition evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/visibility_observatory.py \
            --repository '${{ github.repository }}' \
            --docs-dir docs \
            --output results/visibility/observatory.json

      - name: Detect Search Console configuration
        id: gsc
        env:
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          configured=false
          if [[ -n "$GSC_SITE_URL" && -n "$GSC_ACCESS_TOKEN" ]]; then
            configured=true
          elif [[ -n "$GSC_SITE_URL" && -n "$GSC_REFRESH_TOKEN" && -n "$GSC_CLIENT_ID" && -n "$GSC_CLIENT_SECRET" ]]; then
            configured=true
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Collect Google Search Console evidence
        if: steps.gsc.outputs.configured == 'true'
        env:
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
        run: |
          python scripts/search_console_snapshot.py \
            --site-url "$GSC_SITE_URL" \
            --page-prefix "https://mskazemi.com/idkmesh/" \
            --portfolio config/discovery-query-portfolio-v0.1.json \
            --days 28 \
            --lag-days 3 \
            --output results/visibility/google-search-console.json

      - name: Select one bounded growth experiment
        run: |
          args=( \
            --visibility results/visibility/observatory.json \
            --portfolio results/visibility/query-portfolio.json \
            --policy config/visibility-growth-policy-v0.1.json \
            --output results/visibility/growth-experiment.json \
          )
          if [[ -f results/visibility/google-search-console.json ]]; then
            args+=(--search-console results/visibility/google-search-console.json)
          fi
          python scripts/visibility_growth_selector.py "${args[@]}"

      - name: Publish bounded summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("results/visibility/observatory.json").read_text())
          discovery = result["github"]["discovery"]
          acquisition = result["github"]["community_acquisition"]
          site = result["site"]
          portfolio = json.loads(Path("results/visibility/query-portfolio.json").read_text())
          query_summary = portfolio["summary"]
          gsc_path = Path("results/visibility/google-search-console.json")
          gsc = json.loads(gsc_path.read_text()) if gsc_path.exists() else None
          experiment = json.loads(Path("results/visibility/growth-experiment.json").read_text())
          selected = experiment["selected_experiment"]
          lines = [
              "# Visibility and Community Observatory",
              "",
              "> Discovery/acquisition diagnostics only. Popularity is not correctness or integration evidence.",
              "",
              f"- Stars: {discovery['stars']}",
              f"- Forks: {discovery['forks']}",
              f"- Subscribers: {discovery['subscribers']}",
              f"- External commit contributors observed: {acquisition['external_commit_contributors_observed']}",
              f"- Contributor page truncated: {acquisition['contributors_page_truncated']}",
              f"- HTML pages audited: {site['html_pages']}",
              f"- Technical SEO/AEO coverage: {site['technical_coverage']}",
              f"- Sitemap URLs: {site['sitemap']['url_count']}",
              f"- Non-branded query hypotheses: {query_summary['queries']}",
              f"- Intent clusters: {query_summary['clusters']}",
              f"- Canonical search targets: {query_summary['distinct_canonical_targets']}",
              f"- Max query hypotheses on one target: {query_summary['max_queries_on_one_canonical_target']}",
              (
                  f"- Search Console non-branded impressions (28d): {gsc['summary']['nonbranded']['impressions']}"
                  if gsc else
                  "- Search Console: not configured"
              ),
              (
                  f"- Search Console portfolio queries observed (exact): {gsc['summary']['portfolio_queries_with_observations']}"
                  if gsc else
                  "- Search Console portfolio observations: unavailable"
              ),
              f"- Selected bounded experiment: {selected['id']} ({selected['type']})",
              f"- Experiment reason: {selected['reason']}",
              "",
              "## Known measurement gaps",
              "",
              *[f"- {gap}" for gap in result["gaps"]],
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Upload visibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visibility-observatory-${{ github.run_id }}
          path: results/visibility/
          retention-days: 30
          if-no-files-found: error
