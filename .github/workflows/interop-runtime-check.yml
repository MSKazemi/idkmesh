name: Interoperability and runtime check

on:
  pull_request:
    paths:
      - "interop/**"
      - "node/**"
      - "schemas/**"
      - "examples/**"
      - "experiments/**"
      - "requirements-phase0.txt"
      - ".github/workflows/interop-runtime-check.yml"
  push:
    branches: [main]
    paths:
      - "interop/**"
      - "node/**"
      - "schemas/**"
      - "examples/**"
      - "experiments/**"
      - "requirements-phase0.txt"
      - ".github/workflows/interop-runtime-check.yml"

permissions:
  contents: read

jobs:
  contracts-and-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependency
        run: python -m pip install -r requirements-phase0.txt
      - name: Validate canonical Phase 0 contracts
        run: python experiments/harness.py validate
      - name: Test A2A and MCP semantic bindings
        run: python -m unittest discover -s interop/tests -v
      - name: Test canonical local worker runtime
        env:
          PYTHONPATH: node/src
        run: python -m unittest discover -s node/tests -v
      - name: Validate runnable local Work Unit example
        env:
          PYTHONPATH: node/src
        run: python -m idkmesh_node validate node/examples/canonical-doc-probe.work-unit.json

# This workflow never executes the Docker-backed Work Unit. It validates contracts,
# pure binding logic, and mocked runtime behavior only. Real sandbox execution stays
# an explicit local acceptance test until the threat model and CI policy mature.
