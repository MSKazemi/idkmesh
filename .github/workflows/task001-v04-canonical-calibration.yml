name: Task 001 canonical v0.4 calibration

on:
  pull_request:
    paths:
      - "tools/task001_evaluator_calibration_v04.py"
      - "tools/task001_evaluator_calibration_v04_ci.py"
      - "verification/fixtures/task001-transformation-calibration-evaluator-plan-v0.4.json"
      - "docs/conversations/2026-08-28-continuation-benchmark-calibration-and-node-refresh.md"
      - ".github/workflows/task001-v04-canonical-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evaluator-owned current tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: evaluator
          persist-credentials: false

      - name: Check out exact burned-pilot source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9c53bb4069a5db1c0688dbbe7a8f028540cbf7c2
          path: source
          persist-credentials: false

      - name: Verify frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "9c53bb4069a5db1c0688dbbe7a8f028540cbf7c2"
          test -z "$(git -C source status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verifier dependency
        working-directory: evaluator
        run: python -m pip install -r requirements-phase0.txt

      - name: Prove canonical v0.4 implementation is the one under calibration
        working-directory: evaluator
        run: |
          set -euo pipefail
          test -f experiments/transition_patch_verifier.py
          test ! -f experiments/transformation_patch_verifier.py
          python -m py_compile \
            experiments/evaluator_plan_runner.py \
            experiments/transition_patch_verifier.py \
            tools/task001_evaluator_calibration_v04.py \
            tools/task001_evaluator_calibration_v04_ci.py
          python -m unittest tests.test_patch_evaluator_transition_v04 -v

      - name: Calibrate straightforward fix against inert decoy
        working-directory: evaluator
        run: |
          set -euo pipefail
          python tools/task001_evaluator_calibration_v04_ci.py \
            --source ../source \
            --output-root results/verification/task001-v04-canonical-calibration

      - name: Assert calibration result and authority boundary
        working-directory: evaluator
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('results/verification/task001-v04-canonical-calibration/calibration-summary.json')
          value = json.loads(path.read_text())
          assert value['calibration_passed'] is True
          assert value['verifier_adapter_version'] == '0.3.0'
          assert value['straightforward']['verification_status'] == 'passed'
          assert value['straightforward']['recommendation'] == 'accept_candidate'
          assert value['straightforward']['behavior_all_rejected_as_unsafe_path'] is True
          assert value['inert_decoy']['verification_status'] == 'failed'
          assert value['inert_decoy']['recommendation'] == 'reject_candidate'
          assert value['inert_decoy']['behavior_all_accepted'] is True
          assert value['metadata_only_verifier_executes_candidate_code'] is False
          assert value['behavioral_execution_is_separate_evidence_channel'] is True
          assert value['automatic_candidate_selection'] is False
          assert value['merge_authority'] is False
          print('canonical v0.4 Task 001 calibration passed without authority escalation')
          PY

      - name: Publish calibration summary
        if: always()
        shell: bash
        run: |
          SUMMARY="evaluator/results/verification/task001-v04-canonical-calibration/calibration-summary.json"
          if test -f "$SUMMARY"; then
            echo '### Task 001 canonical v0.4 calibration' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Calibration summary was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task001-v04-canonical-calibration
          path: evaluator/results/verification/task001-v04-canonical-calibration/
          if-no-files-found: error
          retention-days: 14

# Scientific / authority boundary:
# - the verifier implementation under test is the canonical v0.4 path merged in #171;
# - no second EvaluatorPlan schema, runner, or transition-verifier implementation is introduced;
# - the burned v1 WorkUnit/EvaluatorPlan/definition digest are not rewritten;
# - post-burn straightforward and inert-decoy candidates are calibration objects, not scored benchmark outcomes;
# - metadata-only verification executes no candidate code;
# - behavioral CLI execution is a separate explicit evaluator-owned evidence channel over exact frozen public source;
# - workflow permissions are contents:read, checkout credentials are not persisted, and no secrets are used;
# - no canonical write, push, approval, merge, spending, or automatic candidate-selection authority exists.
