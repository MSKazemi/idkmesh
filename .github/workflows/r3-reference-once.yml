name: R3 Reference One Shot

on:
  push:
    branches:
      - experiment/r3-reference-seed42
    paths:
      - ".github/workflows/r3-reference-once.yml"

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen R3 seed-42 reference
        run: |
          mkdir -p results/experiments/r3
          python -m randomness_lab.r3 \
            --population 24 \
            --generations 12 \
            --trials 80 \
            --seed 42 \
            --mutation-rate 0.35 \
            --crossover-rate 0.70 \
            --exploration-floor 0.10 \
            --archive-size 40 \
            --output results/experiments/r3/reference-seed42.json \
            --report results/experiments/r3/reference-seed42.md
      - name: Validate frozen evidence
        run: |
          python -m json.tool results/experiments/r3/reference-seed42.json > /dev/null
          grep -q "Human review required" results/experiments/r3/reference-seed42.md
          grep -q "Held-out comparison" results/experiments/r3/reference-seed42.md
      - name: Commit frozen evidence to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/experiments/r3/reference-seed42.json results/experiments/r3/reference-seed42.md
          git commit -m "results: add frozen R3 reference seed 42"
          git push origin HEAD:experiment/r3-reference-seed42
