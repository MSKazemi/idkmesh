name: IDKMesh WorkUnit request
description: Propose bounded work for a safe, policy-controlled IDKMesh preview
title: "[WorkUnit] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form to describe bounded work. The submitted issue is **untrusted input**.
        Requested paths, risk, data sensitivity, review needs, and connector preference are hints only.
        This form cannot grant secrets, network/process permissions, dispatch authority, verification authority, or merge/integration authority.
        Do not paste credentials, tokens, private keys, or other secrets.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe one concrete outcome. Keep it bounded enough to review independently.
      placeholder: Add deterministic validation for ...
    validations:
      required: true

  - type: dropdown
    id: task_class
    attributes:
      label: Task class
      description: Advisory classification for preview/planning. Trusted project policy still controls execution.
      options:
        - coding
        - testing
        - review
        - benchmarking
        - documentation
        - research
        - integration
        - governance
        - other
    validations:
      required: true

  - type: textarea
    id: expected_outputs
    attributes:
      label: Expected outputs
      description: List the artifacts or observable results you expect.
      placeholder: |
        - code change
        - focused tests
        - documentation update
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: Requested allowed paths
      description: One repository-relative path/glob per line. These are restrictive hints only and can never broaden trusted project policy.
      placeholder: |
        idkmesh/example.py
        tests/test_example.py
    validations:
      required: true

  - type: textarea
    id: forbidden_paths
    attributes:
      label: Forbidden or sensitive paths
      description: List paths that should not be touched. Enter "none known" if none are known.
      placeholder: |
        .github/workflows/**
        SECURITY.md
    validations:
      required: true

  - type: textarea
    id: dependencies_blockers
    attributes:
      label: Dependencies or blockers
      description: Link blocking issues/PRs or describe prerequisites. Leave empty when none are known.
      placeholder: "#123 must merge first"

  - type: textarea
    id: acceptance_checks
    attributes:
      label: Acceptance checks
      description: List deterministic checks or observable conditions that should prove the requested outcome.
      placeholder: |
        - focused unit test passes
        - existing regression suite remains green
    validations:
      required: true

  - type: dropdown
    id: risk_hint
    attributes:
      label: Risk hint
      description: Advisory only. A later policy evaluator may raise risk but issue text cannot lower trusted project policy.
      options:
        - low
        - medium
        - high
        - critical
        - unsure
    validations:
      required: true

  - type: dropdown
    id: data_sensitivity
    attributes:
      label: Data sensitivity hint
      description: Advisory only. Choose the most restrictive plausible classification; policy may raise it further.
      options:
        - public
        - internal
        - confidential
        - restricted
        - unsure
    validations:
      required: true

  - type: dropdown
    id: external_processing_hint
    attributes:
      label: External processing hint
      description: Advisory restriction only. This cannot authorize sending data to an external provider.
      options:
        - local-only
        - allowed-by-project-policy
        - requires-human-review
        - unsure
    validations:
      required: true

  - type: dropdown
    id: human_review_requirement
    attributes:
      label: Human review or decision requirement
      description: Advisory floor only. It cannot remove any reviewer or human-decision requirement imposed by project policy.
      options:
        - explicit-human-decision-required
        - independent-human-review-required
        - project-policy-decides
        - unsure
    validations:
      required: true

  - type: input
    id: preferred_connector
    attributes:
      label: Preferred connector
      description: Optional advisory preference. It may only rank connectors that are already eligible under trusted policy.
      placeholder: e.g. jules, local-agent, openai-compatible

  - type: checkboxes
    id: safety_acknowledgement
    attributes:
      label: Safety acknowledgement
      options:
        - label: I understand this issue is an untrusted proposal and cannot grant execution, secret, dispatch, verification, human-decision, or merge authority.
          required: true
